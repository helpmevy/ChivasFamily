<style>
/* ============================================================
   TÀI LIỆU KIẾN TRÚC – ĐỌC TRƯỚC KHI SỬA
   ============================================================
   File này chứa TOÀN BỘ giao diện + logic + CSS.
   Không dùng framework, không npm, không ES module.
   Chạy bằng cách mở file:// hoặc GitHub Pages.

   CẤU TRÚC CODE (theo thứ tự trong file):
   1. CONFIG / STATE / STORAGE
   2. AUDIO HOOKS (playAudio, playSfx, getImage)
   3. QUESTION ENGINE (shuffle, pick questions, score)
   4. SCREENS (render functions)
   5. EVENT HANDLERS
   6. INIT

   QUY ƯỚC ĐẶT TÊN:
   - Unit id: "u01", "u02"...
   - Question id: "u01_q001"
   - Vocab id = tên file âm thanh/hình (bear, monkey...)
   - Skill: vocabulary | listening | phonogram | reading | dialogue | action | numbers

   THÊM DẠNG CÂU HỎI MỚI:
   - Thêm type trong renderQuestion()
   - Thêm handler trong checkAnswer()
   - Thêm data vào data/uNN.js

   HOOK ÂM THANH / HÌNH:
   - playAudio(id, textFallback)
   - playSfx(name)
   - getImage(item) → {src, emoji, color}

   BIẾN CẤU HÌNH HAY CHỈNH: window.GS_CONFIG.defaults
   ============================================================ */

:root {
  --primary: #7C9EFF;
  --secondary: #FFB347;
  --accent: #A8E6CF;
  --bg: #E8F0FF;
  --dark: #4A6FA5;
  --text: #2D3748;
  --white: #FFFFFF;
  --shadow: 0 8px 24px rgba(74, 111, 165, 0.18);
  --radius: 24px;
  --radius-sm: 16px;
  --font-title: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, sans-serif;
  --font-read: 'Andika', 'Nunito', system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-body);
  color: var(--text);
  background: var(--bg);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
body { position: relative; }

/* ===== Background layers ===== */
.bg-sky {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #B8D4FF 0%, #E8F0FF 45%, #C8E6C9 100%);
  z-index: 0;
}
.bg-hills {
  position: fixed; bottom: 0; left: 0; right: 0; height: 28%;
  background: linear-gradient(180deg, transparent 0%, #A8D5A2 30%, #7CB87C 100%);
  border-radius: 50% 50% 0 0 / 40px 40px 0 0;
  z-index: 0;
  pointer-events: none;
}
.cloud {
  position: fixed; background: #fff; border-radius: 50px;
  opacity: 0.7; z-index: 0; pointer-events: none;
  animation: drift 40s linear infinite;
}
.cloud::before, .cloud::after {
  content: ''; position: absolute; background: #fff; border-radius: 50%;
}
@keyframes drift {
  from { transform: translateX(-20vw); }
  to { transform: translateX(120vw); }
}

#app {
  position: relative; z-index: 1;
  height: 100dvh; height: 100vh;
  display: flex; flex-direction: column;
  max-width: 520px; margin: 0 auto;
  padding: var(--safe-top) 12px var(--safe-bottom);
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; padding: 12px 24px;
  border: none; border-radius: var(--radius-sm);
  font-family: var(--font-title); font-size: 1.15rem; font-weight: 700;
  cursor: pointer; position: relative;
  box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.12s;
  -webkit-user-select: none;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: var(--secondary); color: #5a3e00; }
.btn-accent { background: var(--accent); color: #1a4a3a; }
.btn-ghost { background: rgba(255,255,255,0.7); color: var(--dark); box-shadow: 0 4px 0 rgba(0,0,0,0.08); }
.btn-lg { min-height: 72px; font-size: 1.35rem; border-radius: var(--radius); }
.btn-icon { width: 56px; height: 56px; min-height: 56px; padding: 0; border-radius: 50%; }

/* ===== Cards ===== */
.card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

/* ===== Screens ===== */
.screen {
  display: none; flex-direction: column; flex: 1;
  overflow-y: auto; overflow-x: hidden;
  padding: 8px 4px 16px;
  animation: fadeIn 0.35s ease;
}
.screen.active { display: flex; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* ===== Profile select ===== */
.profile-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
  margin: 16px 0;
}
.profile-card {
  background: #fff; border-radius: var(--radius); padding: 16px 12px;
  text-align: center; cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.15s;
  border: 3px solid transparent;
}
.profile-card:active { transform: scale(0.96); }
.profile-card .avatar { font-size: 3rem; line-height: 1; margin-bottom: 6px; }
.profile-card .name { font-family: var(--font-title); font-size: 1.1rem; font-weight: 700; color: var(--dark); }
.profile-add {
  border: 3px dashed #B0C4DE; background: rgba(255,255,255,0.5);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 120px; color: var(--dark); font-weight: 700;
}

/* ===== Map ===== */
.map-path {
  position: relative; padding: 20px 0 40px;
}
.map-unit {
  display: flex; align-items: center; gap: 14px;
  margin: 18px 0; cursor: pointer;
  transition: transform 0.15s;
}
.map-unit:active { transform: scale(0.97); }
.map-node {
  width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 800;
  box-shadow: 0 6px 0 rgba(0,0,0,0.12), inset 0 -4px 8px rgba(0,0,0,0.08);
  flex-shrink: 0; position: relative;
  background: var(--primary); color: #fff;
}
.map-node.recent { animation: pulse 1.5s ease infinite; }
@keyframes pulse {
  0%,100% { box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 0 0 0 rgba(124,158,255,0.5); }
  50% { box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 0 0 12px rgba(124,158,255,0); }
}
.map-info { flex: 1; }
.map-title { font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; }
.map-stars { font-size: 1.1rem; letter-spacing: 2px; margin-top: 2px; }
.map-connector {
  width: 6px; height: 28px; background: rgba(255,255,255,0.6);
  margin-left: 33px; border-radius: 3px;
}

/* ===== Quiz ===== */
.quiz-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px;
}
.progress-track {
  flex: 1; height: 14px; background: rgba(255,255,255,0.6);
  border-radius: 10px; overflow: hidden; position: relative;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary));
  border-radius: 10px; transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.progress-char {
  position: absolute; top: -10px; font-size: 1.4rem;
  transition: left 0.4s cubic-bezier(0.34,1.56,0.64,1);
  transform: translateX(-50%);
}
.q-counter { font-family: var(--font-title); font-weight: 700; font-size: 1rem; color: var(--dark); min-width: 48px; text-align: right; }

.question-area {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 16px; padding: 8px 0;
}
.q-prompt {
  font-family: var(--font-title); font-size: clamp(1.15rem, 4vw, 1.4rem);
  font-weight: 700; text-align: center; color: var(--dark);
  line-height: 1.3;
}
.q-text-block {
  font-family: var(--font-read); font-size: 1.15rem;
  background: #fff; padding: 14px 18px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow); max-width: 100%; text-align: center;
  line-height: 1.5;
}
.choices {
  display: grid; gap: 12px; width: 100%;
  grid-template-columns: 1fr;
}
.choices.grid2 { grid-template-columns: 1fr 1fr; }
.choice-btn {
  display: flex; align-items: center; gap: 12px;
  min-height: 64px; padding: 12px 16px;
  background: #fff; border: 3px solid transparent;
  border-radius: var(--radius-sm); cursor: pointer;
  font-family: var(--font-body); font-size: 1.15rem; font-weight: 700;
  box-shadow: 0 5px 0 rgba(0,0,0,0.1);
  transition: transform 0.12s, border-color 0.15s, background 0.15s;
  text-align: left;
}
.choice-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
.choice-btn .emoji { font-size: 1.8rem; flex-shrink: 0; }
.choice-btn.correct { border-color: #4CAF50; background: #E8F5E9; }
.choice-btn.wrong { border-color: #FF9800; background: #FFF3E0; animation: shake 0.4s; }
.choice-btn.disabled { pointer-events: none; opacity: 0.55; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-6px); }
  40%,80% { transform: translateX(6px); }
}

.audio-btn {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--primary); color: #fff; border: none;
  font-size: 2rem; cursor: pointer;
  box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s;
}
.audio-btn:active { transform: translateY(4px) scale(0.96); }
.audio-btn.playing { animation: pulse-audio 0.8s ease infinite; }
@keyframes pulse-audio {
  0%,100% { box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 0 0 0 rgba(124,158,255,0.4); }
  50% { box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 0 0 14px rgba(124,158,255,0); }
}

.feedback-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 16px 16px calc(16px + var(--safe-bottom));
  background: #fff; box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  display: none; flex-direction: column; align-items: center; gap: 10px;
  z-index: 50; animation: slideUp 0.3s ease;
  max-width: 520px; margin: 0 auto;
}
.feedback-bar.show { display: flex; }
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: none; }
}
.feedback-msg {
  font-family: var(--font-title); font-size: 1.3rem; font-weight: 700;
}
.feedback-msg.ok { color: #2E7D32; }
.feedback-msg.retry { color: #E65100; }

/* Order sentences */
.order-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.order-item {
  background: #fff; padding: 14px 16px; border-radius: var(--radius-sm);
  font-family: var(--font-read); font-size: 1.05rem; font-weight: 600;
  box-shadow: 0 4px 0 rgba(0,0,0,0.1); cursor: grab;
  border: 2px solid transparent;
  touch-action: none;
}
.order-item.selected { border-color: var(--primary); background: #EEF3FF; }
.order-item.correct-pos { border-color: #4CAF50; background: #E8F5E9; }

/* Result */
.result-stars { font-size: 2.8rem; letter-spacing: 6px; text-align: center; margin: 12px 0; }
.result-score {
  font-family: var(--font-title); font-size: 3rem; font-weight: 800;
  text-align: center; color: var(--dark);
}
.skill-bars { margin: 16px 0; }
.skill-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.skill-label { width: 90px; font-size: 0.9rem; font-weight: 700; color: var(--dark); }
.skill-track { flex: 1; height: 12px; background: #E0E7FF; border-radius: 8px; overflow: hidden; }
.skill-fill { height: 100%; background: var(--primary); border-radius: 8px; transition: width 0.8s ease; }

/* Grapey SVG mascot */
.grapey {
  width: 80px; height: 90px; margin: 0 auto;
}
.grapey svg { width: 100%; height: 100%; }

/* Parent zone */
.parent-lock {
  position: absolute; top: 8px; right: 8px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.4); border: none;
  font-size: 1rem; cursor: pointer; opacity: 0.5;
  z-index: 20;
}
.parent-panel {
  position: fixed; inset: 0; background: #F5F7FA; z-index: 100;
  display: none; flex-direction: column; overflow-y: auto;
  padding: var(--safe-top) 16px var(--safe-bottom);
  font-family: var(--font-body);
}
.parent-panel.open { display: flex; }
.parent-panel h2 { font-family: var(--font-title); color: var(--dark); margin: 12px 0; }
.parent-panel table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.parent-panel th, .parent-panel td { padding: 8px 6px; border-bottom: 1px solid #E0E7FF; text-align: left; }
.parent-panel th { background: #EEF3FF; font-weight: 700; }

/* Confetti canvas */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center;
  z-index: 80; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius); padding: 24px;
  width: 100%; max-width: 360px; text-align: center;
  box-shadow: var(--shadow);
}
.modal input, .modal select {
  width: 100%; padding: 12px 14px; border: 2px solid #E0E7FF;
  border-radius: 12px; font-size: 1.1rem; font-family: var(--font-body);
  margin: 8px 0 16px; outline: none;
}
.modal input:focus { border-color: var(--primary); }

/* Utility */
.hidden { display: none !important; }
.text-center { text-align: center; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.flex-center { display: flex; align-items: center; justify-content: center; gap: 10px; }
.gap-8 { gap: 8px; }
.w-full { width: 100%; }
.header-title {
  font-family: var(--font-title); font-size: clamp(1.4rem, 5vw, 1.8rem);
  font-weight: 800; color: var(--dark); text-align: center;
}
.sub { font-size: 0.95rem; color: #64748B; text-align: center; }

@media (min-width: 600px) {
  #app { max-width: 560px; padding-left: 20px; padding-right: 20px; }
  .choices.grid2 { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}


/* ============================================================
   GRAPESEED STORYBOOK THEME — PRESENTATION ONLY
   Keeps the original screens, controls, IDs and JavaScript intact.
   ============================================================ */
:root {
  --primary: #398653;
  --secondary: #F4B942;
  --accent: #8BD3D0;
  --bg: #EAF4E5;
  --dark: #28563D;

  --shadow: 0 9px 26px rgba(27, 65, 43, 0.20);

  --radius-sm: 17px;
}

  background: #cfe7d0;
}
body {
  background-image: url("background.png");

  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.bg-sky, .bg-hills, .cloud { display: none !important; }

#app {
  width: min(100%, 900px);
  max-width: 900px;
  padding-left: clamp(12px, 2.5vw, 28px);

}

/* Welcome heading remains readable without washing out the illustration. */

  max-width: 100%;
  margin: 22px auto 8px;
  padding: 8px 18px 5px;

  font-size: clamp(1.65rem, 5vw, 2.45rem);
  line-height: 1.15;
  -webkit-text-stroke: 1px #24563B;
  paint-order: stroke fill;
  text-shadow: 0 3px 0 #24563B, 0 5px 12px rgba(10, 42, 27, .72);
  filter: drop-shadow(0 3px 5px rgba(15, 49, 31, .28));
}
.header-title {
  color: #28563D;
  text-shadow: 0 1px 0 rgba(255,255,255,.65);
}
.sub {
  color: #315B43;
  font-weight: 800;
  text-shadow: 0 1px 3px rgba(255,255,255,.85);
}

/* Content surfaces: only behind content, never over the whole background. */
.card, .profile-card, .choice-btn, .order-item, .q-text-block,
.modal, .feedback-bar {
  background: rgba(255, 253, 244, .96);
  border: 1px solid rgba(255,255,255,.82);
  box-shadow: 0 8px 22px rgba(25, 66, 43, .18);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.profile-card {
  border: 2px solid rgba(255,255,255,.92);
  transition: transform .18s ease, box-shadow .18s ease;
}
.profile-card:active { transform: scale(.97); }
.profile-card .name, .map-title { color: #28563D; }
.profile-add {
  background: rgba(255, 250, 225, .90);
  border: 2px dashed #6CA77B;
}

.map-path { padding: 14px 0 30px; }
.map-unit {
  padding: 12px 14px;

  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 7px 18px rgba(27,65,43,.15);
}

.map-node { border: 3px solid rgba(255,255,255,.9); }

.btn {
  border-radius: 18px;
  box-shadow: 0 5px 0 rgba(28, 72, 45, .20), 0 8px 16px rgba(25, 66, 43, .12);
}
.btn-primary { background: linear-gradient(135deg, #4DAD68, #287849); color: #fff; }
.btn-secondary { background: linear-gradient(135deg, #FFD36A, #F2AD2E); color: #594014; }
.btn-accent { background: linear-gradient(135deg, #A8E6D7, #65C6B5); color: #174D43; }

  background: rgba(255, 253, 244, .95);

}

}
@media (prefers-reduced-motion: reduce) {
  body { background-attachment: scroll; }
}

<body>
<div class="bg-sky"></div>

/* ============================================================
   STATE & STORAGE
   ============================================================ */
const STATE = {
  profiles: [],
  currentProfileId: null,
  currentUnit: null,
  level: null,           // 'easy' | 'hard'
  questions: [],
  qIndex: 0,
  answers: [],           // {qid, correct, tries, skill}
  score: 0,
  maxScore: 0,
  replayCount: 0,
  hintUsed: false,
  screen: 'profiles',
  unitData: null,
  wrongReview: false,
  reviewRange: null
};

const STORAGE_KEY = 'gs_test_v1';

function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      STATE.profiles = data.profiles || [];
      STATE.currentProfileId = data.currentProfileId || null;
      if (data.settings) Object.assign(window.GS_CONFIG.defaults, data.settings);
    }
  } catch (e) { console.warn('Storage load fail', e); }
}
function saveLocal() {
  try {
    const data = {
      profiles: STATE.profiles,
      currentProfileId: STATE.currentProfileId,
      settings: {
        volume: window.GS_CONFIG.defaults.volume,
        sfxVolume: window.GS_CONFIG.defaults.sfxVolume,
        questionsEasy: window.GS_CONFIG.defaults.questionsEasy,
        questionsHard: window.GS_CONFIG.defaults.questionsHard,
        allowHint: window.GS_CONFIG.defaults.allowHint,
        speechRate: window.GS_CONFIG.defaults.speechRate
      }
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { console.warn('Storage save fail', e); }
}
function saveStorage() { saveLocal(); scheduleSync(); }
function getProfile() {
  return STATE.profiles.find(p => p.id === STATE.currentProfileId);
}
function getHistory(profileId) {
  const p = STATE.profiles.find(x => x.id === profileId);
  return (p && p.history) || [];
}
function addHistory(entry) {
  const p = getProfile();
  if (!p) return;
  if (!p.history) p.history = [];
  p.history.unshift(entry);
  if (p.history.length > 100) p.history.length = 100;
  // track wrong words
  if (!p.wrongWords) p.wrongWords = {};
  (entry.wrongIds || []).forEach(id => {
    p.wrongWords[id] = (p.wrongWords[id] || 0) + 1;
  });
  // best stars
  if (!p.best) p.best = {};
  const key = entry.unitId + '_' + entry.level;
  if (!p.best[key] || entry.stars > p.best[key]) p.best[key] = entry.stars;
  p.lastUnit = entry.unitId;
  entry.ts = entry.ts || Date.now();
  p.updatedAt = Date.now();
  saveStorage();
}

/* ============================================================
   AUDIO HOOKS
   ============================================================ */
const audioCache = {};   // id -> 'ok' | 'missing'
const sfxCache = {};
let currentAudio = null;
let audioCtx = null;

function ensureAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type) {
  ensureAudioCtx();
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.value = (window.GS_CONFIG.defaults.sfxVolume || 0.5) * 0.3;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.stop(audioCtx.currentTime + dur);
}

function playSfx(name) {
  const cfg = window.GS_CONFIG;
  const path = cfg.sfxBase + name + cfg.audioExt;
  if (sfxCache[name] === 'missing') {
    // fallback tones
    if (name === 'correct') { playTone(523, 0.12); setTimeout(() => playTone(659, 0.15), 100); }
    else if (name === 'wrong' || name === 'retry') { playTone(220, 0.18, 'triangle'); }
    else if (name === 'star') { playTone(784, 0.1); setTimeout(() => playTone(988, 0.12), 80); }
    else if (name === 'complete') { playTone(523,0.1); setTimeout(()=>playTone(659,0.1),80); setTimeout(()=>playTone(784,0.2),160); }
    else if (name === 'tap') playTone(440, 0.05);
    else if (name === 'confetti') { playTone(880,0.08); setTimeout(()=>playTone(1100,0.1),60); }
    return;
  }
  const a = new Audio(path);
  a.volume = cfg.defaults.sfxVolume || 0.6;
  a.play().then(() => { sfxCache[name] = 'ok'; }).catch(() => {
    sfxCache[name] = 'missing';
    playSfx(name); // retry with tone
  });
}

function playAudio(id, textFallback) {
  return new Promise((resolve) => {
    if (currentAudio) { try { currentAudio.pause(); } catch(e){} }
    const unitId = STATE.currentUnit || 'u01';
    const cfg = window.GS_CONFIG;
    const path = cfg.audioBase + unitId + '/' + id + cfg.audioExt;

    if (audioCache[id] === 'missing') {
      speakText(textFallback || id);
      resolve('speech');
      return;
    }
    const a = new Audio(path);
    a.volume = cfg.defaults.volume || 0.8;
    currentAudio = a;
    a.onended = () => resolve('file');
    a.onerror = () => {
      audioCache[id] = 'missing';
      speakText(textFallback || id);
      resolve('speech');
    };
    a.play().then(() => { audioCache[id] = 'ok'; }).catch(() => {
      audioCache[id] = 'missing';
      speakText(textFallback || id);
      resolve('speech');
    });
  });
}

function speakText(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = window.GS_CONFIG.defaults.speechLang || 'en-US';
  u.rate = window.GS_CONFIG.defaults.speechRate || 0.85;
  window.speechSynthesis.speak(u);
}

function getImage(item) {
  // item can be vocab object or id string
  const id = typeof item === 'string' ? item : (item.id || item.word);
  const unitId = STATE.currentUnit || 'u01';
  const cfg = window.GS_CONFIG;
  const path = cfg.imageBase + unitId + '/' + id + cfg.imageExt;
  let emoji = '📦', color = '#B8D4FF';
  if (STATE.unitData && STATE.unitData.vocab) {
    const v = STATE.unitData.vocab.find(x => x.id === id || x.word === id);
    if (v) { emoji = v.emoji || '📦'; }
  }
  // color by category hash
  const colors = ['#FFCDD2','#C8E6C9','#BBDEFB','#FFE0B2','#E1BEE7','#B2EBF2','#FFF9C4','#D7CCC8'];
  color = colors[Math.abs(hashCode(id)) % colors.length];
  return { src: path, emoji, color, id };
}
function hashCode(s) {
  let h = 0; for (let i=0;i<s.length;i++) h = ((h<<5)-h)+s.charCodeAt(i)|0; return h;
}

/* ============================================================
   QUESTION ENGINE
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickQuestions(unitData, level, count, preferWrong) {
  let pool = (unitData.questions || []).filter(q => q.level === level);
  if (preferWrong && getProfile() && getProfile().wrongWords) {
    const ww = getProfile().wrongWords;
    pool = pool.slice().sort((a, b) => {
      const wa = (a.answer && ww[a.answer]) || 0;
      const wb = (b.answer && ww[b.answer]) || 0;
      return wb - wa;
    });
  } else {
    pool = shuffle(pool);
  }
  // ensure variety of types & skills
  const selected = [];
  const usedTypes = new Set();
  const usedSkills = new Set();
  // first pass: unique type+skill
  for (const q of pool) {
    if (selected.length >= count) break;
    const key = q.type + '|' + q.skill;
    if (!usedTypes.has(q.type) || !usedSkills.has(q.skill) || selected.length < 4) {
      selected.push(q);
      usedTypes.add(q.type);
      usedSkills.add(q.skill);
    }
  }
  // fill rest
  for (const q of pool) {
    if (selected.length >= count) break;
    if (!selected.find(s => s.id === q.id)) selected.push(q);
  }
  return selected.slice(0, count).map(q => {
    // clone and shuffle choices
    const c = Object.assign({}, q);
    if (c.choices) c.choices = shuffle(c.choices);
    return c;
  });
}

function calcStars(pct) {
  const tiers = window.GS_CONFIG.stars;
  for (const t of tiers) if (pct >= t.min) return t.stars;
  return 1;
}

/* ============================================================
   GRAPEY MASCOT
   ============================================================ */
function grapeySVG(mood) {
  // mood: idle | happy | cheer | encourage
  const eyeY = mood === 'happy' || mood === 'cheer' ? 28 : 30;
  const mouth = mood === 'cheer'
    ? '<path d="M28 48 Q40 58 52 48" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
    : mood === 'happy'
    ? '<path d="M30 46 Q40 54 50 46" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
    : mood === 'encourage'
    ? '<path d="M32 48 Q40 52 48 48" stroke="#5D4037" stroke-width="2" fill="none"/>'
    : '<ellipse cx="40" cy="48" rx="6" ry="3" fill="#5D4037"/>';
  return `<svg viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
    <!-- body grapes -->
    <circle cx="28" cy="42" r="16" fill="#7B68EE"/>
    <circle cx="48" cy="38" r="17" fill="#9370DB"/>
    <circle cx="40" cy="55" r="16" fill="#8A2BE2"/>
    <circle cx="24" cy="58" r="12" fill="#6A5ACD"/>
    <circle cx="54" cy="56" r="13" fill="#7B68EE"/>
    <!-- highlight -->
    <circle cx="34" cy="34" r="4" fill="rgba(255,255,255,0.45)"/>
    <circle cx="52" cy="32" r="3.5" fill="rgba(255,255,255,0.4)"/>
    <!-- eyes -->
    <circle cx="32" cy="${eyeY}" r="4.5" fill="#fff"/>
    <circle cx="48" cy="${eyeY}" r="4.5" fill="#fff"/>
    <circle cx="33" cy="${eyeY+1}" r="2.2" fill="#2D3748"/>
    <circle cx="49" cy="${eyeY+1}" r="2.2" fill="#2D3748"/>
    <!-- smile -->
    ${mouth}
    <!-- leaf -->
    <ellipse cx="42" cy="18" rx="8" ry="5" fill="#66BB6A" transform="rotate(-20 42 18)"/>
    <line x1="40" y1="18" x2="40" y2="10" stroke="#558B2F" stroke-width="2"/>
  </svg>`;
}

/* ============================================================
   SCREENS
   ============================================================ */
const app = document.getElementById('app');

function showScreen(name) {
  STATE.screen = name;
  render();
}

function render() {
  const screens = {
    profiles: renderProfiles,
    home: renderHome,
    unit: renderUnit,
    quiz: renderQuiz,
    result: renderResult,
    reviewWrong: renderReviewWrong
  };
  const fn = screens[STATE.screen] || renderProfiles;
  app.innerHTML = fn();
  // bind events after render
  bindScreenEvents();
}

function renderProfiles() {
  const cards = STATE.profiles.map(p => `
    <div class="profile-card" data-id="${p.id}">
      <div class="avatar">${p.avatar}</div>
      <div class="name">${esc(p.name)}</div>
    </div>
  `).join('');
  const addBtn = STATE.profiles.length < 6 ? `
    <div class="profile-card profile-add" id="btnAddProfile">
      <div style="font-size:2rem;">➕</div>
      <div>New friend</div>
    </div>
  ` : '';
  return `
    <button class="parent-lock" id="btnParent" title="Phụ huynh">🔒</button>
    <div class="header-title mt-16 welcome-title">🍇 wellcome to GrapeSeed</div>
    <p class="sub">Who is playing today?</p>
    <div class="profile-grid">${cards}${addBtn}</div>
    <div style="text-align:center;margin-top:14px;">
      <button class="btn btn-ghost" id="btnFamily" style="min-height:44px;font-size:.95rem;">👨‍👩‍👧 Mã gia đình</button>
      <p class="sub" id="syncBadge" style="font-size:.8rem;margin-top:6px;">${esc(syncText())}</p>
    </div>
    <div class="grapey mt-16">${grapeySVG('idle')}</div>
  `;
}

function renderHome() {
  const p = getProfile();
  if (!p) { showScreen('profiles'); return ''; }
  const units = window.GS.unitList || [];
  let path = '';
  units.forEach((u, i) => {
    const bestE = (p.best && p.best[u.id + '_easy']) || 0;
    const bestH = (p.best && p.best[u.id + '_hard']) || 0;
    const starsE = '★'.repeat(bestE) + '☆'.repeat(5 - bestE);
    const starsH = '★'.repeat(bestH) + '☆'.repeat(5 - bestH);
    const isRecent = p.lastUnit === u.id;
    path += `
      ${i > 0 ? '<div class="map-connector"></div>' : ''}
      <div class="map-unit" data-unit="${u.id}">
        <div class="map-node ${isRecent ? 'recent' : ''}" style="background:${u.theme.primary}">${u.emoji}</div>
        <div class="map-info">
          <div class="map-title">${u.short}: ${u.title}</div>
          <div class="map-stars" style="color:#FFB300">Easy ${starsE}</div>
          <div class="map-stars" style="color:#FF8F00">Hard ${starsH}</div>
        </div>
      </div>
    `;
  });
  return `
    <button class="parent-lock" id="btnParent">🔒</button>
    <div class="map-path">${path}</div>
    <div style="text-align:center;margin:12px 0 6px;">
      <div style="font-size:0.85rem;color:#315B43;font-weight:800;">Hello,</div>
      <div class="header-title" style="font-size:1.4rem;margin-bottom:10px;">${esc(p.name)} ${p.avatar}</div>
      <button class="btn btn-ghost" id="btnSwitchProfile" style="min-height:44px;">Switch player</button>
    </div>
  `;
}

function renderUnit() {
  const u = (window.GS.unitList || []).find(x => x.id === STATE.currentUnit);
  const p = getProfile();
  if (!u || !p) return '';
  const bestE = (p.best && p.best[u.id + '_easy']) || 0;
  const bestH = (p.best && p.best[u.id + '_hard']) || 0;
  const last = (p.history || []).find(h => h.unitId === u.id);
  return `
    <button class="btn btn-ghost" id="btnBackHome" style="align-self:flex-start;min-height:44px;">← Map</button>
    <div class="text-center mt-8">
      <div style="font-size:3rem;">${u.emoji}</div>
      <div class="header-title">${u.short}</div>
      <div class="sub">${u.title}</div>
    </div>
    <div class="card mt-16" style="border-top:6px solid ${u.theme.primary};">
      <button class="btn btn-primary btn-lg w-full mb-8" id="btnEasy" data-level="easy">
        🌱 Easy <span style="font-size:0.9rem;opacity:0.85;">(${bestE}★)</span>
      </button>
      <p class="sub" style="margin-bottom:16px;">Words, pictures, short questions</p>
      <button class="btn btn-secondary btn-lg w-full mb-8" id="btnHard" data-level="hard">
        🔥 Hard <span style="font-size:0.9rem;opacity:0.85;">(${bestH}★)</span>
      </button>
      <p class="sub">Stories, longer sentences</p>
    </div>
    ${last ? `<p class="sub mt-16">Last: ${last.pct}% · ${last.stars}★ · ${last.date}</p>` : ''}
    <button class="btn btn-ghost w-full mt-16" id="btnRetryWrong" style="min-height:48px;">📝 Practice missed words</button>
  `;
}

function renderQuiz() {
  const q = STATE.questions[STATE.qIndex];
  if (!q) return '<div class="sub">No questions</div>';
  const total = STATE.questions.length;
  const pct = ((STATE.qIndex) / total) * 100;
  const charPos = Math.min(96, pct + 2);

  let body = '';
  const prompt = `<div class="q-prompt">${esc(q.prompt || '')}</div>`;

  // audio button if needed
  const needsAudio = ['listen_pick_image','listen_pick_word'].includes(q.type) || q.audioId;
  const audioBtn = needsAudio ? `
    <button class="audio-btn" id="btnReplay" aria-label="Listen again">🔊</button>
  ` : '';

  // image if imageId
  let imgBlock = '';
  if (q.imageId || (q.type === 'image_pick_word')) {
    const img = getImage(q.imageId || q.answer);
    imgBlock = `
      <div style="width:120px;height:120px;border-radius:24px;background:${img.color};
        display:flex;align-items:center;justify-content:center;font-size:4rem;
        box-shadow:var(--shadow);margin:0 auto;">
        ${img.emoji}
      </div>
    `;
  }

  // text block for reading
  if (q.type === 'true_false' || q.type === 'story_comprehension' || q.type === 'read_pick_image') {
    const text = q.statement || q.prompt || '';
    if (q.type === 'story_comprehension' && q.textId && STATE.unitData) {
      const t = (STATE.unitData.texts || []).find(x => x.id === q.textId);
      if (t) {
        body += `<div class="q-text-block">${t.lines.slice(0,4).map(l=>esc(l)).join('<br>')}</div>`;
      }
    } else if (q.type === 'read_pick_image') {
      body += `<div class="q-text-block" style="font-family:var(--font-read);font-size:1.25rem;">${esc(q.prompt)}</div>`;
    } else if (q.type === 'true_false') {
      body += `<div class="q-text-block">${esc(q.statement || q.prompt)}</div>`;
    }
  }

  // choices
  let choicesHtml = '';
  if (q.type === 'true_false') {
    choicesHtml = `
      <div class="choices">
        <button class="choice-btn" data-val="true"><span class="emoji">✅</span> Yes, true</button>
        <button class="choice-btn" data-val="false"><span class="emoji">❌</span> No, false</button>
      </div>
    `;
  } else if (q.type === 'order_sentences') {
    const lines = shuffle(q.lines || []);
    choicesHtml = `
      <p class="sub">Tap in the correct order</p>
      <div class="order-list" id="orderList">
        ${lines.map((l,i) => `<div class="order-item" data-text="${esc(l)}" data-idx="${i}">${esc(l)}</div>`).join('')}
      </div>
      <button class="btn btn-primary w-full mt-16" id="btnCheckOrder">Check ✓</button>
    `;
  } else if (q.type === 'sound_pick_letter') {
    choicesHtml = `<div class="choices grid2">
      ${(q.choices||[]).map(c => `
        <button class="choice-btn" data-val="${esc(c)}" style="justify-content:center;font-family:var(--font-read);font-size:1.8rem;">
          ${esc(c)}
        </button>
      `).join('')}
    </div>`;
  } else {
    // standard choices with emoji when possible
    const isImgChoice = q.type === 'listen_pick_image' || q.type === 'read_pick_image';
    const grid = (q.choices || []).length <= 4 ? 'grid2' : '';
    choicesHtml = `<div class="choices ${grid}">
      ${(q.choices || []).map(c => {
        const img = getImage(c);
        if (isImgChoice) {
          return `<button class="choice-btn" data-val="${esc(c)}" style="flex-direction:column;min-height:90px;">
            <span class="emoji" style="font-size:2.4rem;">${img.emoji}</span>
            <span style="font-size:0.95rem;">${esc(c)}</span>
          </button>`;
        }
        return `<button class="choice-btn" data-val="${esc(c)}">
          <span class="emoji">${img.emoji}</span>
          <span>${esc(c)}</span>
        </button>`;
      }).join('')}
    </div>`;
  }

  return `
    <div class="quiz-header">
      <button class="btn btn-ghost btn-icon" id="btnQuitQuiz" aria-label="Quit">✕</button>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
        <div class="progress-char" style="left:${charPos}%">🍇</div>
      </div>
      <div class="q-counter">${STATE.qIndex + 1}/${total}</div>
    </div>
    <div class="question-area">
      ${prompt}
      ${audioBtn}
      ${imgBlock}
      ${body}
      ${choicesHtml}
    </div>
    <div class="feedback-bar" id="feedbackBar">
      <div class="feedback-msg" id="feedbackMsg"></div>
      <button class="btn btn-primary" id="btnNextQ" style="min-width:160px;">Next →</button>
    </div>
  `;
}

function renderResult() {
  const pct = STATE.maxScore ? Math.round((STATE.score / STATE.maxScore) * 100) : 0;
  const stars = calcStars(pct);
  // skill breakdown
  const skills = {};
  STATE.answers.forEach(a => {
    if (!skills[a.skill]) skills[a.skill] = { correct: 0, total: 0 };
    skills[a.skill].total++;
    if (a.correct) skills[a.skill].correct++;
  });
  const skillHtml = Object.keys(skills).map(sk => {
    const s = skills[sk];
    const sp = Math.round((s.correct / s.total) * 100);
    return `<div class="skill-row">
      <div class="skill-label">${skillLabel(sk)}</div>
      <div class="skill-track"><div class="skill-fill" style="width:${sp}%"></div></div>
      <div style="width:40px;font-weight:700;font-size:0.9rem;">${sp}%</div>
    </div>`;
  }).join('');

  const praise = pct >= 90 ? 'Amazing!' : pct >= 70 ? 'Great job!' : pct >= 50 ? 'Good try!' : 'Keep going!';
  return `
    <div class="text-center mt-16">
      <div class="grapey">${grapeySVG(stars >= 3 ? 'cheer' : 'encourage')}</div>
      <div class="result-stars" id="starDisplay">${'☆'.repeat(5)}</div>
      <div class="result-score" id="scoreDisplay">0%</div>
      <div class="header-title" style="font-size:1.5rem;margin-top:4px;">${praise}</div>
    </div>

function findWordText(id) {
  if (!STATE.unitData) return id;
  const v = (STATE.unitData.vocab || []).find(x => x.id === id);
  if (v) return v.word;
  const p = (STATE.unitData.phrases || []).find(x => x.id === id);
  if (p) return p.text;
  return id;
}
function arraysEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  return a.every((x, i) => x === b[i]);
}

/* ============================================================
   QUIZ LOGIC
   ============================================================ */
let currentTries = 0;

function loadUnit(unitId) {
  STATE.currentUnit = unitId;
  // dynamic script load
  if (window.GS.units[unitId]) {
    STATE.unitData = window.GS.units[unitId];
    showScreen('unit');
    return;
  }
  const s = document.createElement('script');
  s.src = 'data/' + unitId + '.js';
  s.onload = () => {
    STATE.unitData = window.GS.units[unitId];
    showScreen('unit');
  };
  s.onerror = () => {
    alert('Unit data not found: ' + unitId);
  };
  document.head.appendChild(s);
}

function startQuiz(level) {
  playSfx('tap');
  if (!STATE.unitData) return;
  STATE.level = level;
  STATE.wrongReview = false;
  const count = level === 'easy'
    ? window.GS_CONFIG.defaults.questionsEasy
    : window.GS_CONFIG.defaults.questionsHard;
  STATE.questions = pickQuestions(STATE.unitData, level, count, true);
  STATE.qIndex = 0;
  STATE.answers = [];
  STATE.score = 0;
  STATE.maxScore = STATE.questions.length * 2; // full = 2 pts each
  currentTries = 0;
  STATE.replayCount = 0;
  STATE.hintUsed = false;
  showScreen('quiz');
}

function startWrongPractice() {
  // pick questions whose answer is in wrongWords
  const p = getProfile();
  if (!p || !p.wrongWords || !Object.keys(p.wrongWords).length) {
    alert('No missed words yet. Great!');
    return;
  }
  if (!STATE.unitData) return;
  const pool = (STATE.unitData.questions || []).filter(q =>
    q.answer && p.wrongWords[q.answer]
  );
  if (pool.length < 3) {
    alert('Not enough missed items. Play more first!');
    return;
  }
  STATE.level = 'easy';
  STATE.wrongReview = true;
  STATE.questions = shuffle(pool).slice(0, Math.min(10, pool.length));
  STATE.qIndex = 0;
  STATE.answers = [];
  STATE.score = 0;
  STATE.maxScore = STATE.questions.length * 2;
  currentTries = 0;
  showScreen('quiz');
}

function onChoice(btn) {
  if (btn.classList.contains('disabled')) return;
  const q = STATE.questions[STATE.qIndex];
  let val = btn.dataset.val;
  if (q.type === 'true_false') val = val === 'true';
  const correct = (val === q.answer) || (String(val) === String(q.answer));
  finishAnswer(correct, btn);
}

function finishAnswer(correct, btnEl) {
  const q = STATE.questions[STATE.qIndex];
  currentTries++;
  const bar = document.getElementById('feedbackBar');
  const msg = document.getElementById('feedbackMsg');

  // disable all
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('disabled'));

  if (correct) {
    playSfx('correct');
    if (btnEl && btnEl.classList) btnEl.classList.add('correct');
    const pts = currentTries === 1 ? 2 : 1;
    STATE.score += pts;
    STATE.answers.push({ qid: q.id, correct: true, tries: currentTries, skill: q.skill, answer: q.answer });
    msg.textContent = currentTries === 1 ? pickPraise() : 'Yes! Good job!';
    msg.className = 'feedback-msg ok';
    bar.classList.add('show');
    // auto next after short delay on perfect
    if (currentTries === 1) {
      setTimeout(() => { if (bar.classList.contains('show')) nextQuestion(); }, 900);
    }
  } else {
    if (currentTries === 1 && STATE.level === 'easy' && window.GS_CONFIG.defaults.allowHint) {
      // hint: remove one wrong
      playSfx('retry');
      if (btnEl) btnEl.classList.add('wrong');
      msg.textContent = 'Almost! Try again!';
      msg.className = 'feedback-msg retry';
      bar.classList.add('show');
      // re-enable remaining
      setTimeout(() => {
        document.querySelectorAll('.choice-btn').forEach(b => {
          if (!b.classList.contains('wrong')) b.classList.remove('disabled');
        });
        document.getElementById('btnNextQ').style.display = 'none';
      }, 600);
      return;
    }
    // final wrong
    playSfx('wrong');
    if (btnEl) btnEl.classList.add('wrong');
    // highlight correct
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (String(b.dataset.val) === String(q.answer) || (q.type==='true_false' && String(b.dataset.val)==='true' && q.answer===true) || (q.type==='true_false' && String(b.dataset.val)==='false' && q.answer===false)) {
        b.classList.add('correct');
      }
    });
    STATE.answers.push({ qid: q.id, correct: false, tries: currentTries, skill: q.skill, answer: q.answer });
    msg.textContent = 'The answer is: ' + (q.answer === true ? 'Yes' : q.answer === false ? 'No' : q.answer);
    msg.className = 'feedback-msg retry';
    bar.classList.add('show');
    document.getElementById('btnNextQ').style.display = '';
  }
}

function pickPraise() {
  const list = ['Great!', 'Super!', 'Awesome!', 'Yes!', 'Fantastic!', 'Brilliant!', 'Nice!'];
  return list[Math.floor(Math.random() * list.length)];
}

function nextQuestion() {
  playSfx('tap');
  const bar = document.getElementById('feedbackBar');
  if (bar) bar.classList.remove('show');
  currentTries = 0;
  STATE.replayCount = 0;
  STATE.hintUsed = false;
  STATE.qIndex++;
  if (STATE.qIndex >= STATE.questions.length) {
    finishQuiz();
  } else {
    showScreen('quiz');
  }
}

function finishQuiz() {
  const pct = STATE.maxScore ? Math.round((STATE.score / STATE.maxScore) * 100) : 0;
  const stars = calcStars(pct);
  const u = (window.GS.unitList || []).find(x => x.id === STATE.currentUnit) || {};
  const wrongIds = STATE.answers.filter(a => !a.correct).map(a => a.answer).filter(Boolean);
  addHistory({
    unitId: STATE.currentUnit,
    unit: u.unit || 1,
    level: STATE.level,
    pct, stars,
    score: STATE.score,
    maxScore: STATE.maxScore,
    date: new Date().toLocaleDateString('vi-VN'),
    time: new Date().toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit'}),
    wrongIds,
    emoji: u.emoji || '⭐',
    answers: STATE.answers.slice()
  });
  showScreen('result');
  // animate stars & score
  setTimeout(() => animateResult(pct, stars), 200);
  if (stars >= 3) {
    playSfx('complete');
    setTimeout(() => { playSfx('confetti'); launchConfetti(); }, 400);
  }
}

function animateResult(pct, stars) {
  const starEl = document.getElementById('starDisplay');
  const scoreEl = document.getElementById('scoreDisplay');
  if (!starEl || !scoreEl) return;
  let s = 0;
  const starTimer = setInterval(() => {
    s++;
    starEl.textContent = '★'.repeat(Math.min(s, stars)) + '☆'.repeat(Math.max(0, 5 - Math.min(s, stars)));
    if (s >= stars) { clearInterval(starTimer); playSfx('star'); }
  }, 280);
  let sc = 0;
  const scoreTimer = setInterval(() => {
    sc += Math.ceil(pct / 20);
    if (sc >= pct) { sc = pct; clearInterval(scoreTimer); }
    scoreEl.textContent = sc + '%';
  }, 40);
}

function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = [];
  const colors = ['#7C9EFF','#FFB347','#A8E6CF','#FF8A80','#CE93D8','#FFF176'];
  for (let i = 0; i < 80; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 100,
      w: 6 + Math.random() * 8,
      h: 8 + Math.random() * 10,
      color: colors[Math.floor(Math.random()*colors.length)],
      vy: 2 + Math.random() * 4,
      vx: -2 + Math.random() * 4,
      rot: Math.random() * 360,
      vr: -5 + Math.random() * 10
    });
  }
  let frames = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frames++;
    if (frames < 90) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

let syncBusy = false, syncAgain = false, syncDirty = false, syncTimer = null, lastSyncAt = 0;
try { familyCode = localStorage.getItem(FAMILY_KEY) || ''; } catch (e) {}

function normCode(s) { return (s || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 30); }
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
}
function ensureFirebase() {
  if (fbDb) return true;
  try {
    if (typeof firebase === 'undefined' || !firebase.firestore) return false;
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    fbDb = firebase.firestore();
    return true;
  } catch (e) { console.warn('Firebase init fail', e); return false; }
}
function toCloud(list) {   // bỏ "answers" cho nhẹ (giới hạn 1MB/doc)
  return JSON.parse(JSON.stringify(list.map(p => Object.assign({}, p, {
    history: (p.history || []).map(h => { const c = Object.assign({}, h); delete c.answers; return c; })
  }))));
}

/* ---- Gộp dữ liệu: không bao giờ làm mất điểm ---- */
function histKey(h) { return h.ts ? 't' + h.ts : [h.unitId, h.level, h.date, h.time, h.score].join('|'); }
function maxMerge(x, y) {
  const o = Object.assign({}, x || {}); let c = false;
  for (const k in (y || {})) if (!(k in o) || y[k] > o[k]) { o[k] = y[k]; c = true; }
  return [o, c];
}
function withReset(p, r) {   // áp dụng "Xóa dữ liệu bé này" (resetAt) cho bản cũ hơn
  if ((p.resetAt || 0) >= r) return [p, false];
  return [Object.assign({}, p, {
    history: (p.history || []).filter(h => (h.ts || 0) >= r),
    best: {}, wrongWords: {}, resetAt: r
  }), true];
}
function mergeProfile(a, b) {
  let changed = false;
  const r = Math.max(a.resetAt || 0, b.resetAt || 0);
  if (r) {
    let c;
    [a, c] = withReset(a, r); if (c) changed = true;
    [b] = withReset(b, r);
  }
  const out = Object.assign({}, a);
  if ((b.updatedAt || 0) > (a.updatedAt || 0)) {
    out.name = b.name; out.avatar = b.avatar; out.updatedAt = b.updatedAt;
    if (b.lastUnit) out.lastUnit = b.lastUnit;
    changed = true;
  }
  const seen = new Set((a.history || []).map(histKey));
  const add = (b.history || []).filter(h => !seen.has(histKey(h)));
  if (add.length) {
    out.history = (a.history || []).concat(add).sort((x, y) => (y.ts || 0) - (x.ts || 0)).slice(0, 100);
    changed = true;
  }
  const [bw, c1] = maxMerge(a.best, b.best);           if (c1) { out.best = bw; changed = true; }
  const [ww, c2] = maxMerge(a.wrongWords, b.wrongWords); if (c2) { out.wrongWords = ww; changed = true; }
  return [out, changed];
}
function mergeProfiles(local, cloud) {
  const list = []; let changed = false;
  local.forEach(a => {
    const b = (cloud || []).find(x => x.id === a.id);
    if (!b) { list.push(a); return; }
    const [m, c] = mergeProfile(a, b);
    list.push(c ? m : a); if (c) changed = true;
  });
  (cloud || []).forEach(b => {
    if (!local.find(x => x.id === b.id)) { list.push(Object.assign({ history: [], wrongWords: {}, best: {} }, b)); changed = true; }
  });
  return [list, changed];
}
function isPristine(p) {
  return p && p.id === 'p_default' && !(p.history || []).length && !Object.keys(p.best || {}).length;
}

/* ---- Đồng bộ ---- */
function setSync(s) { syncState = s; updateSyncBadge(); }
function syncText() {
  if (!familyCode) return '☁️ Chưa kết nối mã gia đình';
  return ({
    syncing: '🔄 Đang đồng bộ…',
    ok: '☁️ Đã lưu lên đám mây',
    offline: '📴 Đang offline – sẽ tự đồng bộ khi có mạng',
    denied: '⚠️ Firebase từ chối (kiểm tra Rules)',
    off: '☁️ Sẵn sàng'
  })[syncState] || '';
}
function updateSyncBadge() {
  const el = document.getElementById('syncBadge');
  if (el) el.textContent = syncText();
  const el2 = document.getElementById('famStatus');
  if (el2) el2.textContent = syncText();
}
function scheduleSync() {
  if (!familyCode) return;
  syncDirty = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 2000);
}
async function syncNow() {
  if (!familyCode) return;
  if (syncBusy) { syncAgain = true; return; }
  if (!ensureFirebase() || navigator.onLine === false) { syncDirty = true; setSync('offline'); return; }
  syncBusy = true; setSync('syncing');
  try {
    const ref = fbDb.collection('families').doc(familyCode);
    const merged = await withTimeout(fbDb.runTransaction(async t => {
      const snap = await t.get(ref);
      const cloud = (snap.exists && snap.data().profiles) || [];
      const [m] = mergeProfiles(STATE.profiles, cloud);
      t.set(ref, { profiles: toCloud(m), v: 1, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      return m;
    }), 12000);
    applyMerged(merged);
    syncDirty = false; lastSyncAt = Date.now(); setSync('ok');
  } catch (e) {
    console.warn('Sync fail', e);
    syncDirty = true;
    setSync(e && e.code === 'permission-denied' ? 'denied' : 'offline');
  } finally {
    syncBusy = false;
    if (syncAgain) { syncAgain = false; setTimeout(syncNow, 500); }
  }
}
function applyMerged(cloudMerged) {
  const [list, changed] = mergeProfiles(STATE.profiles, cloudMerged);
  if (!changed) return;
  STATE.profiles = list;
  if (!STATE.profiles.find(p => p.id === STATE.currentProfileId)) STATE.currentProfileId = null;
  saveLocal();
  if (['profiles', 'home', 'unit'].includes(STATE.screen)) render();   // không render giữa lúc đang làm bài
}
function initSync() {
  ensureFirebase();
  window.addEventListener('online', () => { if (familyCode) syncNow(); });
  window.addEventListener('offline', () => { if (familyCode) setSync('offline'); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && familyCode && Date.now() - lastSyncAt > 30000) syncNow();
  });
  setInterval(() => { if (familyCode && syncDirty) syncNow(); }, 60000);
  if (familyCode) syncNow();
}

/* ---- Kết nối / ngắt mã gia đình ---- */
async function connectFamily(code) {
  code = normCode(code);
  if (code.length < 6) return 'Mã cần ít nhất 6 ký tự (chữ, số hoặc dấu -).';
  if (!ensureFirebase()) return 'Chưa tải được Firebase. Kiểm tra mạng rồi thử lại.';
  if (navigator.onLine === false) return 'Cần có mạng để kết nối lần đầu.';
  try {
    const snap = await withTimeout(fbDb.collection('families').doc(code).get(), 12000);
    const cloud = (snap.exists && snap.data().profiles) || [];
    // máy mới: bỏ hồ sơ "Friend" trống để không bị trùng với hồ sơ trên mây
    if (cloud.length && STATE.profiles.length === 1 && isPristine(STATE.profiles[0])) {
      STATE.profiles = [];
      STATE.currentProfileId = null;
    }
    familyCode = code;
    try { localStorage.setItem(FAMILY_KEY, code); } catch (e) {}
    const [list] = mergeProfiles(STATE.profiles, cloud);
    STATE.profiles = list;
    if (!STATE.profiles.find(p => p.id === STATE.currentProfileId)) STATE.currentProfileId = null;
    saveLocal();
    await syncNow();
    return '';
  } catch (e) {
    return e && e.code === 'permission-denied'
      ? 'Firebase từ chối quyền. Cần cập nhật Rules trong Firestore.'
      : 'Không kết nối được. Thử lại khi có mạng.';
  }
}
function disconnectFamily() {
  familyCode = '';
  try { localStorage.removeItem(FAMILY_KEY); } catch (e) {}
  syncDirty = false; setSync('off');
}
function randomCode() {
  const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = 'gs-';
  for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}
function showFamilyModal() {
  const modal = document.getElementById('modal');
  const body = document.getElementById('modalBody');
  const connected = !!familyCode;
  body.innerHTML = connected ? `
    <div class="header-title" style="font-size:1.3rem;">👨‍👩‍👧 Mã gia đình</div>
    <p class="sub mt-8">Mã đang dùng:</p>
    <div style="font-size:1.6rem;font-weight:800;text-align:center;letter-spacing:2px;margin:6px 0;">${esc(familyCode)}</div>
    <p class="sub" id="famStatus">${esc(syncText())}</p>
    <p class="sub mt-8" style="font-size:.85rem;">Nhập cùng mã này trên máy khác để thấy tên, avatar và sao của bé.</p>
    <button class="btn btn-primary w-full mt-8" id="btnFamSync">Đồng bộ ngay</button>
    <button class="btn btn-ghost w-full mt-8" id="btnFamOff">Ngắt kết nối</button>
    <button class="btn btn-ghost w-full mt-8" id="btnFamClose">Đóng</button>
  ` : `
    <div class="header-title" style="font-size:1.3rem;">👨‍👩‍👧 Mã gia đình</div>
    <p class="sub mt-8">Nhập mã để lưu và dùng chung dữ liệu giữa các máy.</p>
    <input id="famCode" placeholder="vd: gs-abc123" maxlength="30" autocapitalize="off" autocomplete="off" spellcheck="false">
    <p class="sub" id="famMsg" style="color:#c0392b;min-height:1.2em;font-size:.85rem;"></p>
    <button class="btn btn-primary w-full" id="btnFamGo">Kết nối</button>
    <button class="btn btn-ghost w-full mt-8" id="btnFamNew">Tạo mã mới</button>
    <button class="btn btn-ghost w-full mt-8" id="btnFamClose">Đóng</button>
  `;
  modal.classList.add('show');
  const $ = id => document.getElementById(id);
  $('btnFamClose').addEventListener('click', () => { playSfx('tap'); modal.classList.remove('show'); render(); });
  if (connected) {
    $('btnFamSync').addEventListener('click', () => { playSfx('tap'); syncNow(); });
    $('btnFamOff').addEventListener('click', () => {
      if (confirm('Ngắt kết nối? Dữ liệu vẫn còn trên máy này.')) { disconnectFamily(); modal.classList.remove('show'); render(); }
    });
  } else {
    $('btnFamNew').addEventListener('click', () => { playSfx('tap'); $('famCode').value = randomCode(); });
    $('btnFamGo').addEventListener('click', async () => {
      playSfx('tap');
      const btn = $('btnFamGo'); btn.disabled = true; btn.textContent = 'Đang kết nối…';
      const err = await connectFamily($('famCode').value);
      if (err) { $('famMsg').textContent = err; btn.disabled = false; btn.textContent = 'Kết nối'; return; }
      modal.classList.remove('show');
      showScreen(STATE.currentProfileId ? 'home' : 'profiles');
    });
  }
}

/* ============================================================
   INIT
   ============================================================ */
loadStorage();
initSync();
// preload unit 1
const s0 = document.createElement('script');
s0.src = 'data/u01.js';
s0.onload = () => {
  if (!STATE.profiles.length) {
    // create default profile for first run
    STATE.profiles.push({
      id: 'p_default',
      name: 'Friend',
      avatar: '🐵',
      history: [],
      wrongWords: {},
      best: {},
      updatedAt: 0
    });
    STATE.currentProfileId = 'p_default';
    saveLocal();
  }
  showScreen(STATE.currentProfileId ? 'home' : 'profiles');
};
s0.onerror = () => {
  showScreen('profiles');
};
document.head.appendChild(s0);
</script>
</body>
