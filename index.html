<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="grape/icon-192.png">
<link rel="apple-touch-icon" href="grape/icon-192.png">
<title>ChivasFamily</title>
<style>
:root{--bg:#F2F7FF;--ink:#1E2A44;--sub:#5B6784;--line:#D5E0F5;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121A2C;--ink:#EEF3FF;--sub:#A5B1CF;--line:#2C3B5F;--card:#1B2640;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px}
main{max-width:520px;margin:0 auto;padding:28px 20px}
h1{font-size:26px;margin:0 0 4px}
p{color:var(--sub);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px}
a.tile{display:block;text-align:center;text-decoration:none;color:var(--ink);font-weight:700}
a.tile .ic{width:100%;aspect-ratio:1;border-radius:22%;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18);margin-bottom:8px}
a.tile small{display:block;font-weight:400;color:var(--sub);font-size:14px}
a.tile:active{transform:scale(.96)}
a.soon{pointer-events:none;opacity:.55}
a.soon .ic{background:var(--card);box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;font-size:38px}
</style>
</head>
<body>
<main>
<h1>ChivasFamily</h1>
<p>Bấm vào biểu tượng để học.</p>
<div class="grid">

<a class="tile soon"><div class="ic">📚</div>RazKids<small>Sắp có</small></a>
</div>
</main>
</body>
</html>
