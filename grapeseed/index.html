:root[data-theme="dark"]{--bg:#121A2C;--card:#1B2640;--ink:#EEF3FF;--sub:#A5B1CF;--blue:#6C93FF;--blue-t:#0E1730;--blue-bg:#22335C;--ok:#5EDB9F;--ok-bg:#16402E;--bad:#FF7C9A;--bad-bg:#4A1F2C;--line:#2C3B5F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.35}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;font-weight:800;margin:6px 0 10px}
h2{font-size:22px;font-weight:800;margin:18px 0 4px}
p{margin:0 0 8px;color:var(--sub)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:12px 14px;color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 2px var(--line);min-height:50px;text-align:left}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary{background:var(--blue);color:var(--blue-t);font-weight:700;box-shadow:none;text-align:center;width:100%}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{text-align:center;font-weight:700;padding:10px 4px}
.tab.on{background:var(--ink);color:var(--bg);box-shadow:none}
.ulist{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;padding:12px;background:var(--card);border-radius:18px;box-shadow:inset 0 0 0 2px var(--line)}
.ulist button{text-align:center;padding:8px 0;min-height:48px;font-weight:700}
.ulist button.has{box-shadow:inset 0 0 0 2px var(--blue)}
.ulist button.sel{background:var(--blue);color:var(--blue-t);box-shadow:none}
.ulist button.empty{opacity:.45}
.tests{display:grid;gap:10px;margin-top:10px}
.test{display:flex;align-items:center;gap:14px;padding:14px 16px}
.test .i{font-size:32px}
.test b{font-size:20px;display:block}
.test small{color:var(--sub);font-size:15px;display:block;line-height:1.25}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub)}
.top button{min-height:40px;padding:6px 14px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.tt{font-size:15px;font-weight:700;color:var(--blue);margin:0 0 6px}
.word{font-size:54px;font-weight:800;text-align:center;margin:4px 0 0;word-break:break-word}
.ipa{text-align:center;color:var(--sub);font-size:21px;margin-bottom:4px}
.qtxt{font-size:22px;font-weight:700;margin:6px 0 12px}
.aud{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.aud button{border-radius:999px;padding:8px 18px;min-height:44px;text-align:center}
.pass{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:6px;font-size:19px;white-space:pre-line;max-height:34vh;overflow:auto}
.vc{margin-top:22px;padding:14px;background:var(--card);border-radius:16px;box-shadow:inset 0 0 0 2px var(--line)}
.vc b{font-size:19px}
.vc p{font-size:15px;margin:2px 0 8px}
.vc select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.pass b{display:block;margin-bottom:2px}
.opts{display:grid;gap:10px}
.opts button{font-size:20px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.opts small{display:block;color:var(--sub);font-size:15px}
.opts button.pick{background:var(--blue-bg);box-shadow:inset 0 0 0 3px var(--blue)}
.opts button.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 3px var(--ok)}
.opts button.no{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.mk{font-size:28px;font-weight:800}
input[type=text]{width:100%;font:inherit;font-size:28px;text-align:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 4px}
.blank{font-size:26px;text-align:center;margin:12px 0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:8px;border-radius:14px;margin:8px 0;background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.chips button{min-height:44px;padding:6px 14px;text-align:center;font-weight:700}
.chips.ans{background:var(--blue-bg)}
.fb{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 16px;margin:12px 0;font-weight:700}
.fb .mk{font-size:34px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.live{color:var(--sub);font-size:15px}
.score{font-size:64px;font-weight:800;text-align:center;margin:4px 0 0}
.sc2{text-align:center;color:var(--sub);margin-bottom:14px}
.rv{display:grid;gap:6px;margin:10px 0 16px}
.rv div{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:6px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.rv .y{color:var(--ok)}.rv .n{color:var(--bad)}
.rv span.m{font-size:24px;font-weight:800;width:28px}
.stack{display:grid;gap:10px;margin-top:10px}
.empty-msg{background:var(--card);border-radius:16px;padding:16px;margin-top:10px;box-shadow:inset 0 0 0 2px var(--line);color:var(--sub)}
</style>

 ["Miss Giraffe", "Mr. Zebra", "Mr. Lion", "Miss Turtle"], 0], ["Whose head is too small?", ["Miss Turtle", "Mr. Elephant", "Mr. Bear", "Mr. Lion"], 0], ["Who made Little Monkey’s shorts?", ["His mother", "His father", "Mr. Duck", "Mr. Bear"], 0]]}, {"title": "What Can You Do?", "text": "Hello, zebra.\nWhat can you do?\nCan you play with a ball?\n(No.)\n\nHello, giraffe.\nWhat can you do?\nCan you fly with the birds?\n(No.)\n\nHello, turtle.\nWhat can you do?\nCan you climb with the monkeys?\n(No.)\n\nHello, hippo.\nWhat can you do?\nCan you jump with the kangaroos?\n(No.)\n\nHello, lion.\nWhat can you do?\nCan you sit and play with me?\n(Yes.)\n\nHello, panda.\nWhat can you do?\nCan you dance and sing with me?\n(Yes.)\n\nLittle boy, little girl,\nWhat can you do?", "qs": [["Who can sit and play with me?", ["The lion", "The zebra", "The giraffe", "The turtle"], 0], ["Who can dance and sing with me?", ["The panda", "The hippo", "The zebra", "The turtle"], 0], ["Which animal is asked to fly with the birds?", ["The giraffe", "The turtle", "The zebra", "The hippo"], 0]]}, {"title": "A Mother Who Lives in a Boot", "text": "I know a mother who lives in a boot\nWith buttons all over her floor.\nShe uses an umbrella to keep her dry\nAnd a zipper that zips for a door.\n\nShe keeps her food in seven blue shoes.\nShe eats with a spoon from a cap.\nShe keeps her water in black and white shorts.\nShe drinks from a very tall hat.\n\nShe wears a sweater made with a string.\nShe wears a black thing on her nose.\nHer chair is a sweatshirt that looks like a swing.\nShe wears socks with ten little toes.\n\nShe has a girl who wears a long dress\nAnd over her dress is a skirt.\nShe has a boy.\nHe likes short pants\nAnd pockets all over his shirt.\n\nShe goes for a walk in her long pajamas.\nShe has a green comb on her head.\nHer hair is long and so is her chin.\nHer nose and her cheeks are red.\n\nI know a mother who lives in a boot.", "qs": [["Where does the mother live?", ["In a boot", "In a hat", "In a sock", "In a shoe"], 0], ["What does she use to keep dry?", ["An umbrella", "A hat", "A sweater", "A zipper"], 0], ["What is her door?", ["A zipper", "A button", "An umbrella", "A shoe"], 0], ["Where does she keep her food?", ["In seven blue shoes", "In a green cap", "In black socks", "In a red hat"], 0], ["What color is the comb on her head?", ["Green", "Red", "Blue", "Black"], 0]]}, {"title": "Jonny Bear Goes to the Zoo", "text": "My name is Jonny Bear.\nThis is my family.\nAnd this is our baby bear.\nI love my family and they love me.\n\nJonny: Let’s go to the zoo!\nI want to see our animal friends today.\nOur friends will be happy and we will have fun too.\n\nFather, can we go to the zoo, please?\nFather: Yes, you can go.\nJonny: Thank you, Father.\n\nJonny and his brother go to the zoo.\nBrother Bear stands in line with the boys and girls.\n\nGood morning, Brother Bear. How are you today?\nBrother Bear: I am fine, thank you.\n\nHello, animals!\nDo you want to come out and play?\nOh yes, they do!\n\nHello, little monkey.\nPlease come down and play with us.\nCome here. Let’s sing and dance.\n\nWhere are the zebras?\nOh, there you are!\nRun, zebras, run fast!\nThen come and play with us.\n\nWake up, lion and tiger!\nDo you want to play?\nNo, they do not want to play.\nThey want to sleep.\n\nLook! The small panda likes to sit in his chair.\nHello, small panda. You are so cute!\n\nThe rabbit can jump over you.\nDo not let the birds…\nOuch! They will fly up and fly away.\n\nDo not let an alligator…\nOuch! He will crawl through the grass and he will not come back.\n\nDo not let a snake…\nOuch! He will crawl away under the rock.\n\nHello, big elephant.\nCan you wave your trunk?\n\nHello, animals!\nDo you want to come with us?\n\nWhat can we do?\nOh, I know!\nI will be your teacher.\nLet’s all stand in a line.\n\nNow let’s walk through the zoo.\nTake one step… now two… three… four…\n\nDo you know how to fly like a bird?\nNow hop like a rabbit.\nClimb like a monkey.\nNow turn around and clap your hands.\nJump like a kangaroo… and stop!\n\nJonny: Let’s dance and sing!\nYes, let’s all stand in a circle.\n\nI’m happy to be at the zoo.\nI’m happy to be here with you.\nWe sing and we dance.\nWe like to do the things that we do at the zoo.\nI’m happy to have friends like you.\nI’m happy to have friends like you.\n\nIt’s time to go home.\nGoodbye, friends!", "qs": [["Who goes to the zoo with Jonny?", ["His brother", "His sister", "His mother", "His grandfather"], 0], ["What does Jonny say to his father?", ["Thank you, Father", "Good night, Father", "I am sorry", "Goodbye"], 0], ["What do the lion and the tiger want to do?", ["Sleep", "Dance", "Run", "Sing"], 0], ["Where does the small panda sit?", ["In his chair", "On a rock", "Under a tree", "In the grass"], 0], ["What can the rabbit do?", ["Jump over you", "Fly up", "Climb a tree", "Sing"], 0], ["Who will be the teacher?", ["Jonny", "Brother Bear", "The panda", "The lion"], 0], ["What does Jonny say at the end?", ["Goodbye, friends!", "Good morning", "Thank you", "Wake up"], 0]]}], "cloze": [["Hats and caps go on my ___.", "head"], ["Shoes and socks go on my ___.", "feet"], ["Pants go on my ___.", "legs"], ["I have two ___ and two ears.", "eyes"], ["I ___ my teeth with a toothbrush.", "brush"], ["I ___ my hands with water.", "wash"], ["Thank you. You are ___.", "welcome"], ["It is rainy. I use an ___.", "umbrella"]], "order": ["I am wearing a shirt.", "Your shoulders are too big.", "Hats and caps go on my head.", "What can you do?", "I like my shorts.", "Thank you, Father.", "Can you dance and sing with me?"]},
3:{"title": "School & Colors", "audio": "audio/u3.json", "words": [["school", "trường học", "🏫", "/skuːl/"], ["classroom", "lớp học", "", "/ˈklæsruːm/"], ["bathroom", "phòng vệ sinh", "🚻", "/ˈbæθruːm/"], ["office", "văn phòng", "🏢", "/ˈɔːfɪs/"], ["playground", "sân chơi", "", "/ˈpleɪɡraʊnd/"], ["sandbox", "hố cát", "", "/ˈsændbɑːks/"], ["slide", "cầu trượt", "", "/slaɪd/"], ["swing", "xích đu", "", "/swɪŋ/"], ["jungle gym", "khung leo trèo", "", "/ˈdʒʌŋɡl dʒɪm/"], ["merry-go-round", "vòng quay ngựa gỗ", "🎠", "/ˈmeri ɡoʊ raʊnd/"], ["book", "quyển sách", "📖", "/bʊk/"], ["bag", "cái cặp", "🎒", "/bæɡ/"], ["pencil", "bút chì", "✏️", "/ˈpensl/"], ["crayon", "bút sáp màu", "🖍️", "/ˈkreɪɑːn/"], ["marker", "bút lông", "", "/ˈmɑːrkər/"], ["eraser", "cục tẩy", "", "/ɪˈreɪsər/"], ["paper", "giấy", "📄", "/ˈpeɪpər/"], ["scissors", "cái kéo", "✂️", "/ˈsɪzərz/"], ["blocks", "khối xếp hình", "🧱", "/blɑːks/"], ["play dough", "đất nặn", "", "/ˈpleɪ doʊ/"], ["card", "tấm thẻ, thiệp", "🃏", "/kɑːrd/"], ["table", "cái bàn", "", "/ˈteɪbl/"], ["chair", "cái ghế", "🪑", "/tʃer/"], ["door", "cửa ra vào", "🚪", "/dɔːr/"], ["window", "cửa sổ", "🪟", "/ˈwɪndoʊ/"], ["wall", "bức tường", "", "/wɔːl/"], ["hook", "cái móc", "", "/hʊk/"], ["light", "bóng đèn", "💡", "/laɪt/"], ["red", "màu đỏ", "🔴", "/red/"], ["blue", "màu xanh dương", "🔵", "/bluː/"], ["green", "màu xanh lá", "🟢", "/ɡriːn/"], ["yellow", "màu vàng", "🟡", "/ˈjeloʊ/"], ["pink", "màu hồng", "", "/pɪŋk/"], ["purple", "màu tím", "🟣", "/ˈpɜːrpl/"], ["orange", "màu cam", "🟠", "/ˈɔːrɪndʒ/"], ["brown", "màu nâu", "🟤", "/braʊn/"], ["black", "màu đen", "⚫", "/blæk/"], ["white", "màu trắng", "⚪", "/waɪt/"], ["ant", "con kiến", "🐜", "/ænt/"], ["snack", "bữa ăn nhẹ", "🍪", "/snæk/"], ["lunch", "bữa trưa", "🍱", "/lʌntʃ/"], ["drink", "đồ uống, uống", "🥤", "/drɪŋk/"], ["water", "nước", "💧", "/ˈwɔːtər/"], ["song", "bài hát", "🎵", "/sɔːŋ/"], ["storybook", "sách truyện", "📚", "/ˈstɔːribʊk/"], ["ground", "mặt đất", "", "/ɡraʊnd/"], ["trash", "rác", "🗑️", "/træʃ/"], ["paint", "sơn, vẽ", "🎨", "/peɪnt/"]], "passages": [{"title": "Marvin Goes to School", "text": "The boys and girls are at school.\nThere is a knock on the door of the classroom.\nWho is there?\n\nThe teacher opens the door.\n“Good morning, Marvin,” she says.\n“Please come in.”\n\nThe boys and girls laugh and clap their hands.\nIt is fun to have a monkey at school.\n\nMarvin Monkey eats lunch with the boys and girls.\nThen they go outside to the playground.\n\nThe boys and girls slide with Marvin on the slide.\nThey swing on the swings.\nThey climb on the jungle gym.\nThey ride on the merry-go-round.\nThey play in the sand in the sandbox.\nThey run and play and have fun.\n\nThe boys and girls yell, but Marvin Monkey is quiet.\nHe cannot yell.\n\nMarvin is thirsty.\nHe gets a drink of water.\n\nThen it is time to go inside the classroom.\nThe boys and girls sit down in the chairs.\nMarvin sits down… but on the table!\n\nThe boys and girls sing a song.\nMarvin Monkey cannot sing.\nThe boys and girls play a game, but Marvin does not know what to do.\n\nBut a monkey can mark with a crayon.\nMarvin puts marks on a paper.\nHis marks are funny.\n\nNow it is time to go home.\n“Bye-bye,” the boys and girls say.\nThey wave goodbye to Marvin.\n\nIt was fun to have a monkey at school.", "qs": [["Who knocks on the door?", ["Marvin Monkey", "The teacher", "A bear", "A tiger"], 0], ["What do the boys and girls do when Marvin comes in?", ["Laugh and clap", "Run away", "Sleep", "Sing a song"], 0], ["Where does Marvin sit?", ["On the table", "On a chair", "On the floor", "On the slide"], 0], ["What can Marvin do with a crayon?", ["Mark on paper", "Sing a song", "Play a game", "Yell"], 0], ["What does Marvin drink?", ["Water", "Milk", "Juice", "Tea"], 0], ["Why is Marvin quiet?", ["He cannot yell", "He is sleeping", "He is hungry", "He is sad"], 0]]}, {"title": "I Like These Things", "text": "Hello, I’m Marvin Monkey\nand this is what I like at school.\n\nI like the jungle gym and the merry-go-round.\nI like to swing and I like to slide.\nI like playing with sand in the sandbox.\nI like playing outside on the playground.\n\nI like everything in the classroom.\nI like painting with red and black paint.\nI like playing with chairs and books and blocks and toys.\nI like playing games on the floor.\n\nI like lunchtime and playtime and story time.\nAnd oh, did I say snack time?\nWhen I’m hungry, I like to eat.\nWhen I’m thirsty, I like to drink.\n\nI like reading storybooks under the table.\nI like the page with the picture.\nI like Play-Doh and tape and scissors.\nI like making more and more trash.\n\nI like marking on cards and walls and windows.\nI like crayons and pencils and markers.\nI like erasers, too.", "qs": [["Where does Marvin like to play with sand?", ["In the sandbox", "On the slide", "In the classroom", "Under the table"], 0], ["What colors of paint does Marvin like?", ["Red and black", "Blue and green", "Yellow and pink", "Brown and white"], 0], ["Where does Marvin like reading storybooks?", ["Under the table", "On the slide", "In the sandbox", "On the swing"], 0], ["What does Marvin like to do when he is thirsty?", ["Drink", "Eat", "Sleep", "Sing"], 0]]}, {"title": "Our Day at School", "text": "We only have erasers\nand we want to make a book.\nWe need some other things.\nWill you help us go and look?\n\nWe need paper and crayons and markers.\n\nWe looked in the trash.\nWe looked out the door.\nWe cannot find our crayons,\nso we’ll go and look some more.\n\nWe looked under the chairs.\nWe looked in the bags.\nWe even looked in yours!\nWe cannot find our markers,\nso we’ll go and look some more.\n\nWe looked around the school.\nWe walked, we skipped and we ran.\nWe did not find our crayons,\nbut we found this in the sand.\n\nWe looked on the bus.\nWe looked all over the floor.\nWe did not find our markers,\nbut we found this by the back door.\n\nWe looked in the grass.\nWe looked in everything.\nWe did not find our paper,\nbut we found this under the swing.\n\nWe looked and we looked\nfor the things to make our book.\nWe found some paper, a crayon, and a marker.\nDo you want to see our book?", "qs": [["What do the children want to make?", ["A book", "A cake", "A game", "A song"], 0], ["Where did they look first?", ["In the trash", "On the bus", "In the grass", "Under the swing"], 0], ["What do the children need?", ["Paper, crayons and markers", "Books and toys", "Shoes and socks", "Chairs and tables"], 0], ["What did they find at the end?", ["Paper, a crayon and a marker", "A ball and a doll", "Shoes and a hat", "Food and water"], 0]]}, {"title": "My Toy Box", "text": "My toy box is red and black and blue.\nIt holds balls and games and other things, too.", "qs": [["What color is the toy box?", ["Red, black and blue", "Green and yellow", "Pink and purple", "White and brown"], 0]]}, {"title": "Jonny Bear Helps His Mother", "text": "Early one morning the sky is blue.\nThe little bears are playing.\n\nJonny is looking around for his brother and sister.\n“There you are, Sister,” he says.\n“I can see your hand and fingers.\nAnd there you are, Brother.\nI can see your cap and your feet.\nNow it’s your turn to look for me.”\n\n“But where are you, Jonny?” says Brother.\n“Keep looking,” says Sister.\n\nMother Bear opens the door.\n“Come here, little bears,” she says.\n“I want you to help me.\nGo and get your clothes.\nWe are going to wash them.\nThen you will have clean clothes to wear.”\n\n“Yes, Mother,” they said.\nThey all run in and close the door.\n\nThe three little bears take their clothes to Mother Bear.\n“Take the things out of your pockets,” Mother says.\n“Yes, we did.”\n\n“Now put on your shoes,” says Mother Bear.\n“Go out and put these clothes on the line.\nThen we will make something very nice to eat.”\n\nThe three little bears march out.\n“We can do this fast,” says Brother.\nThey sing a song and put the skirts and shirts and pants on the line.\n\nJonny is too short.\nHe cannot touch the line.\n“Sister, I cannot put this sweater up there.\nCan you help me?”\n“Yes, I will help you,” says Sister.\nShe puts his little sweater up.\n\nMother Bear is happy with her little bears.\n“Thank you for helping me,” she says.\n“You’re welcome, Mother.\nCan we put faces on the cookies?”\n“Yes, you can.”\n\nThe three little bears have some fun.\nThey make big eyes and small eyes.\nThey make short ears and long ears.\nSister puts red cheeks and lips on her face.\n\nNow it’s time to go to bed.\nJonny is sleepy.\nHe rubs his eyes and brushes his teeth.\nBrother washes his face with water.\nSister uses a comb to comb her hair.\n\n“In the morning,” says Mother Bear,\n“we will go swimming.\nWe will take food and many fish.\nMr. Sam and Miss Suzy will go with us.\nIt will be a good day.”", "qs": [["Who is Jonny looking for?", ["His brother and sister", "His mother", "His father", "His friend Marvin"], 0], ["What does Mother Bear want to wash?", ["Their clothes", "Their toys", "Their shoes only", "The cookies"], 0], ["Why can Jonny not put his sweater on the line?", ["He is too short", "He is too tall", "He is sleepy", "He is hungry"], 0], ["What do they put on the cookies?", ["Faces", "Hats", "Shoes", "Pockets"], 0], ["What will they do in the morning?", ["Go swimming", "Go to school", "Go to the zoo", "Wash clothes"], 0]]}], "cloze": [["The sky is ___.", "blue"], ["The grass is ___.", "green"], ["I have a ___ on my back. It has my books.", "bag"], ["The teacher opens the ___.", "door"], ["Marvin sits on the ___.", "table"], ["I ___ water when I am thirsty.", "drink"], ["We play in the ___ at the playground.", "sandbox"], ["Hello, how are you? I am ___, thank you.", "fine"]], "order": ["The sky is blue.", "I like the jungle gym.", "I have a book.", "We looked under the chairs.", "Hello, how are you?", "I am fine, thank you.", "Marvin goes to school."]},

"title": "The Spider’s Web", "text": "Hello, little ant.\nCome dance with me on my web.\nNo. My father says ants must never touch your web.\nSo the ant went to work with his little ant friends.\n\nHello, big cricket.\nCome dance with me on my web.\nNo. My father says crickets must never touch your web.\nSo the cricket went to jump with his big cricket friends.\n\nHello, ladybug.\nCome dance with me on my web.\nNo. My father says ladybugs must never touch your web.\nSo the ladybug went to play with her ladybug friends.\n\nHello, dragonfly.\nCome dance with me on my web.\nNo. My father says dragonflies must never touch your web.\nSo the dragonfly went to fly with his dragonfly friends.\n\nHello, caterpillar.\nCome dance with me on my web.\nNo. My father says caterpillars must never touch your web.\nSo the caterpillar went to eat with his caterpillar friends.\n\nHello, grasshopper.\nCome dance with me on my web.\nNo. My father says grasshoppers must never touch your web.\nBut you love to jump… and on my web you can jump high!\n\nThe little grasshopper looked and looked.\nHe did like to jump, and it would be so much fun to jump on the spider’s web.\nSo he jumped.\nJump, grasshopper, jump!\n\nMy web will not let you go!\n“Help!” called the grasshopper.\n“Father! Mother! Help me!”\n\nThey cannot help you, said the spider.\nYou’ve been a bad little bug.\nAll little bugs know they cannot touch my web.\n\nI will help you, said a very nice friend.\nBut good bugs must listen to their father and mother.\n\nYou can work with an ant.\nYou can jump with a cricket.\nYou can play with a ladybug.\nYou can fly with a dragonfly.\nYou can eat with a caterpillar.\nBut you must never, never dance with a spider.", "qs": [["What does the spider ask the bugs to do?", ["Dance on her web", "Eat her food", "Sleep in her house", "Sing a song"], 0], ["Why does the little ant say no?", ["His father says ants must never touch the web", "He is sleeping", "He is hungry", "He is sad"], 0], ["Which bug text": "The little bears are very happy today.\nThey are going to school.\n“Goodbye! Have a good day!”\n\nThey walk through the trees to their little bear school.\n\nIn the classroom the teacher turns on the light.\nAll the little bears come inside.\nThey put their jackets on hooks.\nThen they sit down at a long table.\n\n“Please be quiet,” says the teacher.\n“I will read you a story from this big storybook.\nJonny, will you hold the book?”\n“Yes, I will.”\n“And Sister, will you turn the pages?”\n“Oh yes, teacher.”\n\nThe little bears do more things at school.\nThey sing the ABC song.\nThey play with blocks.\nThey count and shout as they march in a circle.\nThey play a game with cards.\nTwo other bears make little things with red and yellow Play-Doh.\n\n“We are going to make some things to put up on the wall,” says the teacher.\n“I will give you some paper.\nYou can use crayons, markers, or pencils.”\n\nJonny Bear raises his hand.\n“Please, teacher,” he says, “may I go to the bathroom?”\nThree other bears raise their hands.\n“May we get a drink of water?”\n“Yes, you may.”\n\nIt’s lunchtime.\nThe little bears get out their lunch boxes.\nSome bears eat only a little snack.\nSome bears eat a big lunch.\nAll the little bears help pick up trash.\nThey all clean the table.\n\nJonny Bear looks out the window.\nHe wants to play outside.\n\nThe father bears made a nice new playground for the little bears.\nThey put the jungle gym black.\nThey put sand in a sandbox.\nThey put a swing in a tree.\nThey made a slide out of a big rock.\n\n“You may go outside to play now,” says the teacher.\n“Yay!”\n\nThey love to swing and slide.\n\n“Will you push me on the merry-go-round?\nI want to spin around many, many times!”\n\nNow it’s time to go home.\nDid all the little bears have fun?\nYes, it was a good day!", "qs": [["Where do the little bears put their jackets?", ["On hooks", "On the table", "In the bathroom", "On the floor"], 0], ["Who will hold the book?", ["Jonny", "Sister", "The if(q.k==="spell"||q.k==="cloze"){var inp=document.getElementById("ans");inp.onkeydown=function(e){if(e.key==="Enter"&&!G.done)act.click()}}
act.onclick=function(){
if(G.done){G.i++;question();return}
var good=false,msg="";
if(q.k==="mc"){
good=G.sel===q.ans;
app.querySelectorAll("[data-v]").forEach(function(x){var m=x.querySelector(".mk");x.classList.remove("pick");
if(x.dataset.v===q.ans){x.classList.add("ok");m.textContent="✓";m.style.color="var(--ok)"}
else if(x.dataset.v===G.sel){x.classList.add("no");m.textContent="✗";m.style.color="var(--bad)"}});
msg=good?"Đúng! +1 điểm":"Sai. "+q.log;
}else if(q.k==="order"){
good=G.built.map(function(x){return x.t}).join(" ")===q.s;
msg=good?"Đúng! +1 điểm":"Sai. Câu đúng: "+q.s;
}else{
var inp2=document.getElementById("ans"),v=inp2.value.trim().toLowerCase();
if(!v){return}
good=v===q.ans;inp2.disabled=true;
msg=good?"Đúng! +1 điểm":"Sai. Đáp án: "+q.ans+(q.w?" "+q.w[3]:"");
}
G.done=true;if(good)G.score++;G.log.push([q.log,good]);
document.getElementById("fb").innerHTML='<div class="fb '+(good?'ok':'no')+'"><span class="mk">'+(good?'✓':'✗')+'</span><span>'+esc(msg)+'</span></div>';
act.textContent=G.i+1>=G.qs.length?"Xem kết quả":"Câu tiếp theo";act.disabled=false;
if(q.k==="order"){document.getElementById("pool").innerHTML="";document.getElementById("built").querySelectorAll("button").forEach(function(b){b.disabled=true})}
};
}
function chips(q){
var b=document.getElementById("built"),p=document.getElementById("pool");
function draw(){
b.innerHTML="";p.innerHTML="";
G.built.forEach(function(x,i){var e=document.createElement("button");e.textContent=x.t;e.onclick=function(){if(G.done)return;G.built.splice(i,1);q.pool.push(x);draw()};b.appendChild(e)});
q.pool.forEach(function(x,i){var e=document.createElement("button");e.textContent=x.t;e.onclick=function(){if(G.done)return;q.pool.splice(i,1);G.built.push(x);draw()};p.appendChild(e)});
document.getElementById("act").disabled=G.done?false:q.pool.length>0;
}
draw();
}
function result(){
var n=G.qs.length,sc=G.score;
S.best[curUnit+"_"+G.type]={s:sc,n:n};save();
var h='<h1 style="text-align:center;margin-bottom:0">Kết quả</h1><p class="sc2">Unit '+curUnit+' - '+TITLES[G.type]+'</p><div class="score">'+sc+'/'+n+'</div><p class="sc2">câu đúng</p><div class="rv">';
G.log.forEach(function(l){h+='<div class="'+(l[1]?'y':'n')+'"><span class="m">'+(l[1]?'✓':'✗')+'</span><span>'+esc(l[0])+'</span></div>'});
h+='</div><div class="stack"><button class="primary" id="again">Làm lại bài này</button><button id="hm" style="text-align:center">Về danh sách unit</button></div>';
app.innerHTML=h;
document.getElementById("again").onclick=function(){start(G.type)};
document.getElementById("hm").onclick=home;
}
home();
</script>
</body>
</html>
