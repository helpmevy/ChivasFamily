<script>
const VERSION = "2026-11-11.2";
const NUM_Q = { listen: 10, vocab: 10, read: 10, write: 8 };

let unitsMeta = null;
let currentUnit = null;
let currentAudio = null;
let progress = {};
let missingAudio = new Set();
let voiceStatus = "loading";

// ---------- helpers ----------
function $(sel, el=document) { return el.querySelector(sel); }
function $$(sel, el=document) { return [...el.querySelectorAll(sel)]; }
function normalizeKey(text, forWord=false) {
  if (!text) return "";
  let t = text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
  t = t.replace(/\s+/g," ").trim();
  if (forWord) t = t.toLowerCase();
  return t;
}
function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem("gs_progress") || "{}"); }
  catch(e) { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem("gs_progress", JSON.stringify(progress)); } catch(e) {}
}
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pick(arr, n) {
  return shuffle(arr).slice(0, Math.min(n, arr.length));
}

// ---------- audio ----------
async function playKey(key) {
  const a = currentAudio && currentAudio[key];
  if (a && a.startsWith("data:audio")) {
    const audio = new Audio(a);
    try { await audio.play(); } catch(e) {}
    return true;
  }
  missingAudio.add(key);
  if ("speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(key.replace(/^[wsl]:/, ""));
    u.lang = "en-US";
    u.rate = key.startsWith("s:") ? 0.7 : 1.0;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return false;
  }
  return false;
}
function playText(text, slow=false) {
  const nk = normalizeKey(text, false);
  if (currentAudio) {
    const tryKeys = slow
      ? ["s:"+normalizeKey(text,true), "w:"+normalizeKey(text,true)]
      : ["l:"+nk, "w:"+normalizeKey(text,true)];
    for (const k of tryKeys) {
      if (currentAudio[k]) return playKey(k);
    }
  }
  return playKey((slow ? "s:" : "l:") + (slow ? normalizeKey(text,true) : nk));
}
function playWord(en, slow=false) {
  return playKey((slow ? "s:" : "w:") + normalizeKey(en, true));
}

// ---------- data ----------
async function loadUnits() {
  const r = await fetch(`units.json?v=${VERSION}`);
  unitsMeta = await r.json();
  return unitsMeta;
}
async function loadUnit(id) {
  const meta = unitsMeta.units.find(u => u.id === id);
  if (!meta) throw new Error("Unit not found");
  const [data, audio] = await Promise.all([
    fetch(`${meta.data}?v=${meta.rev}`).then(r => r.json()),
    fetch(`${meta.audio}?v=${meta.rev}`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]);
  currentUnit = data;
  currentAudio = audio || {};
  const keysNeeded = countNeededKeys(data);
  const have = Object.keys(currentAudio).filter(k => currentAudio[k] && currentAudio[k].startsWith("data:audio")).length;
  voiceStatus = (have === 0 || have < keysNeeded * 0.4) ? "fallback" : "ready";
  return data;
}
function countNeededKeys(data) {
  let n = 0;
  (data.words||[]).forEach(() => n += 2);
  (data.passages||[]).forEach(p => {
    (p.text||"").split("\n").forEach(l => { if (l.trim()) n++; });
  });
  (data.dialogs||[]).forEach(d => { if (d.q) n++; if (d.a) n++; });
  (data.order||[]).forEach(s => { if (s.trim()) n++; });
  (data.cloze||[]).forEach(c => { if (c.s) n++; });
  (data.write||[]).forEach(w => { if (w.q) n++; });
  return n;
}

// ---------- views UI DaisyUI ----------
function header(title, backFn) {
  return `
    <div class="navbar bg-primary text-primary-content shadow-lg px-4 sticky top-0 z-30 rounded-b-2xl">
      <div class="flex-none">
        ${backFn ? `<button class="btn btn-circle btn-secondary btn-sm text-lg shadow" id="btn-back" aria-label="Quay lại">⬅️</button>` : `<div class="w-8"></div>`}
      </div>
      <div class="flex-1 text-center">
        <h1 class="text-xl font-bold tracking-wide">${title}</h1>
      </div>
      <div class="flex-none w-8"></div>
    </div>`;
}

function voiceBadge() {
  if (voiceStatus === "ready") return `<div class="alert alert-success shadow-md py-2 text-sm font-semibold mb-4"><span>✨ Giọng AI chuẩn đã sẵn sàng!</span></div>`;
  if (voiceStatus === "loading") return `<div class="alert alert-warning shadow-md py-2 text-sm font-semibold mb-4"><span>⏳ Đang nạp giọng nói cho bé...</span></div>`;
  return `<div class="alert alert-error shadow-md py-2 text-xs font-semibold mb-4"><span>⚠️ Đang dùng giọng tạm thời từ máy.</span></div>`;
}

/* ===== 1. APP HOME ===== */

  html += `<div class="flex flex-col gap-4">`;
  html += `
    <button class="card bg-accent text-accent-content shadow-lg hover:shadow-xl kid-card border-4 border-base-100 flex-row items-center p-4 gap-4 text-left" id="go-grapeseed">
      <div class="text-5xl bounce-icon">🍇</div>
      <div class="flex-1">
        <div class="text-2xl font-bold">GrapeSEED</div>
        <div class="text-sm opacity-90 font-medium">Động vật, gia đình & bạn bè 🐶🐱</div>
      </div>
      <div class="text-2xl">➡️</div>
    </button>
  `;
  html += `
    <button class="card bg-base-300 opacity-60 shadow flex-row items-center p-4 gap-4 text-left cursor-not-allowed" disabled>
      <div class="text-5xl">📚</div>
      <div class="flex-1">
        <div class="text-2xl font-bold">RAZ Kids</div>
        <div class="text-sm font-medium">Sắp ra mắt thôi... 🚀</div>
      </div>
    </button>
  `;
  html += `</div></div>`;
  $("#view").innerHTML = html;
  $("#go-grapeseed").onclick = () => viewGrapeseedHome();
}

/* ===== 2. GRAPESEED HOME ===== */
function viewGrapeseedHome() {
  const groups = [
    { title: "Unit 1 – 10 🐥", units: unitsMeta.units.filter(u => u.id >= 1 && u.id <= 10) },
    { title: "Unit 11 – 20 🐯", units: unitsMeta.units.filter(u => u.id >= 11 && u.id <= 20) },
    { title: "Unit 21 – 30 🦁", units: unitsMeta.units.filter(u => u.id >= 21 && u.id <= 30) }
  ].filter(g => g.units.length);

  let html = header("GrapeSEED 🍇", () => viewAppHome()) + `<div class="p-4 flex-1">`;
  html += `<p class="text-base-content/70 font-semibold mb-3 text-center">Bé chọn bài học nhé! ⭐</p>`;
  groups.forEach(g => {
    html += `<div class="divider text-primary font-bold text-lg my-2">${g.title}</div>`;
    html += `<div class="flex flex-col gap-3">`;
    g.units.forEach(u => {
      html += `
        <button class="btn btn-neutral btn-lg flex justify-between items-center h-auto py-3 px-4 rounded-2xl shadow-md border-2 border-primary/20 kid-card unit-btn" data-id="${u.id}">
          <div class="flex items-center gap-3">
            <div class="badge badge-primary badge-lg text-lg font-bold w-10 h-10 p-0 rounded-full">${u.id}</div>
            <div class="text-left">
              <div class="font-bold text-base text-neutral-content">${u.title}</div>
              <div class="text-xs text-neutral-content/70 font-medium">Unit ${u.id}</div>
            </div>
          </div>
          <div class="text-xl">🌟</div>
        </button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewAppHome();
  $$(".unit-btn").forEach(b => b.onclick = () => openUnit(+b.dataset.id));
}

/* ===== 3. UNIT HOME ===== */
async function openUnit(id) {
  $("#view").innerHTML = header("Đang tải... ⏳") + `<div class="p-6 text-center"><span class="loading loading-spinner loading-lg text-primary"></span><p class="mt-4 font-bold text-base-content/70">Đang chuẩn bị Unit ${id} cho bé...</p></div>`;
  try {
    await loadUnit(id);
    viewUnitHome();
  } catch(e) {
    $("#view").innerHTML = header("Lỗi 😢") + `<div class="p-6 text-center"><p class="text-error font-bold">Không tải được bài học rồi!</p><p class="text-xs mt-1">${e.message}</p>
      <button class="btn btn-primary mt-6 rounded-full" id="btn-back-err">⬅️ Quay lại danh sách</button></div>`;
    $("#btn-back-err").onclick = () => viewGrapeseedHome();
  }
}

function viewUnitHome() {
  const u = currentUnit;
  let html = header(`Unit ${u.id} 🎈`, () => viewGrapeseedHome()) + `<div class="p-4 flex-1">`;
  html += voiceBadge();
  html += `<div class="text-center mb-5">
    <h2 class="text-2xl font-bold text-primary">${u.title}</h2>
    <div class="badge badge-secondary gap-1 mt-1 font-semibold"><span>${(u.words||[]).length} từ mới</span> • <span>${(u.passages||[]).length} bài đọc</span></div>
  </div>`;

  html += `<div class="grid grid-cols-2 gap-3">
    <button class="btn btn-accent flex-col h-auto py-4 rounded-2xl shadow-md border-b-4 border-accent-focus kid-card activity-btn" data-v="words">
      <span class="text-4xl mb-1 bounce-icon">🃏</span>
      <span class="font-bold text-base">Học từ</span>
      <span class="text-xs opacity-80 font-normal">Thẻ từ + Nghe 🎧</span>
    </button>
    <button class="btn btn-warning flex-col h-auto py-4 rounded-2xl shadow-md border-b-4 border-warning-focus kid-card activity-btn" data-v="read">
      <span class="text-4xl mb-1 bounce-icon">📖</span>
      <span class="font-bold text-base">Đọc bài</span>
      <span class="text-xs opacity-80 font-normal">Truyện hay 📚</span>
    </button>
    <button class="btn btn-info flex-col h-auto py-4 rounded-2xl shadow-md border-b-4 border-info-focus kid-card activity-btn" data-v="listen">
      <span class="text-4xl mb-1 bounce-icon">👂</span>
      <span class="font-bold text-base">Luyện nghe</span>
      <span class="text-xs opacity-80 font-normal">Thử tài tinh mắt 👀</span>
    </button>
    <button class="btn btn-success flex-col h-auto py-4 rounded-2xl shadow-md border-b-4 border-success-focus kid-card activity-btn" data-v="vocab">
      <span class="text-4xl mb-1 bounce-icon">🔤</span>
      <span class="font-bold text-base">Từ vựng</span>
      <span class="text-xs opacity-80 font-normal">Đố vui & Chọn hình 🎨</span>
    </button>
    <button class="btn btn-secondary flex-col h-auto py-4 rounded-2xl shadow-md border-b-4 border-secondary-focus kid-card activity-btn" data-v="readtest">
      <span class="text-4xl mb-1 bounce-icon">📝</span>
      <span class="font-bold text-base">Đọc hiểu</span>
      <span class="text-xs opacity-80 font-normal">Hội thoại ✨</span>
    </button>
    <button class="btn btn-error flex-col h-auto py-4 rounded-2xl shadow-md border-b-4 border-error-focus kid-card activity-btn" data-v="write">
      <span class="text-4xl mb-1 bounce-icon">✍️</span>
      <span class="font-bold text-base">Tập viết</span>
      <span class="text-xs opacity-80 font-normal">Xếp chữ 🧩</span>
    </button>
  </div>`;

  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewGrapeseedHome();
  $$(".activity-btn").forEach(b => {
    b.onclick = () => showActivity(b.dataset.v);
  });
}

function showActivity(name) {
  if (name === "words") viewWords();
  else if (name === "read") viewRead();
  else if (name === "listen") startTest("listen");
  else if (name === "vocab") startTest("vocab");
  else if (name === "readtest") startTest("read");
  else if (name === "write") startTest("write");
}

/* ===== Học từ ===== */
function viewWords() {
  const words = currentUnit.words || [];
  let html = header(`Học từ 🃏`, () => viewUnitHome()) + `<div class="p-4 flex-1 flex flex-col justify-between">`;
  html += `<div id="word-area" class="flex-1 flex items-center justify-center"></div>`;
  html += `<div class="mt-4">
    <div class="flex gap-2">
      <button class="btn btn-outline btn-primary flex-1 rounded-2xl text-base" id="w-prev">⬅️ Trước</button>
      <button class="btn btn-primary flex-1 rounded-2xl text-base font-bold shadow-lg" id="w-slow">🐢 Chậm</button>
      <button class="btn btn-outline btn-primary flex-1 rounded-2xl text-base" id="w-next">Sau ➡️</button>
    </div>
    <p class="text-xs text-center text-base-content/60 mt-3 font-semibold">👉 Chạm vào hình để nghe đọc lại nhé!</p>
  </div>`;
  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();

  let idx = 0;
  const area = $("#word-area");
  function render() {
    const w = words[idx];
    if (!w) return;
    area.innerHTML = `
    <div class="card bg-base-100 shadow-2xl border-4 border-primary/30 w-full p-6 text-center cursor-pointer kid-card rounded-3xl">
      <div class="text-7xl mb-3 bounce-icon">${w.emoji || "📖"}</div>
      <div class="text-3xl font-bold text-primary tracking-wide">${w.en}</div>
      <div class="text-base text-base-content/60 font-medium my-1">${w.ipa || ""}</div>
      <div class="text-xl font-semibold text-secondary mt-2">${w.vi || ""}</div>
      <div class="badge badge-ghost mt-4 mx-auto">${idx+1} / ${words.length}</div>
    </div>`;
    area.onclick = () => playWord(w.en);
  }
  render();
  $("#w-prev").onclick = () => { idx = (idx - 1 + words.length) % words.length; render(); };
  $("#w-next").onclick = () => { idx = (idx + 1) % words.length; render(); };
  $("#w-slow").onclick = () => playWord(words[idx].en, true);
}

/* ===== Đọc bài ===== */
function viewRead() {
  const passages = currentUnit.passages || [];
  if (!passages.length) {
    $("#view").innerHTML = header("Đọc bài 📖", () => viewUnitHome()) +
      `<div class="p-6 text-center text-base-content/70 font-semibold">Chưa có bài đọc nào.</div>`;
    $("#btn-back").onclick = () => viewUnitHome();
    return;
  }
  let html = header(`Đọc bài 📖`, () => viewUnitHome()) + `<div class="p-4 flex-1">`;
  html += `<div class="flex flex-wrap gap-2 mb-4 justify-center" id="pass-tabs">`;
  passages.forEach((p,i) => {
    html += `<button class="btn btn-sm rounded-full ${i===0?"btn-primary":"btn-outline btn-primary"}" data-i="${i}">${p.title}</button>`;
  });
  html += `</div><div id="pass-content"></div></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();

  function show(i) {
    const p = passages[i];
    const lines = (p.text || "").split("\n");
    let h = `<div class="card bg-base-100 p-4 shadow-lg border-2 border-base-300 rounded-2xl mb-4">
      <div class="badge badge-accent font-semibold mb-2">${p.type} ${p.src ? '• ' + p.src : ''}</div>`;
    lines.forEach(line => {
      if (!line.trim()) h += `<div class="h-2"></div>`;
      else h += `<div class="passage-line p-3 rounded-xl mb-1.5 bg-base-200 border-2 border-transparent cursor-pointer font-medium text-base hover:bg-primary/10" data-line="${encodeURIComponent(line)}">${line}</div>`;
    });
    h += `<button class="btn btn-secondary w-full mt-4 rounded-xl font-bold shadow" id="play-all">🔊 Nghe cả bài</button></div>`;

    if (p.qs && p.qs.length) {
      h += `<div class="divider text-secondary font-bold">Câu hỏi bài đọc 🤔</div>`;
      p.qs.forEach((q, qi) => {
        h += `<div class="card bg-base-100 p-4 shadow border-2 border-base-200 rounded-2xl mb-3">
          <strong class="text-base mb-3 block">${qi+1}. ${q.q}</strong><div class="flex flex-col gap-2">`;
        const opts = shuffle(q.options.map((o,oi)=>({o,oi})));
        opts.forEach(({o,oi}) => {
          h += `<button class="btn btn-outline btn-neutral justify-start text-left h-auto py-2.5 px-4 rounded-xl text-sm font-semibold qs-opt" data-qi="${qi}" data-oi="${oi}">${o}</button>`;
        });
        h += `</div><div class="font-bold text-sm mt-2 min-h-[20px]" id="fb-${qi}"></div></div>`;
      });
    }
    $("#pass-content").innerHTML = h;

    $$(".passage-line").forEach(el => {
      el.onclick = () => {
        $$(".passage-line").forEach(x => x.classList.remove("active"));
        el.classList.add("active");
        playText(decodeURIComponent(el.dataset.line));
      };
    });
    $("#play-all").onclick = async () => {
      for (const line of lines) {
        if (!line.trim()) continue;
        await playText(line);
        await new Promise(r => setTimeout(r, 850));
      }
    };
    $$(".qs-opt").forEach(btn => {
      btn.onclick = () => {
        const qi = +btn.dataset.qi;
        const oi = +btn.dataset.oi;
        const q = p.qs[qi];
        const fb = $(`#fb-${qi}`);
        $$(".qs-opt").filter(b => +b.dataset.qi === qi).forEach(b => {
          b.disabled = true;
          if (+b.dataset.oi === q.answer) {
            b.classList.remove("btn-outline", "btn-neutral");
            b.classList.add("btn-success");
          }
        });
        if (oi === q.answer) {
          fb.className = "font-bold text-sm mt-2 text-success";
          fb.textContent = "🎉 Đúng rồi! Bé giỏi quá!";
        } else {
          btn.classList.remove("btn-outline", "btn-neutral");
          btn.classList.add("btn-error");
          fb.className = "font-bold text-sm mt-2 text-error";
          fb.textContent = "❌ Chưa đúng rồi, xem đáp án xanh nhé!";
        }
      };
    });
  }

  $$("#pass-tabs button").forEach(b => {
    b.onclick = () => {
      $$("#pass-tabs button").forEach(x => {
        x.classList.remove("btn-primary");
        x.classList.add("btn-outline", "btn-primary");
      });
      b.classList.remove("btn-outline");
      b.classList.add("btn-primary");
      show(+b.dataset.i);
    };
  });
  show(0);
}

/* ===== Tests ===== */
let testState = null;

function startTest(type) {
  const questions = buildQuestions(type, currentUnit);
  if (!questions.length) {
    $("#view").innerHTML = header("Luyện tập 🎯", () => viewUnitHome()) +
      `<div class="p-6 text-center text-base-content/70 font-semibold"><p>Unit này chưa đủ dữ liệu thử thách.</p>
       <button class="btn btn-outline btn-primary mt-4 rounded-full" id="btn-back2">⬅️ Quay lại</button></div>`;
    $("#btn-back").onclick = $("#btn-back2").onclick = () => viewUnitHome();
    return;
  }
  testState = { type, questions, idx: 0, correct: 0, answers: [], answered: false };
  renderQuestion();
}

function buildQuestions(type, u) {
  const qs = [];
  const words = (u.words || []).filter(w => w.en);
  const withEmoji = words.filter(w => w.emoji && w.emoji.length < 5);
  const byCat = {};
  words.forEach(w => {
    const c = w.cat || "thing";
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(w);
  });

  if (type === "listen") {
    pick(withEmoji, 5).forEach(w => {
      const distractors = pick((byCat[w.cat] || words).filter(x => x.en !== w.en && x.emoji), 3);
      let opts = shuffle([w, ...distractors]).slice(0,4);
      while (opts.length < 4) {
        const extra = pick(withEmoji.filter(x => !opts.find(o=>o.en===x.en)), 1)[0];
        if (extra) opts.push(extra); else break;
      }
      qs.push({
        part: "Phần 1 – Nghe từ, chọn hình 🎧",
        kind: "listen-pic",
        prompt: "Bé lắng nghe rồi chọn hình đúng nhé!",
        audioWord: w.en,
        options: opts.map(o => ({ en: o.en, emoji: o.emoji, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === w.en)
      });
    });
    const lines = [];
    (u.passages||[]).forEach(p => (p.text||"").split("\n").forEach(l => { if (l.trim().length > 8) lines.push(l.trim()); }));
    (u.dialogs||[]).forEach(d => { if (d.q) lines.push(d.q); if (d.a) lines.push(d.a); });
    pick(lines, 3).forEach(line => {
      const opts = shuffle([line, "I see a cat.", "The bird is sleeping.", "My father is small."]);
      qs.push({
        part: "Phần 2 – Nghe câu chọn ý 💬",
        kind: "listen-q",
        prompt: "Bé hãy nghe rồi chọn câu vừa nghe!",
        audioText: line,
        options: opts,
        answer: opts.indexOf(line)
      });
    });
    pick(withEmoji, 2).forEach(w => {
      let opts = shuffle(pick(withEmoji, 4).map(o => ({en:o.en,emoji:o.emoji,ipa:o.ipa})));
      let ans = opts.findIndex(o => o.en === w.en);
      if (ans < 0) { opts[0] = {en:w.en,emoji:w.emoji,ipa:w.ipa}; ans = 0; }
      qs.push({
        part: "Phần 3 – Thử tài phản xạ ⚡",
        kind: "listen-pic",
        prompt: "Nghe từ và nhanh tay chọn!",
        audioWord: w.en,
        options: opts,
        answer: ans
      });
    });
  }

  if (type === "vocab") {
    pick(withEmoji, 4).forEach(w => {
      const distractors = pick(words.filter(x => x.en !== w.en), 3);
      const opts = shuffle([w, ...distractors]);
      qs.push({
        part: "Phần 1 – Nhìn hình chọn từ 🎨",
        kind: "pic-word",
        prompt: `${w.emoji || "📖"} Đây là từ gì nhỉ?`,
        options: opts.map(o => ({ en: o.en, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === w.en)
      });
    });
    pick(u.riddles || [], 3).forEach(r => {
      const ans = words.find(w => w.en === r.answer) || { en: r.answer, ipa: "" };
      const distractors = pick(words.filter(x => x.en !== r.answer), 3);
      const opts = shuffle([ans, ...distractors]);
      qs.push({
        part: "Phần 2 – Đố vui 🧩",
        kind: "riddle",
        prompt: r.clue,
        options: opts.map(o => ({ en: o.en, ipa: o.ipa || "" })),
        answer: opts.findIndex(o => o.en === r.answer)
      });
    });
    const cats = Object.keys(byCat).filter(c => byCat[c].length >= 3);
    pick(cats, 3).forEach(c => {
      const same = pick(byCat[c], 3);
      const otherCat = pick(Object.keys(byCat).filter(x => x !== c), 1)[0];
      const odd = pick(byCat[otherCat] || words, 1)[0];
      if (!odd) return;
      const opts = shuffle([...same, odd]);
      qs.push({
        part: "Phần 3 – Tìm từ khác biệt 🔍",
        kind: "odd",
        prompt: "Từ nào không cùng nhóm?",
        options: opts.map(o => ({ en: o.en, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === odd.en)
      });
    });
  }

  if (type === "read") {
    (u.passages || []).forEach(p => {
      (p.qs || []).forEach(q => {
        const opts = shuffle(q.options.map((o,i)=>({o,i})));
        qs.push({
          part: "Đọc hiểu – " + p.title,
          kind: "mc",
          prompt: q.q,
          options: opts.map(x => x.o),
          answer: opts.findIndex(x => x.i === q.answer)
        });
      });
    });
    pick(u.dialogs || [], 3).forEach(d => {
      const others = pick((u.dialogs||[]).filter(x => x.a !== d.a), 3).map(x => x.a);
      const opts = shuffle([d.a, ...others]);
      qs.push({
        part: "Hội thoại ✨",
        kind: "mc",
        prompt: d.q,
        options: opts,
        answer: opts.indexOf(d.a)
      });
    });
    if ((u.order||[]).length >= 3) {
      const seq = u.order.slice(0,4);
      qs.push({
        part: "Sắp xếp câu 🏗️",
        kind: "order",
        prompt: "Xếp các câu theo thứ tự bài đọc",
        items: shuffle([...seq]),
        correctOrder: seq
      });
    }
  }

  if (type === "write") {
    pick(u.cloze || [], 3).forEach(c => {
      qs.push({
        part: "Điền từ ✍️",
        kind: "cloze",
        prompt: c.s.replace("___", "______"),
        answer: c.a
      });
    });
    pick(u.order || [], 2).forEach(sent => {
      const wordsIn = sent.replace(/[.,!?]/g,"").split(/\s+/).filter(Boolean);
      qs.push({
        part: "Xếp từ thành câu 🧩",
        kind: "scramble",
        prompt: "Ghép chữ thành câu hoàn chỉnh",
        items: shuffle(wordsIn),
        answer: sent.replace(/[.,!?]/g,"").trim().toLowerCase()
      });
    });
    pick(u.write || [], 3).forEach(w => {
      qs.push({
        part: "Tự viết câu 📝",
        kind: "free",
        prompt: w.q,
        model: w.model
      });
    });
  }
  return qs.slice(0, NUM_Q[type] || 10);
}

function renderQuestion() {
  const st = testState;
  if (!st) return;
  if (st.idx >= st.questions.length) return showResult();

  const q = st.questions[st.idx];
  st.answered = false;
  let html = header(`Luyện tập 🎯`, () => viewUnitHome());
  html += `<div class="p-4 flex-1">`;
  html += `<div class="flex justify-between items-center mb-2">
    <button class="btn btn-ghost btn-xs font-bold text-base-content/60" id="btn-exit">❌ Thoát</button>
    <span class="badge badge-primary font-bold">Câu ${st.idx+1} / ${st.questions.length}</span>
  </div>`;
  html += `<progress class="progress progress-primary w-full mb-4" value="${(st.idx/st.questions.length)*100}" max="100"></progress>`;
  html += `<div class="text-xs font-bold text-secondary mb-1">${q.part || ""}</div>`;
  html += `<div class="card bg-base-100 p-5 shadow-xl border-2 border-primary/20 rounded-3xl" id="qcard">`;
  html += `<div class="font-bold text-lg mb-4 text-base-content">${q.prompt}</div>`;

  if (q.kind === "listen-pic" || q.kind === "listen-q") {
    html += `<button class="btn btn-secondary w-full rounded-2xl text-base font-bold shadow mb-3 bounce-icon" id="btn-listen">🔊 Bấm để nghe</button>`;
    html += `<p class="text-xs text-center text-base-content/60 font-semibold mb-3">Bé hãy bấm loa trước khi chọn nhé!</p>`;
  }

  if (q.kind === "listen-pic") {
    html += `<div class="grid grid-cols-2 gap-3" id="opts">`;
    (q.options||[]).forEach((o,i) => {
      html += `<button class="btn btn-neutral h-auto flex-col p-4 rounded-2xl border-2 kid-card font-bold text-center" data-i="${i}" disabled>
        <span class="text-5xl mb-1">${o.emoji||"❓"}</span>
        <span class="text-base">${o.en}</span>
        <span class="text-xs font-normal opacity-70">${o.ipa||""}</span>
      </button>`;
    });
    html += `</div>`;
  } else if (q.kind === "pic-word") {
    html += `<div class="grid grid-cols-2 gap-3" id="opts">`;
    (q.options||[]).forEach((o,i) => {
      html += `<button class="btn btn-outline btn-neutral h-auto flex-col p-3 rounded-2xl border-2 kid-card font-bold text-center" data-i="${i}">
        <span class="text-lg">${o.en}</span>
        <span class="text-xs font-normal opacity-70">${o.ipa||""}</span>
      </button>`;
    });
    html += `</div>`;
  } else if (q.kind === "riddle" || q.kind === "odd" || q.kind === "mc" || q.kind === "listen-q") {
    html += `<div class="flex flex-col gap-2" id="opts">`;
    (q.options||[]).forEach((o,i) => {
      const label = typeof o === "string" ? o : (o.en + (o.ipa ? ` <span class="text-xs font-normal opacity-70">(${o.ipa})</span>` : ""));
      html += `<button class="btn btn-outline btn-neutral justify-start text-left h-auto py-3 px-4 rounded-2xl font-bold text-base" data-i="${i}" ${q.kind==="listen-q"?"disabled":""}>${label}</button>`;
    });
    html += `</div>`;
  } else if (q.kind === "cloze") {
    html += `<input id="cloze-in" type="text" autocomplete="off" class="input input-bordered input-primary w-full text-lg rounded-2xl text-center font-bold" placeholder="Viết từ còn thiếu...">`;
    html += `<button class="btn btn-primary w-full mt-4 rounded-2xl font-bold text-base shadow" id="btn-check-ans">Trả lời ✨</button>`;
  } else if (q.kind === "scramble") {
    html += `<div id="scramble-bank" class="flex flex-wrap gap-2 mb-3"></div>`;
    html += `<div id="scramble-out" class="min-h-[56px] p-3 border-2 border-dashed border-primary/40 rounded-2xl mb-3 flex items-center flex-wrap gap-2 bg-base-200 font-bold text-primary"></div>`;
    html += `<button class="btn btn-primary w-full rounded-2xl font-bold text-base shadow" id="btn-check-ans">Kiểm tra 🧩</button>`;
  } else if (q.kind === "order") {
    html += `<div id="order-list" class="flex flex-col gap-2"></div>`;
    html += `<button class="btn btn-primary w-full mt-4 rounded-2xl font-bold text-base shadow" id="btn-check-ans">Kiểm tra thứ tự 🏗️</button>`;
  } else if (q.kind === "free") {
    html += `<textarea id="free-in" rows="3" class="textarea textarea-primary w-full text-base rounded-2xl font-medium" placeholder="Viết câu trả lời của bé vào đây..."></textarea>`;
    html += `<button class="btn btn-primary w-full mt-4 rounded-2xl font-bold text-base shadow" id="btn-check-ans">Xem đáp án mẫu 🌟</button>`;
  }

  html += `<div class="font-bold text-base mt-3 min-h-[26px] text-center" id="fb"></div>`;
  html += `<button class="btn btn-accent w-full mt-2 rounded-2xl font-bold text-lg shadow hidden" id="btn-next">Câu tiếp ➡️</button>`;
  html += `</div></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();
  $("#btn-exit").onclick = () => viewUnitHome();

  let listened = q.kind !== "listen-pic" && q.kind !== "listen-q";

  if (q.kind === "listen-pic" || q.kind === "listen-q") {
    $("#btn-listen").onclick = async () => {
      if (q.audioWord) await playWord(q.audioWord);
      else if (q.audioText) await playText(q.audioText);
      listened = true;
      $$("#opts [data-i]").forEach(b => b.disabled = false);
      $("#btn-listen").textContent = "🔊 Nghe lại";
    };
  }

  function markAnswer(chosen) {
    if (st.answered) return;
    st.answered = true;
    const correct = chosen === q.answer;
    if (correct) st.correct++;
    st.answers.push({ q, chosen, correct });
    $$("#opts [data-i]").forEach(b => {
      b.disabled = true;
      const i = +b.dataset.i;
      if (i === q.answer) {
        b.classList.remove("btn-outline", "btn-neutral");
        b.classList.add("btn-success");
      }
      if (i === chosen && !correct) {
        b.classList.remove("btn-outline", "btn-neutral");
        b.classList.add("btn-error");
      }
    });
    const fb = $("#fb");
    if (correct) { fb.className = "font-bold text-base mt-3 text-center text-success"; fb.textContent = "🎉 Bé giỏi lắm! Đúng rồi!"; }
    else { fb.className = "font-bold text-base mt-3 text-center text-error"; fb.textContent = "❌ Chưa chính xác rồi!"; }
    $("#btn-next").classList.remove("hidden");
  }

  $$("#opts [data-i]").forEach(b => {
    b.onclick = () => { if (!listened) return; markAnswer(+b.dataset.i); };
  });

  if (q.kind === "cloze") {
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      const val = normalizeKey($("#cloze-in").value, true);
      const ans = normalizeKey(q.answer, true);
      st.answered = true;
      const ok = val === ans;
      if (ok) st.correct++;
      st.answers.push({ q, chosen: val, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="font-bold text-base mt-3 text-center text-success"; fb.textContent="🎉 Hoàn hảo! Bé giỏi quá!"; }
      else { fb.className="font-bold text-base mt-3 text-center text-error"; fb.textContent=`❌ Đáp án đúng là: ${q.answer}`; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "scramble") {
    const bank = $("#scramble-bank");
    const out = $("#scramble-out");
    const chosen = [];
    q.items.forEach(w => {
      const b = document.createElement("button");
      b.className = "btn btn-outline btn-primary btn-sm rounded-xl font-bold";
      b.textContent = w;
      b.onclick = () => {
        if (b.disabled) return;
        b.disabled = true;
        chosen.push(w);
        out.textContent = chosen.join(" ");
      };
      bank.appendChild(b);
    });
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      const got = normalizeKey(chosen.join(" "), true);
      const ok = got === normalizeKey(q.answer, true);
      if (ok) st.correct++;
      st.answers.push({ q, chosen: got, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="font-bold text-base mt-3 text-center text-success"; fb.textContent="🎉 Sắp xếp chuẩn rồi!"; }
      else { fb.className="font-bold text-base mt-3 text-center text-error"; fb.textContent=`❌ Câu đúng: ${q.answer}`; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "order") {
    const list = $("#order-list");
    const items = [...q.items];
    function draw() {
      list.innerHTML = "";
      items.forEach((s,i) => {
        const row = document.createElement("div");
        row.className = "flex items-center gap-2";
        row.innerHTML = `
          <button class="btn btn-square btn-sm btn-outline" data-up="${i}">⬆️</button>
          <button class="btn btn-square btn-sm btn-outline" data-down="${i}">⬇️</button>
          <div class="card bg-base-200 flex-1 p-2.5 text-sm font-semibold rounded-xl border border-base-300">${s}</div>`;
        list.appendChild(row);
      });
      $$("[data-up]").forEach(b => b.onclick = () => {
        const i = +b.dataset.up;
        if (i>0) { [items[i-1],items[i]]=[items[i],items[i-1]]; draw(); }
      });
      $$("[data-down]").forEach(b => b.onclick = () => {
        const i = +b.dataset.down;
        if (i<items.length-1) { [items[i],items[i+1]]=[items[i+1],items[i]]; draw(); }
      });
    }
    draw();
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      const ok = items.every((s,i) => s === q.correctOrder[i]);
      if (ok) st.correct++;
      st.answers.push({ q, chosen: items, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="font-bold text-base mt-3 text-center text-success"; fb.textContent="🎉 Thứ tự chính xác!"; }
      else { fb.className="font-bold text-base mt-3 text-center text-error"; fb.textContent="❌ Chưa đúng thứ tự rồi."; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "free") {
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      st.answers.push({ q, chosen: $("#free-in").value, correct: null });
      const fb = $("#fb");
      fb.className = "font-bold text-sm mt-3 text-info text-left bg-info/10 p-3 rounded-xl border border-info/20";
      fb.innerHTML = `🌟 Đáp án mẫu (Phụ huynh tham khảo):<br><span class="text-base text-base-content font-bold">${q.model}</span>`;
      $("#btn-next").classList.remove("hidden");
    };
  }

  $("#btn-next").onclick = () => { st.idx++; renderQuestion(); };
}

function showResult() {
  const st = testState;
  let html = header("Kết quả 🏆", () => viewUnitHome()) + `<div class="p-4 flex-1">`;
  html += `<div class="card bg-base-100 p-6 shadow-2xl text-center border-4 border-primary/30 rounded-3xl mb-4">
    <div class="text-6xl mb-2 bounce-icon">🏆</div>
    <div class="text-4xl font-bold text-primary mb-1">${st.correct} / ${st.questions.length}</div>
    <p class="text-lg font-bold text-secondary">Bé hoàn thành xuất sắc ${st.correct}/${st.questions.length} câu!</p>
  </div>`;
  const wrong = st.answers.filter(a => a.correct === false);
  if (wrong.length) {
    html += `<div class="divider font-bold text-error">Các câu cần ôn lại 🔄</div>`;
    wrong.forEach(a => {
      const label = a.q.audioWord || a.q.prompt || a.q.answer || "";
      html += `<div class="card bg-base-100 p-3 shadow border border-base-200 rounded-2xl mb-2 flex-row items-center justify-between">
        <span class="font-bold text-sm flex-1 truncate pr-2">${String(label).slice(0,55)}</span>
        <button class="btn btn-circle btn-sm btn-secondary" data-retry="${encodeURIComponent(JSON.stringify(a.q))}">🔊</button>
      </div>`;
    });
  }
  html += `<div class="flex flex-col gap-2 mt-6">`;
  html += `<button class="btn btn-primary rounded-2xl font-bold text-base shadow" id="btn-retry-wrong">🔄 Làm lại các câu sai</button>`;
  html += `<button class="btn btn-outline btn-primary rounded-2xl font-bold text-base" id="btn-retry-all">✨ Thử lại từ đầu</button>`;
  html += `<button class="btn btn-ghost rounded-2xl font-bold text-base" id="btn-back-unit">⬅️ Trở về bài học</button>`;
  html += `</div></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();
  $("#btn-back-unit").onclick = () => viewUnitHome();
  $("#btn-retry-all").onclick = () => startTest(st.type);
  $("#btn-retry-wrong").onclick = () => {
    if (!wrong.length) return startTest(st.type);
    testState = {
      type: st.type,
      questions: wrong.map(a => a.q),
      idx: 0, correct: 0, answers: [], answered: false
    };
    renderQuestion();
  };
  $$("[data-retry]").forEach(b => {
    b.onclick = () => {
      try {
        const q = JSON.parse(decodeURIComponent(b.dataset.retry));
        if (q.audioWord) playWord(q.audioWord);
        else if (q.audioText) playText(q.audioText);
        else if (q.prompt) playText(q.prompt);
      } catch(e) {}
    };
  });
}

/* ===== Check page ===== */
async function viewCheck() {
  let html = header("Kiểm tra dữ liệu ⚙️") + `<div class="p-4 flex-1">`;
  html += `<p class="text-xs text-base-content/60 mb-4 font-semibold">Trang quản trị nội bộ.</p>`;
  for (const meta of unitsMeta.units) {
    try {
      const data = await fetch(`${meta.data}?v=${meta.rev}`).then(r => r.json());
      const audio = await fetch(`${meta.audio}?v=${meta.rev}`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
      const needed = [];
      (data.words||[]).forEach(w => {
        const en = normalizeKey(w.en, true);
        needed.push("w:"+en, "s:"+en);
      });
      (data.passages||[]).forEach(p => {
        (p.text||"").split("\n").forEach(l => { if (l.trim()) needed.push("l:"+normalizeKey(l)); });
      });
      (data.dialogs||[]).forEach(d => {
        if (d.q) needed.push("l:"+normalizeKey(d.q));
        if (d.a) needed.push("l:"+normalizeKey(d.a));
      });
      (data.order||[]).forEach(s => { if (s.trim()) needed.push("l:"+normalizeKey(s)); });
      (data.cloze||[]).forEach(c => {
        const s = (c.s||"").replace("___", c.a||"");
        if (s.trim()) needed.push("l:"+normalizeKey(s));
      });
      (data.write||[]).forEach(w => { if (w.q) needed.push("l:"+normalizeKey(w.q)); });
      const uniq = [...new Set(needed)];
      const have = uniq.filter(k => audio[k] && audio[k].startsWith("data:audio"));
      const miss = uniq.filter(k => !audio[k] || !audio[k].startsWith("data:audio"));
      html += `<div class="card bg-base-100 p-4 shadow border border-base-200 rounded-2xl mb-3">
        <strong class="text-base">Unit ${data.id}: ${data.title}</strong>
        <div class="text-xs text-base-content/70">Từ: ${(data.words||[]).length} · Bài đọc: ${(data.passages||[]).length}</div>
        <div class="text-xs mt-2 font-bold">Cần: ${uniq.length} | Có: ${have.length} | Thiếu: <span class="text-error">${miss.length}</span></div>`;
      if (miss.length) {
        html += `<div class="mt-2 max-h-28 overflow-auto flex flex-wrap gap-1">`;
        miss.slice(0,30).forEach(k => html += `<span class="badge badge-ghost text-[10px]">${k.slice(0,45)}</span>`);
        if (miss.length > 30) html += `<span class="badge badge-ghost text-[10px]">+${miss.length-30}</span>`;
        html += `</div>`;
      } else {
        html += `<div class="badge badge-success mt-2 text-xs">✓ Đủ audio</div>`;
      }
      html += `</div>`;
    } catch(e) {
      html += `<div class="card bg-base-100 p-4">Unit ${meta.id}: lỗi – ${e.message}</div>`;
    }
  }
  html += `<button class="btn btn-primary w-full mt-4 rounded-2xl" id="btn-home">Về trang chủ</button></div>`;
  $("#view").innerHTML = html;
  $("#btn-home").onclick = () => { location.search = ""; viewAppHome(); };
}

// ---------- boot ----------
loadProgress();
(async () => {
  try {
    await loadUnits();
    if (location.search.includes("check=1")) {
      await viewCheck();
    } else {
      viewAppHome();
    }
  } catch(e) {
    $("#view").innerHTML = `<div class="p-6 text-center"><h2 class="text-xl font-bold text-error">Lỗi tải units.json 😢</h2><p class="text-sm mt-2">${e.message}</p>
      <p class="text-xs opacity-60 mt-2">Hãy chắc chắn file units.json nằm cùng thư mục với index.html</p></div>`;
  }
})();
</script>
</body>
</html>
