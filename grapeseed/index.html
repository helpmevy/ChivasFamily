<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2F6BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Grapeseed</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F7FF;
  --card: #FFFFFF;
  --primary: #2F6BFF;
  --primary-dark: #1E4FCC;
  --text: #16284A;
  --muted: #5A6B8C;
  --ok: #1B8F5A;
  --ok-bg: #E1F5EA;
  --bad: #C2410C;
  --bad-bg: #FDEBDD;
  --border: #D6E0F5;
  --shadow: 0 4px 14px rgba(47,107,255,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F172A;
    --card: #1E293B;
    --primary: #60A5FA;
    --primary-dark: #3B82F6;
    --text: #E2E8F0;
    --muted: #94A3B8;
    --ok: #34D399;
    --ok-bg: #064E3B;
    --bad: #F97316;
    --bad-bg: #7C2D12;
    --border: #334155;
    --shadow: 0 4px 14px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}
button:focus-visible, a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-bottom: 40px; }
.header {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg); padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 1rem;
  transition: transform .15s, background .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
.btn-lg { padding: 16px 22px; font-size: 1.1rem; width: 100%; }
.btn-listen {
  background: linear-gradient(135deg, #2F6BFF, #7C3AED);
  color: #fff; width: 100%; padding: 16px; border-radius: 16px; font-size: 1.15rem;
}
.card {
  background: var(--card); border-radius: 18px; padding: 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.muted { color: var(--muted); font-size: .9rem; }
.hidden { display: none !important; }
.screen { padding: 16px; }
.unit-list { display: flex; flex-direction: column; gap: 10px; }
.unit-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; border-radius: 16px; background: var(--card);
  border: 1.5px solid var(--border); text-align: left; width: 100%;
  box-shadow: var(--shadow);
}
.unit-btn .num {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.1rem; flex-shrink: 0;
}
.word-card {
  text-align: center; padding: 24px 16px;
}
.word-card .emoji { font-size: 64px; line-height: 1; margin-bottom: 8px; }
.word-card .en { font-size: 1.8rem; font-weight: 800; }
.word-card .ipa { color: var(--muted); font-size: 1rem; margin: 4px 0; }
.word-card .vi { font-size: 1.15rem; margin-top: 6px; }
.passage-line {
  padding: 12px 14px; border-radius: 12px; margin-bottom: 6px;
  background: var(--bg); border: 1px solid transparent; cursor: pointer;
}
.passage-line:hover, .passage-line.active { border-color: var(--primary); background: #E8F0FF; }
@media (prefers-color-scheme: dark) {
  .passage-line:hover, .passage-line.active { background: #1E3A5F; }
}
.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0 16px;
}
.progress-bar > div { height: 100%; background: var(--primary); transition: width .3s; }
.opt {
  display: block; width: 100%; text-align: left;
  padding: 14px 16px; border-radius: 14px; margin-bottom: 10px;
  background: var(--card); border: 2px solid var(--border); font-weight: 600;
}
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt-img {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 14px 8px; border-radius: 14px; border: 2px solid var(--border);
  background: var(--card); text-align: center;
}
.opt-img .emoji { font-size: 42px; }
.opt-img .en { font-weight: 700; font-size: .95rem; }
.opt-img .ipa { font-size: .75rem; color: var(--muted); }
.opt-img.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt-img.wrong { border-color: var(--bad); background: var(--bad-bg); }
.feedback { margin: 12px 0; font-weight: 700; min-height: 28px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.nav-tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 12px;
  -webkit-overflow-scrolling: touch;
}
.nav-tabs button {
  flex-shrink: 0; padding: 10px 14px; border-radius: 999px;
  background: var(--card); border: 1.5px solid var(--border); font-weight: 700; font-size: .9rem;
}
.nav-tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.status-voice {
  font-size: .8rem; padding: 6px 12px; border-radius: 8px;
  background: var(--ok-bg); color: var(--ok); margin-bottom: 12px;
}
.status-voice.warn { background: var(--bad-bg); color: var(--bad); }
.status-voice.loading { background: #FEF3C7; color: #B45309; }
.section-title { font-size: 1.05rem; font-weight: 800; margin: 16px 0 10px; }
.check-list { font-size: .85rem; }
.check-list li { margin-bottom: 4px; }
.chip {
  display: inline-block; padding: 4px 10px; border-radius: 999px;
  background: var(--border); font-size: .8rem; margin: 2px;
}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="view"></div>
</div>

<script>
const VERSION = "2026-11-11.1";
const NUM_Q = { listen: 10, vocab: 10, read: 10, write: 8 };

let unitsMeta = null;
let currentUnit = null;
let currentAudio = null;
let audioCache = {};
let progress = {};
let missingAudio = new Set();
let voiceStatus = "loading"; // loading | ready | fallback

// ---------- helpers ----------
function $(sel, el=document) { return el.querySelector(sel); }
function $$(sel, el=document) { return [...el.querySelectorAll(sel)]; }
function normalizeKey(text, forWord=false) {
  if (!text) return "";
  let t = text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
  t = t.replace(/\s+/g," ").trim();
  if (forWord) t = t.toLowerCase();
  return t;
}
function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem("gs_progress") || "{}"); }
  catch(e) { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem("gs_progress", JSON.stringify(progress)); } catch(e) {}
}
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pick(arr, n) {
  return shuffle(arr).slice(0, Math.min(n, arr.length));
}

// ---------- audio ----------
async function playKey(key) {
  const a = currentAudio && currentAudio[key];
  if (a && a.startsWith("data:audio")) {
    const audio = new Audio(a);
    try { await audio.play(); } catch(e) {}
    return true;
  }
  // fallback Web Speech
  missingAudio.add(key);
  if ("speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(key.replace(/^[wsl]:/, ""));
    u.lang = "en-US";
    u.rate = key.startsWith("s:") ? 0.7 : 1.0;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return false;
  }
  return false;
}
function playText(text, slow=false) {
  const nk = normalizeKey(text, false);
  const key = (slow ? "s:" : "l:") + (slow ? normalizeKey(text, true) : nk);
  // try exact first
  if (currentAudio) {
    const tryKeys = slow
      ? ["s:"+normalizeKey(text,true), "w:"+normalizeKey(text,true)]
      : ["l:"+nk, "w:"+normalizeKey(text,true)];
    for (const k of tryKeys) {
      if (currentAudio[k]) return playKey(k);
    }
  }
  return playKey(key);
}
function playWord(en, slow=false) {
  const k = (slow ? "s:" : "w:") + normalizeKey(en, true);
  return playKey(k);
}

// ---------- data loading ----------
async function loadUnits() {
  const r = await fetch(`units.json?v=${VERSION}`);
  unitsMeta = await r.json();
  return unitsMeta;
}
async function loadUnit(id) {
  const meta = unitsMeta.units.find(u => u.id === id);
  if (!meta) throw new Error("Unit not found");
  const [data, audio] = await Promise.all([
    fetch(`${meta.data}?v=${meta.rev}`).then(r => r.json()),
    fetch(`${meta.audio}?v=${meta.rev}`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]);
  currentUnit = data;
  currentAudio = audio || {};
  const keysNeeded = countNeededKeys(data);
  const have = Object.keys(currentAudio).filter(k => currentAudio[k] && currentAudio[k].startsWith("data:audio")).length;
  if (have === 0) {
    voiceStatus = "fallback";
  } else if (have < keysNeeded * 0.5) {
    voiceStatus = "fallback";
  } else {
    voiceStatus = "ready";
  }
  return data;
}
function countNeededKeys(data) {
  let n = 0;
  (data.words||[]).forEach(() => n += 2);
  (data.passages||[]).forEach(p => {
    (p.text||"").split("\n").forEach(l => { if (l.trim()) n++; });
  });
  (data.dialogs||[]).forEach(d => { if (d.q) n++; if (d.a) n++; });
  (data.order||[]).forEach(s => { if (s.trim()) n++; });
  (data.cloze||[]).forEach(c => { if (c.s) n++; });
  (data.write||[]).forEach(w => { if (w.q) n++; });
  return n;
}

// ---------- views ----------
function renderHeader(title, backFn) {
  return `
    <div class="header">
      ${backFn ? `<button class="btn btn-ghost" id="btn-back" style="padding:8px 12px">←</button>` : ""}
      <h1>${title}</h1>
    </div>`;
}

function viewHome() {
  const groups = [
    { title: "Unit 1 – 10", units: unitsMeta.units.filter(u => u.id >= 1 && u.id <= 10) },
    { title: "Unit 11 – 20", units: unitsMeta.units.filter(u => u.id >= 11 && u.id <= 20) },
    { title: "Unit 21 – 30", units: unitsMeta.units.filter(u => u.id >= 21 && u.id <= 30) }
  ].filter(g => g.units.length);
  let html = renderHeader("Grapeseed") + `<div class="screen">`;
  html += `<p class="muted" style="margin-bottom:16px">Chọn unit để học. Giọng AI Kokoro (af_heart).</p>`;
  groups.forEach(g => {
    html += `<div class="section-title">${g.title}</div><div class="unit-list">`;
    g.units.forEach(u => {
      html += `<button class="unit-btn" data-id="${u.id}">
        <span class="num">${u.id}</span>
        <span><strong>${u.title}</strong><br><span class="muted">Unit ${u.id}</span></span>
      </button>`;
    });
    html += `</div>`;
  });
  html += `<div style="margin-top:24px"><button class="btn btn-ghost btn-lg" id="btn-review">Ôn tổng hợp nhiều unit</button></div>`;
  html += `<div style="margin-top:12px"><button class="btn btn-ghost btn-lg" id="btn-check">Kiểm tra dữ liệu (?check=1)</button></div>`;
  html += `</div>`;
  $("#view").innerHTML = html;
  $$(".unit-btn").forEach(b => b.onclick = () => openUnit(+b.dataset.id));
  $("#btn-review").onclick = () => viewReviewSelect();
  $("#btn-check").onclick = () => { location.search = "?check=1"; };
}

async function openUnit(id) {
  $("#view").innerHTML = renderHeader("Đang tải...") + `<div class="screen"><p class="muted">Đang tải Unit ${id}...</p></div>`;
  try {
    await loadUnit(id);
    viewUnitHome();
  } catch(e) {
    $("#view").innerHTML = renderHeader("Lỗi") + `<div class="screen"><p>Không tải được unit. ${e.message}</p>
      <button class="btn btn-primary" onclick="viewHome()">Về trang chủ</button></div>`;
  }
}

function voiceBadge() {
  if (voiceStatus === "ready") return `<div class="status-voice">✓ Giọng AI đã sẵn sàng</div>`;
  if (voiceStatus === "loading") return `<div class="status-voice loading">Đang tải giọng AI...</div>`;
  return `<div class="status-voice warn">⚠ Chưa tải được giọng AI (file audio trống hoặc thiếu). Tạm dùng giọng điện thoại. Chạy make_audio.py để tạo audio/u1.json</div>`;
}

function viewUnitHome() {
  const u = currentUnit;
  let html = renderHeader(`Unit ${u.id}`, () => viewHome()) + `<div class="screen">`;
  html += voiceBadge();
  html += `<h2 style="font-size:1.3rem;margin-bottom:4px">${u.title}</h2>`;
  html += `<p class="muted" style="margin-bottom:18px">${(u.words||[]).length} từ · ${(u.passages||[]).length} bài đọc</p>`;
  html += `<div class="nav-tabs" id="tabs">
    <button class="active" data-v="words">Học từ</button>
    <button data-v="read">Đọc bài</button>
    <button data-v="listen">Nghe</button>
    <button data-v="vocab">Từ vựng</button>
    <button data-v="readtest">Đọc</button>
    <button data-v="write">Viết</button>
  </div>`;
  html += `<div id="panel"></div></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewHome();
  $$("#tabs button").forEach(b => {
    b.onclick = () => {
      $$("#tabs button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      showPanel(b.dataset.v);
    };
  });
  showPanel("words");
}

function showPanel(name) {
  const panel = $("#panel");
  if (name === "words") panel.innerHTML = panelWords();
  else if (name === "read") panel.innerHTML = panelRead();
  else if (name === "listen") startTest("listen");
  else if (name === "vocab") startTest("vocab");
  else if (name === "readtest") startTest("read");
  else if (name === "write") startTest("write");
}

function panelWords() {
  const words = currentUnit.words || [];
  let html = `<p class="muted" style="margin-bottom:12px">Bấm thẻ để nghe. Nút nghe chậm bên dưới.</p>`;
  html += `<div id="word-area"></div>`;
  html += `<div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-primary" id="w-prev" style="flex:1">← Trước</button>
    <button class="btn btn-listen" id="w-slow" style="flex:1.4">🐢 Nghe chậm</button>
    <button class="btn btn-primary" id="w-next" style="flex:1">Sau →</button>
  </div>`;
  setTimeout(() => {
    let idx = 0;
    const area = $("#word-area");
    function render() {
      const w = words[idx];
      if (!w) return;
      area.innerHTML = `<div class="card word-card">
        <div class="emoji">${w.emoji || "📖"}</div>
        <div class="en">${w.en}</div>
        <div class="ipa">${w.ipa || ""}</div>
        <div class="vi">${w.vi || ""}</div>
        <div class="muted" style="margin-top:8px">${idx+1} / ${words.length}</div>
      </div>`;
      area.onclick = () => playWord(w.en);
    }
    render();
    $("#w-prev").onclick = () => { idx = (idx - 1 + words.length) % words.length; render(); };
    $("#w-next").onclick = () => { idx = (idx + 1) % words.length; render(); };
    $("#w-slow").onclick = () => playWord(words[idx].en, true);
  }, 0);
  return html;
}

function panelRead() {
  const passages = currentUnit.passages || [];
  if (!passages.length) return `<p class="muted">Không có bài đọc.</p>`;
  let html = `<div class="nav-tabs" id="pass-tabs">`;
  passages.forEach((p,i) => {
    html += `<button class="${i===0?"active":""}" data-i="${i}">${p.title}</button>`;
  });
  html += `</div><div id="pass-content"></div>`;
  setTimeout(() => {
    function show(i) {
      const p = passages[i];
      const lines = (p.text || "").split("\n");
      let h = `<div class="card"><div class="muted" style="margin-bottom:8px">${p.type} · ${p.src || ""}</div>`;
      lines.forEach(line => {
        if (!line.trim()) h += `<div style="height:10px"></div>`;
        else h += `<div class="passage-line" data-line="${encodeURIComponent(line)}">${line}</div>`;
      });
      h += `<button class="btn btn-listen" id="play-all" style="margin-top:14px">🔊 Nghe cả bài</button></div>`;
      if (p.qs && p.qs.length) {
        h += `<div class="section-title">Câu hỏi hiểu bài</div>`;
        p.qs.forEach((q, qi) => {
          h += `<div class="card" style="margin-bottom:12px"><strong>${qi+1}. ${q.q}</strong><div style="margin-top:8px">`;
          const opts = shuffle(q.options.map((o,oi)=>({o,oi})));
          opts.forEach(({o,oi}) => {
            h += `<button class="opt qs-opt" data-qi="${qi}" data-oi="${oi}">${o}</button>`;
          });
          h += `</div><div class="feedback" id="fb-${qi}"></div></div>`;
        });
      }
      $("#pass-content").innerHTML = h;
      $$(".passage-line").forEach(el => {
        el.onclick = () => {
          $$(".passage-line").forEach(x => x.classList.remove("active"));
          el.classList.add("active");
          playText(decodeURIComponent(el.dataset.line));
        };
      });
      $("#play-all").onclick = async () => {
        for (const line of lines) {
          if (!line.trim()) continue;
          await playText(line);
          await new Promise(r => setTimeout(r, 900));
        }
      };
      $$(".qs-opt").forEach(btn => {
        btn.onclick = () => {
          const qi = +btn.dataset.qi;
          const oi = +btn.dataset.oi;
          const q = p.qs[qi];
          const fb = $(`#fb-${qi}`);
          $$(".qs-opt").filter(b => +b.dataset.qi === qi).forEach(b => {
            b.disabled = true;
            if (+b.dataset.oi === q.answer) b.classList.add("correct");
          });
          if (oi === q.answer) {
            btn.classList.add("correct");
            fb.className = "feedback ok";
            fb.textContent = "Đúng rồi! 👏";
          } else {
            btn.classList.add("wrong");
            fb.className = "feedback bad";
            fb.textContent = "Chưa đúng. Đáp án đúng đã tô xanh.";
          }
        };
      });
    }
    $$("#pass-tabs button").forEach(b => {
      b.onclick = () => {
        $$("#pass-tabs button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        show(+b.dataset.i);
      };
    });
    show(0);
  }, 0);
  return html;
}

// ---------- Tests ----------
let testState = null;

function startTest(type) {
  const u = currentUnit;
  const questions = buildQuestions(type, u);
  if (!questions.length) {
    $("#panel").innerHTML = `<p class="muted">Unit này chưa đủ dữ liệu cho bài ${type}.</p>`;
    return;
  }
  testState = {
    type, questions, idx: 0, correct: 0, answers: [], answered: false
  };
  renderQuestion();
}

function buildQuestions(type, u) {
  const qs = [];
  const words = (u.words || []).filter(w => w.en);
  const withEmoji = words.filter(w => w.emoji && w.emoji.length < 4);
  const byCat = {};
  words.forEach(w => {
    const c = w.cat || "thing";
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(w);
  });

  if (type === "listen") {
    // Part 1: hear word → choose picture
    pick(withEmoji, 5).forEach(w => {
      const distractors = pick((byCat[w.cat] || words).filter(x => x.en !== w.en && x.emoji), 3);
      const opts = shuffle([w, ...distractors]).slice(0,4);
      while (opts.length < 4) {
        const extra = pick(withEmoji.filter(x => !opts.find(o=>o.en===x.en)), 1)[0];
        if (extra) opts.push(extra); else break;
      }
      qs.push({
        part: "Phần 1 – Nghe từ, chọn hình",
        kind: "listen-pic",
        prompt: "Nghe và chọn hình đúng",
        audioWord: w.en,
        options: opts.map(o => ({ en: o.en, emoji: o.emoji, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === w.en)
      });
    });
    // Part 2: hear sentence → answer
    const lines = [];
    (u.passages||[]).forEach(p => (p.text||"").split("\n").forEach(l => { if (l.trim().length > 8) lines.push(l.trim()); }));
    (u.dialogs||[]).forEach(d => { if (d.q) lines.push(d.q); if (d.a) lines.push(d.a); });
    pick(lines, 3).forEach(line => {
      qs.push({
        part: "Phần 2 – Nghe câu, trả lời",
        kind: "listen-q",
        prompt: "Nghe câu rồi chọn ý đúng",
        audioText: line,
        options: shuffle([
          line,
          "I see a cat.",
          "The bird is sleeping.",
          "My father is small."
        ].filter((v,i,a)=>a.indexOf(v)===i)).slice(0,4),
        answer: 0 // will fix after shuffle? better rebuild
      });
      // fix answer after
      const last = qs[qs.length-1];
      last.options = shuffle([line, "I see a cat.", "The bird is sleeping.", "My father is small."]);
      last.answer = last.options.indexOf(line);
    });
    // Part 3: simple
    pick(withEmoji, 2).forEach(w => {
      qs.push({
        part: "Phần 3 – Nghe và chọn",
        kind: "listen-pic",
        prompt: "Nghe từ, chọn hình",
        audioWord: w.en,
        options: shuffle(pick(withEmoji, 4).map(o => ({en:o.en,emoji:o.emoji,ipa:o.ipa}))),
        answer: 0
      });
      const last = qs[qs.length-1];
      last.answer = last.options.findIndex(o => o.en === w.en);
      if (last.answer < 0) { last.options[0] = {en:w.en,emoji:w.emoji,ipa:w.ipa}; last.answer=0; }
    });
  }

  if (type === "vocab") {
    // picture → word
    pick(withEmoji, 4).forEach(w => {
      const distractors = pick(words.filter(x => x.en !== w.en), 3);
      const opts = shuffle([w, ...distractors]);
      qs.push({
        part: "Phần 1 – Nhìn hình chọn từ",
        kind: "pic-word",
        prompt: `${w.emoji || "📖"}  Đây là gì?`,
        options: opts.map(o => ({ en: o.en, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === w.en)
      });
    });
    // riddles
    pick(u.riddles || [], 3).forEach(r => {
      const ans = words.find(w => w.en === r.answer) || { en: r.answer, ipa: "" };
      const distractors = pick(words.filter(x => x.en !== r.answer), 3);
      const opts = shuffle([ans, ...distractors]);
      qs.push({
        part: "Phần 2 – Câu đố",
        kind: "riddle",
        prompt: r.clue,
        options: opts.map(o => ({ en: o.en, ipa: o.ipa || "" })),
        answer: opts.findIndex(o => o.en === r.answer)
      });
    });
    // odd one out
    const cats = Object.keys(byCat).filter(c => byCat[c].length >= 3);
    pick(cats, 3).forEach(c => {
      const same = pick(byCat[c], 3);
      const otherCat = pick(Object.keys(byCat).filter(x => x !== c), 1)[0];
      const odd = pick(byCat[otherCat] || words, 1)[0];
      if (!odd) return;
      const opts = shuffle([...same, odd]);
      qs.push({
        part: "Phần 3 – Chọn từ khác nhóm",
        kind: "odd",
        prompt: "Từ nào khác nhóm?",
        options: opts.map(o => ({ en: o.en, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === odd.en)
      });
    });
  }

  if (type === "read") {
    // passage qs
    (u.passages || []).forEach(p => {
      (p.qs || []).forEach(q => {
        const opts = shuffle(q.options.map((o,i)=>({o,i})));
        qs.push({
          part: "Đọc hiểu – " + p.title,
          kind: "mc",
          prompt: q.q,
          options: opts.map(x => x.o),
          answer: opts.findIndex(x => x.i === q.answer)
        });
      });
    });
    // dialogs match
    pick(u.dialogs || [], 3).forEach(d => {
      const others = pick((u.dialogs||[]).filter(x => x.a !== d.a), 3).map(x => x.a);
      const opts = shuffle([d.a, ...others]);
      qs.push({
        part: "Hội thoại",
        kind: "mc",
        prompt: d.q,
        options: opts,
        answer: opts.indexOf(d.a)
      });
    });
    // order (simple: pick 1 sentence, ask next? or skip if few)
    if ((u.order||[]).length >= 3) {
      const seq = u.order.slice(0,4);
      qs.push({
        part: "Sắp xếp",
        kind: "order",
        prompt: "Sắp xếp các câu theo đúng thứ tự câu chuyện",
        items: shuffle([...seq]),
        correctOrder: seq
      });
    }
  }

  if (type === "write") {
    // cloze
    pick(u.cloze || [], 3).forEach(c => {
      qs.push({
        part: "Điền từ",
        kind: "cloze",
        prompt: c.s.replace("___", "______"),
        answer: c.a,
        hint: c.a
      });
    });
    // order words (from order sentences)
    pick(u.order || [], 2).forEach(sent => {
      const wordsIn = sent.replace(/[.,!?]/g,"").split(/\s+/).filter(Boolean);
      qs.push({
        part: "Xếp từ thành câu",
        kind: "scramble",
        prompt: "Xếp các từ thành câu đúng",
        items: shuffle(wordsIn),
        answer: sent.replace(/[.,!?]/g,"").trim().toLowerCase()
      });
    });
    // free write
    pick(u.write || [], 3).forEach(w => {
      qs.push({
        part: "Viết câu",
        kind: "free",
        prompt: w.q,
        model: w.model
      });
    });
  }

  return qs.slice(0, NUM_Q[type] || 10);
}

function renderQuestion() {
  const st = testState;
  if (!st) return;
  if (st.idx >= st.questions.length) {
    return showResult();
  }
  const q = st.questions[st.idx];
  st.answered = false;
  let html = renderHeader(`Unit ${currentUnit.id} · ${st.type}`, () => viewUnitHome());
  html += `<div class="screen">`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center">
    <button class="btn btn-ghost" id="btn-exit" style="padding:8px 12px">Thoát</button>
    <span class="muted">Câu ${st.idx+1}/${st.questions.length}</span>
  </div>`;
  html += `<div class="progress-bar"><div style="width:${(st.idx/st.questions.length)*100}%"></div></div>`;
  html += `<div class="muted" style="margin-bottom:8px">${q.part || ""}</div>`;
  html += `<div class="card" id="qcard">`;
  html += `<div style="font-weight:800;font-size:1.15rem;margin-bottom:12px">${q.prompt}</div>`;

  if (q.kind === "listen-pic" || q.kind === "listen-q") {
    html += `<button class="btn btn-listen" id="btn-listen">🔊 Nghe</button>`;
    html += `<p class="muted" style="margin:8px 0 12px;font-size:.85rem">Bé cần bấm nghe ít nhất 1 lần mới chọn đáp án.</p>`;
  }

  if (q.kind === "listen-pic" || q.kind === "pic-word") {
    html += `<div class="grid2" id="opts">`;
    (q.options||[]).forEach((o,i) => {
      if (q.kind === "listen-pic") {
        html += `<button class="opt-img" data-i="${i}" disabled>
          <span class="emoji">${o.emoji||"❓"}</span>
          <span class="en">${o.en}</span>
          <span class="ipa">${o.ipa||""}</span>
        </button>`;
      } else {
        html += `<button class="opt" data-i="${i}">${o.en}<br><span class="muted" style="font-weight:400">${o.ipa||""}</span></button>`;
      }
    });
    html += `</div>`;
  } else if (q.kind === "riddle" || q.kind === "odd" || q.kind === "mc" || q.kind === "listen-q") {
    html += `<div id="opts">`;
    (q.options||[]).forEach((o,i) => {
      const label = typeof o === "string" ? o : (o.en + (o.ipa ? `<br><span class="muted" style="font-weight:400">${o.ipa}</span>` : ""));
      html += `<button class="opt" data-i="${i}" ${q.kind==="listen-q"?"disabled":""}>${label}</button>`;
    });
    html += `</div>`;
  } else if (q.kind === "cloze") {
    html += `<input id="cloze-in" type="text" style="width:100%;padding:14px;border-radius:12px;border:2px solid var(--border);font-size:1.1rem;font-family:inherit" placeholder="Viết từ còn thiếu...">`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans" style="margin-top:12px">Kiểm tra</button>`;
  } else if (q.kind === "scramble") {
    html += `<div id="scramble-bank" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>`;
    html += `<div id="scramble-out" style="min-height:48px;padding:12px;border:2px dashed var(--border);border-radius:12px;margin-bottom:12px"></div>`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans">Kiểm tra</button>`;
  } else if (q.kind === "order") {
    html += `<div id="order-list"></div>`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans" style="margin-top:12px">Kiểm tra thứ tự</button>`;
  } else if (q.kind === "free") {
    html += `<textarea id="free-in" rows="3" style="width:100%;padding:14px;border-radius:12px;border:2px solid var(--border);font-size:1.05rem;font-family:inherit" placeholder="Viết câu trả lời..."></textarea>`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans" style="margin-top:12px">Xem đáp án mẫu</button>`;
  }

  html += `<div class="feedback" id="fb"></div>`;
  html += `<button class="btn btn-primary btn-lg hidden" id="btn-next">Câu tiếp →</button>`;
  html += `</div></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();
  $("#btn-exit").onclick = () => viewUnitHome();

  let listened = q.kind !== "listen-pic" && q.kind !== "listen-q";

  if (q.kind === "listen-pic" || q.kind === "listen-q") {
    $("#btn-listen").onclick = async () => {
      if (q.audioWord) await playWord(q.audioWord);
      else if (q.audioText) await playText(q.audioText);
      listened = true;
      $$("#opts [data-i]").forEach(b => b.disabled = false);
      $("#btn-listen").textContent = "🔊 Nghe lại";
    };
  }

  function markAnswer(chosen) {
    if (st.answered) return;
    st.answered = true;
    const correct = chosen === q.answer;
    if (correct) st.correct++;
    st.answers.push({ q, chosen, correct });
    const opts = $$("#opts [data-i]");
    opts.forEach(b => {
      b.disabled = true;
      const i = +b.dataset.i;
      if (i === q.answer) b.classList.add("correct");
      if (i === chosen && !correct) b.classList.add("wrong");
    });
    const fb = $("#fb");
    if (correct) {
      fb.className = "feedback ok";
      fb.textContent = "Đúng rồi! 👏";
    } else {
      fb.className = "feedback bad";
      fb.textContent = "Chưa đúng. Đáp án đúng đã tô xanh.";
    }
    $("#btn-next").classList.remove("hidden");
  }

  $$("#opts [data-i]").forEach(b => {
    b.onclick = () => {
      if (!listened) return;
      markAnswer(+b.dataset.i);
    };
  });

  if (q.kind === "cloze") {
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      const val = normalizeKey($("#cloze-in").value, true);
      const ans = normalizeKey(q.answer, true);
      st.answered = true;
      const ok = val === ans;
      if (ok) st.correct++;
      st.answers.push({ q, chosen: val, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="feedback ok"; fb.textContent="Đúng rồi! 👏"; }
      else { fb.className="feedback bad"; fb.textContent=`Chưa đúng. Đáp án: ${q.answer}`; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "scramble") {
    const bank = $("#scramble-bank");
    const out = $("#scramble-out");
    const chosen = [];
    q.items.forEach((w,i) => {
      const b = document.createElement("button");
      b.className = "btn btn-ghost";
      b.style.padding = "8px 12px";
      b.textContent = w;
      b.onclick = () => {
        if (b.disabled) return;
        b.disabled = true;
        chosen.push(w);
        out.textContent = chosen.join(" ");
      };
      bank.appendChild(b);
    });
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      const got = normalizeKey(chosen.join(" "), true);
      const ok = got === normalizeKey(q.answer, true);
      if (ok) st.correct++;
      st.answers.push({ q, chosen: got, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="feedback ok"; fb.textContent="Đúng rồi! 👏"; }
      else { fb.className="feedback bad"; fb.textContent=`Chưa đúng. Câu đúng: ${q.answer}`; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "order") {
    const list = $("#order-list");
    const items = [...q.items];
    function draw() {
      list.innerHTML = "";
      items.forEach((s,i) => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:8px";
        row.innerHTML = `<button class="btn btn-ghost" data-up="${i}" style="padding:6px 10px">↑</button>
          <button class="btn btn-ghost" data-down="${i}" style="padding:6px 10px">↓</button>
          <span class="card" style="flex:1;padding:10px">${s}</span>`;
        list.appendChild(row);
      });
      $$("[data-up]").forEach(b => b.onclick = () => {
        const i = +b.dataset.up;
        if (i>0) { [items[i-1],items[i]]=[items[i],items[i-1]]; draw(); }
      });
      $$("[data-down]").forEach(b => b.onclick = () => {
        const i = +b.dataset.down;
        if (i<items.length-1) { [items[i],items[i+1]]=[items[i+1],items[i]]; draw(); }
      });
    }
    draw();
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      const ok = items.every((s,i) => s === q.correctOrder[i]);
      if (ok) st.correct++;
      st.answers.push({ q, chosen: items, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="feedback ok"; fb.textContent="Đúng rồi! 👏"; }
      else { fb.className="feedback bad"; fb.textContent="Chưa đúng thứ tự."; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "free") {
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      st.answers.push({ q, chosen: $("#free-in").value, correct: null });
      const fb = $("#fb");
      fb.className = "feedback ok";
      fb.innerHTML = `Đáp án mẫu (bố mẹ đối chiếu):<br><strong>${q.model}</strong>`;
      $("#btn-next").classList.remove("hidden");
    };
  }

  $("#btn-next").onclick = () => {
    st.idx++;
    renderQuestion();
  };
}

function showResult() {
  const st = testState;
  let html = renderHeader("Kết quả", () => viewUnitHome()) + `<div class="screen">`;
  html += `<div class="card" style="text-align:center;margin-bottom:16px">
    <div style="font-size:2rem;font-weight:800">${st.correct}/${st.questions.length}</div>
    <p class="muted">Con đúng ${st.correct}/${st.questions.length} câu</p>
  </div>`;
  const wrong = st.answers.filter(a => a.correct === false);
  if (wrong.length) {
    html += `<div class="section-title">Mục cần ôn</div>`;
    wrong.forEach(a => {
      const label = a.q.audioWord || a.q.prompt || a.q.answer || "";
      html += `<div class="card" style="margin-bottom:8px;display:flex;align-items:center;gap:10px">
        <span style="flex:1">${label.slice(0,60)}</span>
        <button class="btn btn-ghost" data-retry="${encodeURIComponent(JSON.stringify(a.q))}" style="padding:8px 12px">🔊</button>
      </div>`;
    });
  }
  html += `<button class="btn btn-primary btn-lg" id="btn-retry-wrong" style="margin-top:12px">Làm lại các câu sai</button>`;
  html += `<button class="btn btn-ghost btn-lg" id="btn-retry-all" style="margin-top:10px">Làm lại từ đầu</button>`;
  html += `<button class="btn btn-ghost btn-lg" id="btn-back-unit" style="margin-top:10px">Về unit</button>`;
  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();
  $("#btn-back-unit").onclick = () => viewUnitHome();
  $("#btn-retry-all").onclick = () => startTest(st.type);
  $("#btn-retry-wrong").onclick = () => {
    if (!wrong.length) return startTest(st.type);
    testState = {
      type: st.type,
      questions: wrong.map(a => a.q),
      idx: 0, correct: 0, answers: [], answered: false
    };
    renderQuestion();
  };
  $$("[data-retry]").forEach(b => {
    b.onclick = () => {
      try {
        const q = JSON.parse(decodeURIComponent(b.dataset.retry));
        if (q.audioWord) playWord(q.audioWord);
        else if (q.audioText) playText(q.audioText);
        else if (q.prompt) playText(q.prompt);
      } catch(e) {}
    };
  });
}

function viewReviewSelect() {
  let html = renderHeader("Ôn tổng hợp", () => viewHome()) + `<div class="screen">`;
  html += `<p class="muted" style="margin-bottom:12px">Chọn các unit muốn ôn (hiện chỉ có Unit 1).</p>`;
  unitsMeta.units.forEach(u => {
    html += `<label style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--border)">
      <input type="checkbox" value="${u.id}" checked> Unit ${u.id}: ${u.title}
    </label>`;
  });
  html += `<button class="btn btn-primary btn-lg" id="btn-start-review" style="margin-top:16px">Bắt đầu ôn</button></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewHome();
  $("#btn-start-review").onclick = async () => {
    const ids = $$("input:checked").map(c => +c.value);
    if (!ids.length) return;
    await loadUnit(ids[0]);
    startTest("vocab");
  };
}

async function viewCheck() {
  let html = renderHeader("Kiểm tra dữ liệu") + `<div class="screen">`;
  html += `<p class="muted">Trang này giúp bố mẹ kiểm tra unit thiếu audio hay không.</p>`;
  for (const meta of unitsMeta.units) {
    try {
      const data = await fetch(`${meta.data}?v=${meta.rev}`).then(r => r.json());
      const audio = await fetch(`${meta.audio}?v=${meta.rev}`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
      const needed = [];
      (data.words||[]).forEach(w => {
        const en = normalizeKey(w.en, true);
        needed.push("w:"+en, "s:"+en);
      });
      (data.passages||[]).forEach(p => {
        (p.text||"").split("\n").forEach(l => {
          if (l.trim()) needed.push("l:"+normalizeKey(l));
        });
      });
      (data.dialogs||[]).forEach(d => {
        if (d.q) needed.push("l:"+normalizeKey(d.q));
        if (d.a) needed.push("l:"+normalizeKey(d.a));
      });
      (data.order||[]).forEach(s => { if (s.trim()) needed.push("l:"+normalizeKey(s)); });
      (data.cloze||[]).forEach(c => {
        const s = (c.s||"").replace("___", c.a||"");
        if (s.trim()) needed.push("l:"+normalizeKey(s));
      });
      (data.write||[]).forEach(w => { if (w.q) needed.push("l:"+normalizeKey(w.q)); });
      const uniq = [...new Set(needed)];
      const have = uniq.filter(k => audio[k] && audio[k].startsWith("data:audio"));
      const miss = uniq.filter(k => !audio[k] || !audio[k].startsWith("data:audio"));
      html += `<div class="card" style="margin-bottom:14px">
        <strong>Unit ${data.id}: ${data.title}</strong>
        <div class="muted">Từ: ${(data.words||[]).length} · Bài đọc: ${(data.passages||[]).length}</div>
        <div style="margin-top:8px">Audio cần: <strong>${uniq.length}</strong> · Có: <strong>${have.length}</strong> · Thiếu: <strong style="color:var(--bad)">${miss.length}</strong></div>`;
      if (miss.length) {
        html += `<div class="check-list" style="margin-top:8px;max-height:120px;overflow:auto"><ul>`;
        miss.slice(0,40).forEach(k => html += `<li class="chip">${k.slice(0,50)}</li>`);
        if (miss.length > 40) html += `<li>... và ${miss.length-40} khóa nữa</li>`;
        html += `</ul></div>`;
      } else {
        html += `<div class="status-voice" style="margin-top:8px">✓ Đủ audio</div>`;
      }
      html += `</div>`;
    } catch(e) {
      html += `<div class="card">Unit ${meta.id}: lỗi tải – ${e.message}</div>`;
    }
  }
  html += `<button class="btn btn-primary btn-lg" onclick="location.search=''">Về trang chủ</button></div>`;
  $("#view").innerHTML = html;
}

// ---------- boot ----------
loadProgress();
(async () => {
  try {
    await loadUnits();
    if (location.search.includes("check=1")) {
      await viewCheck();
    } else {
      viewHome();
    }
  } catch(e) {
    $("#view").innerHTML = `<div class="screen"><h2>Lỗi tải units.json</h2><p>${e.message}</p>
      <p class="muted">Hãy chắc chắn file units.json nằm cùng thư mục với index.html</p></div>`;
  }
})();
