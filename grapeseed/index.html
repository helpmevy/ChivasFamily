<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2F6BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Grapeseed</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F7FF;
  --card: #FFFFFF;
  --primary: #2F6BFF;
  --primary-dark: #1E4FCC;
  --primary-soft: #E8F0FF;
  --text: #16284A;
  --muted: #5A6B8C;
  --ok: #1B8F5A;
  --ok-bg: #E1F5EA;
  --bad: #C2410C;
  --bad-bg: #FDEBDD;
  --border: #D6E0F5;
  --shadow: 0 6px 20px rgba(47,107,255,.10);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F172A;
    --card: #1E293B;
    --primary: #60A5FA;
    --primary-dark: #3B82F6;
    --primary-soft: #1E3A5F;
    --text: #E2E8F0;
    --muted: #94A3B8;
    --ok: #34D399;
    --ok-bg: #064E3B;
    --bad: #F97316;
    --bad-bg: #7C2D12;
    --border: #334155;
    --shadow: 0 6px 20px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 1.2rem;
  font-weight: 800;
  flex: 1;
  line-height: 1.25;
}
.btn-back {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: var(--card);
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem;
  flex-shrink: 0;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1rem;
  line-height: 1.2;
  transition: transform .12s, background .15s, box-shadow .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 12px rgba(47,107,255,.25);
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost {
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--border);
}
.btn-lg {
  width: 100%;
  padding: 16px 20px;
  font-size: 1.05rem;
  border-radius: 16px;
}
.btn-listen {
  background: linear-gradient(135deg, #2F6BFF 0%, #7C3AED 100%);
  color: #fff;
  width: 100%;
  padding: 16px 20px;
  border-radius: 16px;
  font-size: 1.1rem;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(124,58,237,.25);
}

/* Cards & layout */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.screen { padding: 16px; flex: 1; }
.muted { color: var(--muted); font-size: .9rem; }
.hidden { display: none !important; }

/* Program home */
.program-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 8px;
}
.program-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 18px;
  border-radius: 20px;
  background: var(--card);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  text-align: left;
  width: 100%;
  transition: transform .12s, border-color .15s;
}
.program-card:active { transform: scale(.98); }
.program-card .icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, #2F6BFF, #7C3AED);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem;
  flex-shrink: 0;
  color: #fff;
}
.program-card .info { flex: 1; min-width: 0; }
.program-card .name { font-size: 1.2rem; font-weight: 800; }
.program-card .desc { font-size: .88rem; color: var(--muted); margin-top: 2px; }

/* Unit list */
.unit-list { display: flex; flex-direction: column; gap: 10px; }
.unit-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--card);
  border: 1.5px solid var(--border);
  text-align: left;
  width: 100%;
  box-shadow: var(--shadow);
}
.unit-btn .num {
  width: 46px; height: 46px;
  border-radius: 14px;
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1.15rem;
  flex-shrink: 0;
}
.unit-btn .title { font-weight: 700; font-size: 1.05rem; }
.unit-btn .sub { font-size: .85rem; color: var(--muted); margin-top: 2px; }

/* Activity menu (unit home) – no horizontal scroll */
.activity-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.activity-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 20px 12px;
  border-radius: 18px;
  background: var(--card);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  min-height: 110px;
  text-align: center;
  transition: transform .12s, border-color .15s;
}
.activity-btn:active { transform: scale(.97); }
.activity-btn .ico {
  font-size: 1.8rem;
  line-height: 1;
}
.activity-btn .label {
  font-weight: 700;
  font-size: 1rem;
  line-height: 1.25;
}
.activity-btn .hint {
  font-size: .78rem;
  color: var(--muted);
  font-weight: 600;
}

/* Word card */
.word-card { text-align: center; padding: 28px 16px; }
.word-card .emoji { font-size: 68px; line-height: 1; margin-bottom: 10px; }
.word-card .en { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
.word-card .ipa { color: var(--muted); font-size: 1.05rem; margin: 6px 0; }
.word-card .vi { font-size: 1.2rem; margin-top: 4px; font-weight: 600; }

/* Passage */
.passage-line {
  padding: 13px 14px;
  border-radius: 12px;
  margin-bottom: 6px;
  background: var(--bg);
  border: 1.5px solid transparent;
  cursor: pointer;
  font-size: 1.02rem;
}
.passage-line:hover, .passage-line.active {
  border-color: var(--primary);
  background: var(--primary-soft);
}

/* Progress & options */
.progress-bar {
  height: 7px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin: 10px 0 16px;
}
.progress-bar > div {
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
  transition: width .3s;
}
.opt {
  display: flex;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 15px 16px;
  border-radius: 14px;
  margin-bottom: 10px;
  background: var(--card);
  border: 2px solid var(--border);
  font-weight: 600;
  font-size: 1.02rem;
  line-height: 1.3;
}
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt-img {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 16px 10px;
  border-radius: 16px;
  border: 2px solid var(--border);
  background: var(--card);
  text-align: center;
  min-height: 120px;
}
.opt-img .emoji { font-size: 44px; line-height: 1; }
.opt-img .en { font-weight: 700; font-size: .95rem; }
.opt-img .ipa { font-size: .75rem; color: var(--muted); }
.opt-img.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt-img.wrong { border-color: var(--bad); background: var(--bad-bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.feedback {
  margin: 14px 0 6px;
  font-weight: 700;
  min-height: 26px;
  font-size: 1.05rem;
}
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }

.status-voice {
  font-size: .82rem;
  padding: 8px 14px;
  border-radius: 10px;
  background: var(--ok-bg);
  color: var(--ok);
  margin-bottom: 14px;
  font-weight: 600;
}
.status-voice.warn { background: var(--bad-bg); color: var(--bad); }
.status-voice.loading { background: #FEF3C7; color: #B45309; }

.section-title {
  font-size: 1.05rem;
  font-weight: 800;
  margin: 18px 0 10px;
}

/* Passage tabs – compact, wrap if needed */
.pass-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.pass-tabs button {
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--card);
  border: 1.5px solid var(--border);
  font-weight: 700;
  font-size: .88rem;
}
.pass-tabs button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.chip {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--border);
  font-size: .8rem;
  margin: 2px;
}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="view"></div>
</div>

<script>
const VERSION = "2026-11-11.2";
const NUM_Q = { listen: 10, vocab: 10, read: 10, write: 8 };

let unitsMeta = null;
let currentUnit = null;
let currentAudio = null;
let progress = {};
let missingAudio = new Set();
let voiceStatus = "loading";

// ---------- helpers ----------
function $(sel, el=document) { return el.querySelector(sel); }
function $$(sel, el=document) { return [...el.querySelectorAll(sel)]; }
function normalizeKey(text, forWord=false) {
  if (!text) return "";
  let t = text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
  t = t.replace(/\s+/g," ").trim();
  if (forWord) t = t.toLowerCase();
  return t;
}
function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem("gs_progress") || "{}"); }
  catch(e) { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem("gs_progress", JSON.stringify(progress)); } catch(e) {}
}
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pick(arr, n) {
  return shuffle(arr).slice(0, Math.min(n, arr.length));
}

// ---------- audio ----------
async function playKey(key) {
  const a = currentAudio && currentAudio[key];
  if (a && a.startsWith("data:audio")) {
    const audio = new Audio(a);
    try { await audio.play(); } catch(e) {}
    return true;
  }
  missingAudio.add(key);
  if ("speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(key.replace(/^[wsl]:/, ""));
    u.lang = "en-US";
    u.rate = key.startsWith("s:") ? 0.7 : 1.0;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return false;
  }
  return false;
}
function playText(text, slow=false) {
  const nk = normalizeKey(text, false);
  if (currentAudio) {
    const tryKeys = slow
      ? ["s:"+normalizeKey(text,true), "w:"+normalizeKey(text,true)]
      : ["l:"+nk, "w:"+normalizeKey(text,true)];
    for (const k of tryKeys) {
      if (currentAudio[k]) return playKey(k);
    }
  }
  return playKey((slow ? "s:" : "l:") + (slow ? normalizeKey(text,true) : nk));
}
function playWord(en, slow=false) {
  return playKey((slow ? "s:" : "w:") + normalizeKey(en, true));
}

// ---------- data ----------
async function loadUnits() {
  const r = await fetch(`units.json?v=${VERSION}`);
  unitsMeta = await r.json();
  return unitsMeta;
}
async function loadUnit(id) {
  const meta = unitsMeta.units.find(u => u.id === id);
  if (!meta) throw new Error("Unit not found");
  const [data, audio] = await Promise.all([
    fetch(`${meta.data}?v=${meta.rev}`).then(r => r.json()),
    fetch(`${meta.audio}?v=${meta.rev}`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]);
  currentUnit = data;
  currentAudio = audio || {};
  const keysNeeded = countNeededKeys(data);
  const have = Object.keys(currentAudio).filter(k => currentAudio[k] && currentAudio[k].startsWith("data:audio")).length;
  voiceStatus = (have === 0 || have < keysNeeded * 0.4) ? "fallback" : "ready";
  return data;
}
function countNeededKeys(data) {
  let n = 0;
  (data.words||[]).forEach(() => n += 2);
  (data.passages||[]).forEach(p => {
    (p.text||"").split("\n").forEach(l => { if (l.trim()) n++; });
  });
  (data.dialogs||[]).forEach(d => { if (d.q) n++; if (d.a) n++; });
  (data.order||[]).forEach(s => { if (s.trim()) n++; });
  (data.cloze||[]).forEach(c => { if (c.s) n++; });
  (data.write||[]).forEach(w => { if (w.q) n++; });
  return n;
}

// ---------- views ----------
function header(title, backFn) {
  return `
    <div class="header">
      ${backFn ? `<button class="btn-back" id="btn-back" aria-label="Quay lại">←</button>` : `<div style="width:42px"></div>`}
      <h1>${title}</h1>
    </div>`;
}

function voiceBadge() {
  if (voiceStatus === "ready") return `<div class="status-voice">✓ Giọng AI đã sẵn sàng</div>`;
  if (voiceStatus === "loading") return `<div class="status-voice loading">Đang tải giọng AI...</div>`;
  return `<div class="status-voice warn">⚠ Chưa có file audio. Tạm dùng giọng điện thoại. Chạy make_audio.py để tạo giọng Kokoro.</div>`;
}

/* ===== 1. APP HOME – danh sách chương trình ===== */
function viewAppHome() {
  let html = header("Học tiếng Anh") + `<div class="screen">`;
  html += `<p class="muted" style="margin-bottom:18px">Chọn chương trình học</p>`;
  html += `<div class="program-grid">`;
  html += `
    <button class="program-card" id="go-grapeseed">
      <div class="icon">🍇</div>
      <div class="info">
        <div class="name">GrapeSEED</div>
        <div class="desc">Unit 1 · Động vật, gia đình & bạn bè</div>
      </div>
    </button>
  `;
  // Placeholder cho tương lai
  html += `
    <button class="program-card" style="opacity:.55" disabled>
      <div class="icon" style="background:#94A3B8">📚</div>
      <div class="info">
        <div class="name">RAZ Kids</div>
        <div class="desc">Sắp có</div>
      </div>
    </button>
  `;
  html += `</div></div>`;
  $("#view").innerHTML = html;
  $("#go-grapeseed").onclick = () => viewGrapeseedHome();
}

/* ===== 2. GRAPESEED HOME – danh sách unit ===== */
function viewGrapeseedHome() {
  const groups = [
    { title: "Unit 1 – 10", units: unitsMeta.units.filter(u => u.id >= 1 && u.id <= 10) },
    { title: "Unit 11 – 20", units: unitsMeta.units.filter(u => u.id >= 11 && u.id <= 20) },
    { title: "Unit 21 – 30", units: unitsMeta.units.filter(u => u.id >= 21 && u.id <= 30) }
  ].filter(g => g.units.length);

  let html = header("GrapeSEED", () => viewAppHome()) + `<div class="screen">`;
  html += `<p class="muted" style="margin-bottom:16px">Chọn unit để học</p>`;
  groups.forEach(g => {
    html += `<div class="section-title" style="margin-top:4px">${g.title}</div>`;
    html += `<div class="unit-list">`;
    g.units.forEach(u => {
      html += `
        <button class="unit-btn" data-id="${u.id}">
          <span class="num">${u.id}</span>
          <span>
            <div class="title">${u.title}</div>
            <div class="sub">Unit ${u.id}</div>
          </span>
        </button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewAppHome();
  $$(".unit-btn").forEach(b => b.onclick = () => openUnit(+b.dataset.id));
}

/* ===== 3. UNIT HOME – menu hoạt động (lưới 2 cột, không cuộn ngang) ===== */
async function openUnit(id) {
  $("#view").innerHTML = header("Đang tải...") + `<div class="screen"><p class="muted">Đang tải Unit ${id}...</p></div>`;
  try {
    await loadUnit(id);
    viewUnitHome();
  } catch(e) {
    $("#view").innerHTML = header("Lỗi") + `<div class="screen"><p>Không tải được unit. ${e.message}</p>
      <button class="btn btn-primary btn-lg" style="margin-top:16px" id="btn-back-err">Về danh sách</button></div>`;
    $("#btn-back-err").onclick = () => viewGrapeseedHome();
  }
}

function viewUnitHome() {
  const u = currentUnit;
  let html = header(`Unit ${u.id}`, () => viewGrapeseedHome()) + `<div class="screen">`;
  html += voiceBadge();
  html += `<h2 style="font-size:1.35rem;font-weight:800;margin-bottom:2px">${u.title}</h2>`;
  html += `<p class="muted" style="margin-bottom:18px">${(u.words||[]).length} từ · ${(u.passages||[]).length} bài đọc</p>`;

  html += `<div class="activity-grid">
    <button class="activity-btn" data-v="words">
      <span class="ico">🃏</span>
      <span class="label">Học từ</span>
      <span class="hint">Thẻ từ + nghe</span>
    </button>
    <button class="activity-btn" data-v="read">
      <span class="ico">📖</span>
      <span class="label">Đọc bài</span>
      <span class="hint">Story & nghe</span>
    </button>
    <button class="activity-btn" data-v="listen">
      <span class="ico">👂</span>
      <span class="label">Nghe</span>
      <span class="hint">Kiểm tra nghe</span>
    </button>
    <button class="activity-btn" data-v="vocab">
      <span class="ico">🔤</span>
      <span class="label">Từ vựng</span>
      <span class="hint">Hình · đố · nhóm</span>
    </button>
    <button class="activity-btn" data-v="readtest">
      <span class="ico">📝</span>
      <span class="label">Đọc</span>
      <span class="hint">Hiểu bài · hội thoại</span>
    </button>
    <button class="activity-btn" data-v="write">
      <span class="ico">✍️</span>
      <span class="label">Viết</span>
      <span class="hint">Điền · xếp · viết</span>
    </button>
  </div>`;

  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewGrapeseedHome();
  $$(".activity-btn").forEach(b => {
    b.onclick = () => showActivity(b.dataset.v);
  });
}

function showActivity(name) {
  if (name === "words") viewWords();
  else if (name === "read") viewRead();
  else if (name === "listen") startTest("listen");
  else if (name === "vocab") startTest("vocab");
  else if (name === "readtest") startTest("read");
  else if (name === "write") startTest("write");
}

/* ===== Học từ ===== */
function viewWords() {
  const words = currentUnit.words || [];
  let html = header(`Unit ${currentUnit.id} · Học từ`, () => viewUnitHome()) + `<div class="screen">`;
  html += `<div id="word-area"></div>`;
  html += `<div style="display:flex;gap:10px;margin-top:18px">
    <button class="btn btn-ghost" id="w-prev" style="flex:1;padding:14px">← Trước</button>
    <button class="btn btn-listen" id="w-slow" style="flex:1.5">🐢 Nghe chậm</button>
    <button class="btn btn-ghost" id="w-next" style="flex:1;padding:14px">Sau →</button>
  </div>`;
  html += `<p class="muted" style="text-align:center;margin-top:12px">Bấm vào thẻ để nghe tốc độ thường</p>`;
  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();

  let idx = 0;
  const area = $("#word-area");
  function render() {
    const w = words[idx];
    if (!w) return;
    area.innerHTML = `<div class="card word-card">
      <div class="emoji">${w.emoji || "📖"}</div>
      <div class="en">${w.en}</div>
      <div class="ipa">${w.ipa || ""}</div>
      <div class="vi">${w.vi || ""}</div>
      <div class="muted" style="margin-top:12px">${idx+1} / ${words.length}</div>
    </div>`;
    area.onclick = () => playWord(w.en);
  }
  render();
  $("#w-prev").onclick = () => { idx = (idx - 1 + words.length) % words.length; render(); };
  $("#w-next").onclick = () => { idx = (idx + 1) % words.length; render(); };
  $("#w-slow").onclick = () => playWord(words[idx].en, true);
}

/* ===== Đọc bài ===== */
function viewRead() {
  const passages = currentUnit.passages || [];
  if (!passages.length) {
    $("#view").innerHTML = header("Đọc bài", () => viewUnitHome()) +
      `<div class="screen"><p class="muted">Không có bài đọc.</p></div>`;
    $("#btn-back").onclick = () => viewUnitHome();
    return;
  }
  let html = header(`Unit ${currentUnit.id} · Đọc bài`, () => viewUnitHome()) + `<div class="screen">`;
  html += `<div class="pass-tabs" id="pass-tabs">`;
  passages.forEach((p,i) => {
    html += `<button class="${i===0?"active":""}" data-i="${i}">${p.title}</button>`;
  });
  html += `</div><div id="pass-content"></div></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();

  function show(i) {
    const p = passages[i];
    const lines = (p.text || "").split("\n");
    let h = `<div class="card"><div class="muted" style="margin-bottom:10px">${p.type} · ${p.src || ""}</div>`;
    lines.forEach(line => {
      if (!line.trim()) h += `<div style="height:10px"></div>`;
      else h += `<div class="passage-line" data-line="${encodeURIComponent(line)}">${line}</div>`;
    });
    h += `<button class="btn btn-listen" id="play-all" style="margin-top:16px">🔊 Nghe cả bài</button></div>`;

    if (p.qs && p.qs.length) {
      h += `<div class="section-title">Câu hỏi hiểu bài</div>`;
      p.qs.forEach((q, qi) => {
        h += `<div class="card" style="margin-bottom:12px"><strong>${qi+1}. ${q.q}</strong><div style="margin-top:10px">`;
        const opts = shuffle(q.options.map((o,oi)=>({o,oi})));
        opts.forEach(({o,oi}) => {
          h += `<button class="opt qs-opt" data-qi="${qi}" data-oi="${oi}">${o}</button>`;
        });
        h += `</div><div class="feedback" id="fb-${qi}"></div></div>`;
      });
    }
    $("#pass-content").innerHTML = h;

    $$(".passage-line").forEach(el => {
      el.onclick = () => {
        $$(".passage-line").forEach(x => x.classList.remove("active"));
        el.classList.add("active");
        playText(decodeURIComponent(el.dataset.line));
      };
    });
    $("#play-all").onclick = async () => {
      for (const line of lines) {
        if (!line.trim()) continue;
        await playText(line);
        await new Promise(r => setTimeout(r, 850));
      }
    };
    $$(".qs-opt").forEach(btn => {
      btn.onclick = () => {
        const qi = +btn.dataset.qi;
        const oi = +btn.dataset.oi;
        const q = p.qs[qi];
        const fb = $(`#fb-${qi}`);
        $$(".qs-opt").filter(b => +b.dataset.qi === qi).forEach(b => {
          b.disabled = true;
          if (+b.dataset.oi === q.answer) b.classList.add("correct");
        });
        if (oi === q.answer) {
          btn.classList.add("correct");
          fb.className = "feedback ok";
          fb.textContent = "Đúng rồi! 👏";
        } else {
          btn.classList.add("wrong");
          fb.className = "feedback bad";
          fb.textContent = "Chưa đúng. Đáp án đúng đã tô xanh.";
        }
      };
    });
  }

  $$("#pass-tabs button").forEach(b => {
    b.onclick = () => {
      $$("#pass-tabs button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      show(+b.dataset.i);
    };
  });
  show(0);
}

/* ===== Tests ===== */
let testState = null;

function startTest(type) {
  const questions = buildQuestions(type, currentUnit);
  if (!questions.length) {
    $("#view").innerHTML = header("Kiểm tra", () => viewUnitHome()) +
      `<div class="screen"><p class="muted">Unit này chưa đủ dữ liệu cho bài này.</p>
       <button class="btn btn-ghost btn-lg" style="margin-top:16px" id="btn-back2">Quay lại</button></div>`;
    $("#btn-back").onclick = $("#btn-back2").onclick = () => viewUnitHome();
    return;
  }
  testState = { type, questions, idx: 0, correct: 0, answers: [], answered: false };
  renderQuestion();
}

function buildQuestions(type, u) {
  const qs = [];
  const words = (u.words || []).filter(w => w.en);
  const withEmoji = words.filter(w => w.emoji && w.emoji.length < 5);
  const byCat = {};
  words.forEach(w => {
    const c = w.cat || "thing";
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(w);
  });

  if (type === "listen") {
    pick(withEmoji, 5).forEach(w => {
      const distractors = pick((byCat[w.cat] || words).filter(x => x.en !== w.en && x.emoji), 3);
      let opts = shuffle([w, ...distractors]).slice(0,4);
      while (opts.length < 4) {
        const extra = pick(withEmoji.filter(x => !opts.find(o=>o.en===x.en)), 1)[0];
        if (extra) opts.push(extra); else break;
      }
      qs.push({
        part: "Phần 1 – Nghe từ, chọn hình",
        kind: "listen-pic",
        prompt: "Nghe và chọn hình đúng",
        audioWord: w.en,
        options: opts.map(o => ({ en: o.en, emoji: o.emoji, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === w.en)
      });
    });
    const lines = [];
    (u.passages||[]).forEach(p => (p.text||"").split("\n").forEach(l => { if (l.trim().length > 8) lines.push(l.trim()); }));
    (u.dialogs||[]).forEach(d => { if (d.q) lines.push(d.q); if (d.a) lines.push(d.a); });
    pick(lines, 3).forEach(line => {
      const opts = shuffle([line, "I see a cat.", "The bird is sleeping.", "My father is small."]);
      qs.push({
        part: "Phần 2 – Nghe câu, trả lời",
        kind: "listen-q",
        prompt: "Nghe câu rồi chọn ý đúng",
        audioText: line,
        options: opts,
        answer: opts.indexOf(line)
      });
    });
    pick(withEmoji, 2).forEach(w => {
      let opts = shuffle(pick(withEmoji, 4).map(o => ({en:o.en,emoji:o.emoji,ipa:o.ipa})));
      let ans = opts.findIndex(o => o.en === w.en);
      if (ans < 0) { opts[0] = {en:w.en,emoji:w.emoji,ipa:w.ipa}; ans = 0; }
      qs.push({
        part: "Phần 3 – Nghe và chọn",
        kind: "listen-pic",
        prompt: "Nghe từ, chọn hình",
        audioWord: w.en,
        options: opts,
        answer: ans
      });
    });
  }

  if (type === "vocab") {
    pick(withEmoji, 4).forEach(w => {
      const distractors = pick(words.filter(x => x.en !== w.en), 3);
      const opts = shuffle([w, ...distractors]);
      qs.push({
        part: "Phần 1 – Nhìn hình chọn từ",
        kind: "pic-word",
        prompt: `${w.emoji || "📖"}  Đây là gì?`,
        options: opts.map(o => ({ en: o.en, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === w.en)
      });
    });
    pick(u.riddles || [], 3).forEach(r => {
      const ans = words.find(w => w.en === r.answer) || { en: r.answer, ipa: "" };
      const distractors = pick(words.filter(x => x.en !== r.answer), 3);
      const opts = shuffle([ans, ...distractors]);
      qs.push({
        part: "Phần 2 – Câu đố",
        kind: "riddle",
        prompt: r.clue,
        options: opts.map(o => ({ en: o.en, ipa: o.ipa || "" })),
        answer: opts.findIndex(o => o.en === r.answer)
      });
    });
    const cats = Object.keys(byCat).filter(c => byCat[c].length >= 3);
    pick(cats, 3).forEach(c => {
      const same = pick(byCat[c], 3);
      const otherCat = pick(Object.keys(byCat).filter(x => x !== c), 1)[0];
      const odd = pick(byCat[otherCat] || words, 1)[0];
      if (!odd) return;
      const opts = shuffle([...same, odd]);
      qs.push({
        part: "Phần 3 – Chọn từ khác nhóm",
        kind: "odd",
        prompt: "Từ nào khác nhóm?",
        options: opts.map(o => ({ en: o.en, ipa: o.ipa })),
        answer: opts.findIndex(o => o.en === odd.en)
      });
    });
  }

  if (type === "read") {
    (u.passages || []).forEach(p => {
      (p.qs || []).forEach(q => {
        const opts = shuffle(q.options.map((o,i)=>({o,i})));
        qs.push({
          part: "Đọc hiểu – " + p.title,
          kind: "mc",
          prompt: q.q,
          options: opts.map(x => x.o),
          answer: opts.findIndex(x => x.i === q.answer)
        });
      });
    });
    pick(u.dialogs || [], 3).forEach(d => {
      const others = pick((u.dialogs||[]).filter(x => x.a !== d.a), 3).map(x => x.a);
      const opts = shuffle([d.a, ...others]);
      qs.push({
        part: "Hội thoại",
        kind: "mc",
        prompt: d.q,
        options: opts,
        answer: opts.indexOf(d.a)
      });
    });
    if ((u.order||[]).length >= 3) {
      const seq = u.order.slice(0,4);
      qs.push({
        part: "Sắp xếp",
        kind: "order",
        prompt: "Sắp xếp các câu theo đúng thứ tự",
        items: shuffle([...seq]),
        correctOrder: seq
      });
    }
  }

  if (type === "write") {
    pick(u.cloze || [], 3).forEach(c => {
      qs.push({
        part: "Điền từ",
        kind: "cloze",
        prompt: c.s.replace("___", "______"),
        answer: c.a
      });
    });
    pick(u.order || [], 2).forEach(sent => {
      const wordsIn = sent.replace(/[.,!?]/g,"").split(/\s+/).filter(Boolean);
      qs.push({
        part: "Xếp từ thành câu",
        kind: "scramble",
        prompt: "Xếp các từ thành câu đúng",
        items: shuffle(wordsIn),
        answer: sent.replace(/[.,!?]/g,"").trim().toLowerCase()
      });
    });
    pick(u.write || [], 3).forEach(w => {
      qs.push({
        part: "Viết câu",
        kind: "free",
        prompt: w.q,
        model: w.model
      });
    });
  }
  return qs.slice(0, NUM_Q[type] || 10);
}

function renderQuestion() {
  const st = testState;
  if (!st) return;
  if (st.idx >= st.questions.length) return showResult();

  const q = st.questions[st.idx];
  st.answered = false;
  let html = header(`Unit ${currentUnit.id}`, () => viewUnitHome());
  html += `<div class="screen">`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <button class="btn btn-ghost" id="btn-exit" style="padding:10px 14px;font-size:.95rem">Thoát</button>
    <span class="muted" style="font-weight:600">Câu ${st.idx+1}/${st.questions.length}</span>
  </div>`;
  html += `<div class="progress-bar"><div style="width:${(st.idx/st.questions.length)*100}%"></div></div>`;
  html += `<div class="muted" style="margin-bottom:10px;font-weight:600">${q.part || ""}</div>`;
  html += `<div class="card" id="qcard">`;
  html += `<div style="font-weight:800;font-size:1.18rem;margin-bottom:14px;line-height:1.35">${q.prompt}</div>`;

  if (q.kind === "listen-pic" || q.kind === "listen-q") {
    html += `<button class="btn btn-listen" id="btn-listen">🔊 Nghe</button>`;
    html += `<p class="muted" style="margin:10px 0 14px;font-size:.85rem">Bé cần bấm nghe ít nhất 1 lần mới chọn được đáp án.</p>`;
  }

  if (q.kind === "listen-pic" || q.kind === "pic-word") {
    html += `<div class="grid2" id="opts">`;
    (q.options||[]).forEach((o,i) => {
      if (q.kind === "listen-pic") {
        html += `<button class="opt-img" data-i="${i}" disabled>
          <span class="emoji">${o.emoji||"❓"}</span>
          <span class="en">${o.en}</span>
          <span class="ipa">${o.ipa||""}</span>
        </button>`;
      } else {
        html += `<button class="opt" data-i="${i}">${o.en}<br><span class="muted" style="font-weight:500;font-size:.88rem">${o.ipa||""}</span></button>`;
      }
    });
    html += `</div>`;
  } else if (q.kind === "riddle" || q.kind === "odd" || q.kind === "mc" || q.kind === "listen-q") {
    html += `<div id="opts">`;
    (q.options||[]).forEach((o,i) => {
      const label = typeof o === "string" ? o : (o.en + (o.ipa ? `<br><span class="muted" style="font-weight:500;font-size:.88rem">${o.ipa}</span>` : ""));
      html += `<button class="opt" data-i="${i}" ${q.kind==="listen-q"?"disabled":""}>${label}</button>`;
    });
    html += `</div>`;
  } else if (q.kind === "cloze") {
    html += `<input id="cloze-in" type="text" autocomplete="off" style="width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--border);font-size:1.1rem;font-family:inherit;background:var(--bg);color:var(--text)" placeholder="Viết từ còn thiếu...">`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans" style="margin-top:14px">Kiểm tra</button>`;
  } else if (q.kind === "scramble") {
    html += `<div id="scramble-bank" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px"></div>`;
    html += `<div id="scramble-out" style="min-height:52px;padding:14px;border:2px dashed var(--border);border-radius:14px;margin-bottom:14px;font-weight:600"></div>`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans">Kiểm tra</button>`;
  } else if (q.kind === "order") {
    html += `<div id="order-list"></div>`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans" style="margin-top:14px">Kiểm tra thứ tự</button>`;
  } else if (q.kind === "free") {
    html += `<textarea id="free-in" rows="3" style="width:100%;padding:15px;border-radius:14px;border:2px solid var(--border);font-size:1.05rem;font-family:inherit;background:var(--bg);color:var(--text)" placeholder="Viết câu trả lời..."></textarea>`;
    html += `<button class="btn btn-primary btn-lg" id="btn-check-ans" style="margin-top:14px">Xem đáp án mẫu</button>`;
  }

  html += `<div class="feedback" id="fb"></div>`;
  html += `<button class="btn btn-primary btn-lg hidden" id="btn-next" style="margin-top:8px">Câu tiếp →</button>`;
  html += `</div></div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();
  $("#btn-exit").onclick = () => viewUnitHome();

  let listened = q.kind !== "listen-pic" && q.kind !== "listen-q";

  if (q.kind === "listen-pic" || q.kind === "listen-q") {
    $("#btn-listen").onclick = async () => {
      if (q.audioWord) await playWord(q.audioWord);
      else if (q.audioText) await playText(q.audioText);
      listened = true;
      $$("#opts [data-i]").forEach(b => b.disabled = false);
      $("#btn-listen").textContent = "🔊 Nghe lại";
    };
  }

  function markAnswer(chosen) {
    if (st.answered) return;
    st.answered = true;
    const correct = chosen === q.answer;
    if (correct) st.correct++;
    st.answers.push({ q, chosen, correct });
    $$("#opts [data-i]").forEach(b => {
      b.disabled = true;
      const i = +b.dataset.i;
      if (i === q.answer) b.classList.add("correct");
      if (i === chosen && !correct) b.classList.add("wrong");
    });
    const fb = $("#fb");
    if (correct) { fb.className = "feedback ok"; fb.textContent = "Đúng rồi! 👏"; }
    else { fb.className = "feedback bad"; fb.textContent = "Chưa đúng. Đáp án đúng đã tô xanh."; }
    $("#btn-next").classList.remove("hidden");
  }

  $$("#opts [data-i]").forEach(b => {
    b.onclick = () => { if (!listened) return; markAnswer(+b.dataset.i); };
  });

  if (q.kind === "cloze") {
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      const val = normalizeKey($("#cloze-in").value, true);
      const ans = normalizeKey(q.answer, true);
      st.answered = true;
      const ok = val === ans;
      if (ok) st.correct++;
      st.answers.push({ q, chosen: val, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="feedback ok"; fb.textContent="Đúng rồi! 👏"; }
      else { fb.className="feedback bad"; fb.textContent=`Chưa đúng. Đáp án: ${q.answer}`; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "scramble") {
    const bank = $("#scramble-bank");
    const out = $("#scramble-out");
    const chosen = [];
    q.items.forEach(w => {
      const b = document.createElement("button");
      b.className = "btn btn-ghost";
      b.style.padding = "10px 14px";
      b.textContent = w;
      b.onclick = () => {
        if (b.disabled) return;
        b.disabled = true;
        chosen.push(w);
        out.textContent = chosen.join(" ");
      };
      bank.appendChild(b);
    });
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      const got = normalizeKey(chosen.join(" "), true);
      const ok = got === normalizeKey(q.answer, true);
      if (ok) st.correct++;
      st.answers.push({ q, chosen: got, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="feedback ok"; fb.textContent="Đúng rồi! 👏"; }
      else { fb.className="feedback bad"; fb.textContent=`Chưa đúng. Câu đúng: ${q.answer}`; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "order") {
    const list = $("#order-list");
    const items = [...q.items];
    function draw() {
      list.innerHTML = "";
      items.forEach((s,i) => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:8px";
        row.innerHTML = `
          <button class="btn btn-ghost" data-up="${i}" style="padding:8px 12px;min-width:42px">↑</button>
          <button class="btn btn-ghost" data-down="${i}" style="padding:8px 12px;min-width:42px">↓</button>
          <span class="card" style="flex:1;padding:12px 14px;font-weight:600">${s}</span>`;
        list.appendChild(row);
      });
      $$("[data-up]").forEach(b => b.onclick = () => {
        const i = +b.dataset.up;
        if (i>0) { [items[i-1],items[i]]=[items[i],items[i-1]]; draw(); }
      });
      $$("[data-down]").forEach(b => b.onclick = () => {
        const i = +b.dataset.down;
        if (i<items.length-1) { [items[i],items[i+1]]=[items[i+1],items[i]]; draw(); }
      });
    }
    draw();
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      const ok = items.every((s,i) => s === q.correctOrder[i]);
      if (ok) st.correct++;
      st.answers.push({ q, chosen: items, correct: ok });
      const fb = $("#fb");
      if (ok) { fb.className="feedback ok"; fb.textContent="Đúng rồi! 👏"; }
      else { fb.className="feedback bad"; fb.textContent="Chưa đúng thứ tự."; }
      $("#btn-next").classList.remove("hidden");
    };
  }

  if (q.kind === "free") {
    $("#btn-check-ans").onclick = () => {
      if (st.answered) return;
      st.answered = true;
      st.answers.push({ q, chosen: $("#free-in").value, correct: null });
      const fb = $("#fb");
      fb.className = "feedback ok";
      fb.innerHTML = `Đáp án mẫu (bố mẹ đối chiếu):<br><strong>${q.model}</strong>`;
      $("#btn-next").classList.remove("hidden");
    };
  }

  $("#btn-next").onclick = () => { st.idx++; renderQuestion(); };
}

function showResult() {
  const st = testState;
  let html = header("Kết quả", () => viewUnitHome()) + `<div class="screen">`;
  html += `<div class="card" style="text-align:center;margin-bottom:18px;padding:28px 20px">
    <div style="font-size:2.4rem;font-weight:800;letter-spacing:-0.03em">${st.correct}/${st.questions.length}</div>
    <p class="muted" style="margin-top:6px">Con đúng ${st.correct}/${st.questions.length} câu</p>
  </div>`;
  const wrong = st.answers.filter(a => a.correct === false);
  if (wrong.length) {
    html += `<div class="section-title">Mục cần ôn</div>`;
    wrong.forEach(a => {
      const label = a.q.audioWord || a.q.prompt || a.q.answer || "";
      html += `<div class="card" style="margin-bottom:8px;display:flex;align-items:center;gap:12px;padding:14px 16px">
        <span style="flex:1;font-weight:600">${String(label).slice(0,55)}</span>
        <button class="btn btn-ghost" data-retry="${encodeURIComponent(JSON.stringify(a.q))}" style="padding:10px 14px">🔊</button>
      </div>`;
    });
  }
  html += `<button class="btn btn-primary btn-lg" id="btn-retry-wrong" style="margin-top:14px">Làm lại các câu sai</button>`;
  html += `<button class="btn btn-ghost btn-lg" id="btn-retry-all" style="margin-top:10px">Làm lại từ đầu</button>`;
  html += `<button class="btn btn-ghost btn-lg" id="btn-back-unit" style="margin-top:10px">Về unit</button>`;
  html += `</div>`;
  $("#view").innerHTML = html;
  $("#btn-back").onclick = () => viewUnitHome();
  $("#btn-back-unit").onclick = () => viewUnitHome();
  $("#btn-retry-all").onclick = () => startTest(st.type);
  $("#btn-retry-wrong").onclick = () => {
    if (!wrong.length) return startTest(st.type);
    testState = {
      type: st.type,
      questions: wrong.map(a => a.q),
      idx: 0, correct: 0, answers: [], answered: false
    };
    renderQuestion();
  };
  $$("[data-retry]").forEach(b => {
    b.onclick = () => {
      try {
        const q = JSON.parse(decodeURIComponent(b.dataset.retry));
        if (q.audioWord) playWord(q.audioWord);
        else if (q.audioText) playText(q.audioText);
        else if (q.prompt) playText(q.prompt);
      } catch(e) {}
    };
  });
}

/* ===== Check page (chỉ khi ?check=1) ===== */
async function viewCheck() {
  let html = header("Kiểm tra dữ liệu") + `<div class="screen">`;
  html += `<p class="muted" style="margin-bottom:14px">Trang nội bộ. Không hiện trên app bình thường.</p>`;
  for (const meta of unitsMeta.units) {
    try {
      const data = await fetch(`${meta.data}?v=${meta.rev}`).then(r => r.json());
      const audio = await fetch(`${meta.audio}?v=${meta.rev}`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
      const needed = [];
      (data.words||[]).forEach(w => {
        const en = normalizeKey(w.en, true);
        needed.push("w:"+en, "s:"+en);
      });
      (data.passages||[]).forEach(p => {
        (p.text||"").split("\n").forEach(l => { if (l.trim()) needed.push("l:"+normalizeKey(l)); });
      });
      (data.dialogs||[]).forEach(d => {
        if (d.q) needed.push("l:"+normalizeKey(d.q));
        if (d.a) needed.push("l:"+normalizeKey(d.a));
      });
      (data.order||[]).forEach(s => { if (s.trim()) needed.push("l:"+normalizeKey(s)); });
      (data.cloze||[]).forEach(c => {
        const s = (c.s||"").replace("___", c.a||"");
        if (s.trim()) needed.push("l:"+normalizeKey(s));
      });
      (data.write||[]).forEach(w => { if (w.q) needed.push("l:"+normalizeKey(w.q)); });
      const uniq = [...new Set(needed)];
      const have = uniq.filter(k => audio[k] && audio[k].startsWith("data:audio"));
      const miss = uniq.filter(k => !audio[k] || !audio[k].startsWith("data:audio"));
      html += `<div class="card" style="margin-bottom:14px">
        <strong>Unit ${data.id}: ${data.title}</strong>
        <div class="muted">Từ: ${(data.words||[]).length} · Bài đọc: ${(data.passages||[]).length}</div>
        <div style="margin-top:8px">Audio cần: <strong>${uniq.length}</strong> · Có: <strong>${have.length}</strong> · Thiếu: <strong style="color:var(--bad)">${miss.length}</strong></div>`;
      if (miss.length) {
        html += `<div style="margin-top:8px;max-height:120px;overflow:auto">`;
        miss.slice(0,30).forEach(k => html += `<span class="chip">${k.slice(0,45)}</span>`);
        if (miss.length > 30) html += `<span class="chip">+${miss.length-30}</span>`;
        html += `</div>`;
      } else {
        html += `<div class="status-voice" style="margin-top:8px">✓ Đủ audio</div>`;
      }
      html += `</div>`;
    } catch(e) {
      html += `<div class="card">Unit ${meta.id}: lỗi – ${e.message}</div>`;
    }
  }
  html += `<button class="btn btn-primary btn-lg" id="btn-home">Về trang chủ</button></div>`;
  $("#view").innerHTML = html;
  $("#btn-home").onclick = () => { location.search = ""; viewAppHome(); };
}

// ---------- boot ----------
loadProgress();
(async () => {
  try {
    await loadUnits();
    if (location.search.includes("check=1")) {
      await viewCheck();
    } else {
      viewAppHome();
    }
  } catch(e) {
    $("#view").innerHTML = `<div class="screen"><h2>Lỗi tải units.json</h2><p>${e.message}</p>
      <p class="muted">Hãy chắc chắn file units.json nằm cùng thư mục với index.html</p></div>`;
  }
})();
</script>
