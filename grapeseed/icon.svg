<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#C4A1FF"/>
      <stop offset="0.55" stop-color="#8B4DE8"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7A0"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stem -->
  <path d="M256 150 C256 120 270 100 292 86" stroke="#7A4A22" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- leaf -->
  <path d="M292 90 C292 40 350 24 396 40 C396 90 350 118 292 90 Z" fill="url(#leaf)"/>
  <path d="M300 88 C330 76 360 62 386 46" stroke="#15803D" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/>
  <!-- grapes: back row -->
  <g fill="url(#g1)">
    <circle cx="176" cy="206" r="58"/>
    <circle cx="256" cy="196" r="58"/>
    <circle cx="336" cy="206" r="58"/>
    <circle cx="214" cy="282" r="58"/>
    <circle cx="298" cy="282" r="58"/>
    <circle cx="256" cy="356" r="58"/>
  </g>
  <!-- shine -->
  <g fill="#fff" opacity=".55">
    <ellipse cx="156" cy="184" rx="14" ry="9" transform="rotate(-35 156 184)"/>
    <ellipse cx="236" cy="174" rx="14" ry="9" transform="rotate(-35 236 174)"/>
    <ellipse cx="316" cy="184" rx="14" ry="9" transform="rotate(-35 316 184)"/>
    <ellipse cx="194" cy="260" rx="14" ry="9" transform="rotate(-35 194 260)"/>
    <ellipse cx="278" cy="260" rx="14" ry="9" transform="rotate(-35 278 260)"/>
    <ellipse cx="236" cy="334" rx="14" ry="9" transform="rotate(-35 236 334)"/>
  </g>
  <!-- cute face on bottom grape -->
  <g fill="#2E1065">
    <circle cx="238" cy="362" r="7"/>
    <circle cx="274" cy="362" r="7"/>
  </g>
  <path d="M242 376 Q256 390 270 376" stroke="#2E1065" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="224" cy="378" r="8" fill="#FF9EC4" opacity=".7"/>
  <circle cx="288" cy="378" r="8" fill="#FF9EC4" opacity=".7"/>
</svg>
