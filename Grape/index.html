html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.35}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;font-weight:800;margin:6px 0 10px}
h2{font-size:22px;font-weight:800;margin:18px 0 4px}
p{margin:0 0 8px;color:var(--sub)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:12px 14px;color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 2px var(--line);min-height:50px;text-align:left}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary{background:var(--blue);color:var(--blue-t);font-weight:700;box-shadow:none;text-align:center;width:100%}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{text-align:center;font-weight:700;padding:10px 4px}
.tab.on{background:var(--ink);color:var(--bg);box-shadow:none}
.ulist{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;padding:12px;background:var(--card);border-radius:18px;box-shadow:inset 0 0 0 2px var(--line)}
.ulist button{text-align:center;padding:8px 0;min-height:48px;font-weight:700}
.ulist button.has{box-shadow:inset 0 0 0 2px var(--blue)}
.ulist button.sel{background:var(--blue);color:var(--blue-t);box-shadow:none}
.ulist button.empty{opacity:.45}
.tests{display:grid;gap:10px;margin-top:10px}
.test{display:flex;align-items:center;gap:14px;padding:14px 16px}
.test .i{font-size:32px}
.test b{font-size:20px;display:block}
.test small{color:var(--sub);font-size:15px;display:block;line-height:1.25}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub)}
.top button{min-height:40px;padding:6px 14px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.tt{font-size:15px;font-weight:700;color:var(--blue);margin:0 0 6px}
.word{font-size:54px;font-weight:800;text-align:center;margin:4px 0 0;word-break:break-word}
.ipa{text-align:center;color:var(--sub);font-size:21px;margin-bottom:4px}
.qtxt{font-size:22px;font-weight:700;margin:6px 0 12px}
.aud{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.aud button{border-radius:999px;padding:8px 18px;min-height:44px;text-align:center}
.pass{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:6px;font-size:19px;white-space:pre-line;max-height:34vh;overflow:auto}
.vc{margin-top:22px;padding:14px;background:var(--card);border-radius:16px;box-shadow:inset 0 0 0 2px var(--line)}
.vc b{font-size:19px}
.vc p{font-size:15px;margin:2px 0 8px}
.vc select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.pass b{display:block;margin-bottom:2px}
.opts{display:grid;gap:10px}
.opts button{font-size:20px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.opts small{display:block;color:var(--sub);font-size:15px}
.opts button.pick{background:var(--blue-bg);box-shadow:inset 0 0 0 3px var(--blue)}
.opts button.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 3px var(--ok)}
.opts button.no{background:var(--bad-bg);box-shadow:inset 0 0 0 3px var(--bad)}
.mk{font-size:28px;font-weight:800}
input[type=text]{width:100%;font:inherit;font-size:28px;text-align:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 4px}
.blank{font-size:26px;text-align:center;margin:12px 0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:8px;border-radius:14px;margin:8px 0;background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.chips button{min-height:44px;padding:6px 14px;text-align:center;font-weight:700}
.chips.ans{background:var(--blue-bg)}
.fb{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 16px;margin:12px 0;font-weight:700}
.fb .mk{font-size:34px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.live{color:var(--sub);font-size:15px}
.score{font-size:64px;font-weight:800;text-align:center;margin:4px 0 0}
.sc2{text-align:center;color:var(--sub);margin-bottom:14px}
.rv{display:grid;gap:6px;margin:10px 0 16px}
.rv div{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:6px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.rv .y{color:var(--ok)}.rv .n{color:var(--bad)}
.rv span.m{font-size:24px;font-weight:800;width:28px}
.stack{display:grid;gap:10px;margin-top:10px}
.empty-msg{background:var(--card);border-radius:16px;padding:16px;margin-top:10px;box-shadow:inset 0 0 0 2px var(--line);color:var(--sub)}
</style>
</head>

e line.\n“Sister, I cannot put this sweater up there.\nCan you help me?”\n“Yes, I will help you,” says Sister.\nShe puts his little sweater up.\n\nMother Bear is happy with her little bears.\n“Thank you for helping me,” she says.\n“You’re welcome, Mother.\nCan we put faces on the cookies?”\n“Yes, you can.”\n\nThe three little bears have some fun.\nThey make big eyes and small eyes.\nThey make short ears and long ears.\nSister puts red cheeks and lips on her face.\n\nNow it’s time to go to bed.\nJonny is sleepy.\nHe rubs his eyes and brushes his teeth.\nBrother washes his face with water.\nSister uses a comb to comb her hair.\n\n“In the morning,” says Mother Bear,\n“we will go swimming.\nWe will take food and many fish.\nMr. Sam and Miss Suzy will go with us.\nIt will be a good day.”", "qs": [["Who is Jonny looking for?", ["His brother and sister", "His mother", "His father", "His friend Marvin"], 0], ["What does Mother Bear want to wash?", ["Their clothes", "Their toys", "Their shoes only", "The cookies"], 0], ["Why can Jonny not put his sweater on the line?", ["He is too short", "He is too tall", "He is sleepy", "He is hungry"], 0], ["What do they put on the cookies?", ["Faces", "Hats", "Shoes", "Pockets"], 0], ["What will they do in the morning?", ["Go swimming", "Go to school", "Go to the zoo", "Wash clothes"], 0]]}], "cloze": [["The sky is ___.", "blue"], ["The grass is ___.", "green"], ["I have a ___ on my back. It has my books.", "bag"], ["The teacher opens the ___.", "door"], ["Marvin sits on the ___.", "table"], ["I ___ water when I am thirsty.", "drink"], ["We play in the ___ at the playground.", "sandbox"], ["Hello, how are you? I am ___, thank you.", "fine"]], "order": ["The sky is blue.", "I like the jungle gym.", "I have a book.", "We looked under the chairs.", "Hello, how are you?", "I am fine, thank you.", "Marvin goes to school."]}

function stopAudio(){playTok++;try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function playSeq(list,rate){var tok=++playTok,i=0;function next(){if(tok!==playTok||i>=list.length)return;var a=new Audio(list[i++]);a.playbackRate=rate;try{a.preservesPitch=true;a.webkitPreservesPitch=true}catch(e){}curAudio=a;a.onended=function(){setTimeout(next,rate<1?250:120)};a.onerror=next;a.play().catch(function(){})}next()}
function playAudio(text,r){if(typeof AUDIO==="undefined")return false;var slow=r<.7,k=text.toLowerCase().trim(),list=[],rate=1;
if(AUDIO["w:"+k]){list=[AUDIO[(slow&&AUDIO["s:"+k])?"s:"+k:"w:"+k]]}
else{var ls=text.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);if(!ls.length||!ls.every(function(l){return AUDIO["l:"+l]}))return false;list=ls.map(function(l){return AUDIO["l:"+l]});if(slow)rate=.8}
stopAudio();playSeq(list,rate);return true}
function speak(w,r){if(playAudio(w,r))return;ttsSpeak(w,r)}
function ttsSpeak(w,r){try{speechSynthesis.cancel();var v=pickVoice();w.split(/\n+/).forEach(function(line){if(!line.trim())return;var u=new SpeechSynthesisUtterance(line);u.lang="en-US";if(v){u.voice=v;u.lang=v.lang}u.rate=r;u.pitch=1.15;speechSynthesis.speak(u)})}catch(e){}}
function voiceCard(){var vs=voices(),cur=pickVoice();
if(!vs.length)return '<div class="vc"><b>Giọng đọc</b><p>Chưa thấy giọng tiếng Anh nào trên thiết bị. Hãy cài giọng tiếng Anh trong cài đặt Chuyển văn bản thành giọng nói của điện thoại.</p></div>';
return '<div class="vc"><b>Giọng dự phòng</b><p>Chỉ dùng khi bài chưa có âm thanh AI. Chọn giọng nữ rồi bấm Nghe thử.</p><select id="vsel">'+vs.map(function(v){return '<option value="'+esc(v.name)+'"'+(cur&&cur.name===v.name?' selected':'')+'>'+esc(v.name)+' ('+v.lang+')</option>'}).join('')+'</select><button id="vtest" class="primary">🔊 Nghe thử</button></div>'}
function bindVoice(){var sel=document.getElementById("vsel"),t=document.getElementById("vtest");if(!sel)return;
sel.onchange=function(){S.voice=sel.value;save()};
t.onclick=function(){S.voice=sel.value;save();speak("Hello! Let us learn English together.",.9)}}
try{speechSynthesis.onvoiceschanged=function(){if(onHome)home()}}catch(e){}
var audioState={};
function loadAudio(n){var U=UNITS[n];if(!U||!U.audio||audioState[n]==="ok"||audioState[n]==="loading")return;audioState[n]="loading";refreshAudioNote();
fetch(U.audio).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){Object.assign(AUDIO,d);audioState[n]="ok";refreshAudioNote()}).catch(function(e){audioState[n]="fail:"+(e&&e.message||"lỗi");refreshAudioNote()})}
function refreshAudioNote(){var el=document.getElementById("anote");if(!el||curUnit===null)return;var U=UNITS[curUnit],st=audioState[curUnit];
el.textContent=(!U||!U.audio)?"":st==="ok"?"🔊 Giọng AI đã sẵn sàng":st==="loading"?"⏳ Đang tải giọng AI...":"⚠️ Chưa tải được giọng AI ("+String(st||"").replace("fail:","")+"), tạm dùng giọng điện thoại"}
function bestOf(u,t){var v=S.best[u+"_"+t];return v?v.s+"/"+v.n+" câu đúng":"chưa làm"}
function wh(w){return '<span>'+esc(w[0])+'<small>'+w[3]+' · '+esc(w[1])+'</small></span>'}
function audio(){return '<div class="aud"><button data-s=".95">🔊 Thường</button><button data-s=".5">🐢 Chậm</button></div>'}

function home(){
onHome=true;try{stopAudio()}catch(e){}
var h='<h1>Grapeseed</h1><div class="tabs">';
RANGES.forEach(function(r,i){h+='<button class="tab'+(openTab===i?' on':'')+'" data-tab="'+i+'">Unit '+r[0]+' - '+r[1]+'</button>'});
h+='</div>';
if(openTab!==null){var r=RANGES[openTab];h+='<div class="ulist">';
for(var u=r[0];u<=r[1];u++)h+='<button data-u="'+u+'" class="'+(UNITS[u]?'has':'empty')+(curUnit===u?' sel':'')+'">'+u+'</button>';
h+='</div>'}
if(curUnit!==null){
var U=UNITS[curUnit];h+='<h2>Unit '+curUnit+(U?' - '+esc(U.title):'')+'</h2><p class="live" id="anote"></p>';
if(U){h+='<p>Đúng được 1 điểm, sai không có điểm.</p><div class="tests">'+
[["vocab","🔤","Xem từ tiếng Anh, chọn nghĩa tiếng Việt"],["listen","🎧","Nghe từ, chọn từ đúng, có phiên âm và nghĩa"],["read","📖","Đọc truyện Grapeseed, chọn đáp án đúng"],["write","✍️","Viết từ, điền chỗ trống, sắp xếp câu"]].map(function(t){
return '<button class="test" data-t="'+t[0]+'"><span class="i">'+t[1]+'</span><span><b>'+TITLES[t[0]]+'</b><small>'+t[2]+'</small><small>Lần gần nhất: '+bestOf(curUnit,t[0])+'</small></span></button>'}).join('')+'</div>';
}else h+='<div class="empty-msg">Unit này chưa có nội dung.</div>';
}else if(openTab===null)h+='<p style="margin-top:14px">Bấm vào một nhóm unit để chọn bài.</p>';
app.innerHTML=h;
if(curUnit!==null){loadAudio(curUnit);refreshAudioNote()}
app.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){var i=+b.dataset.tab;openTab=(openTab===i)?null:i;home()}});
app.querySelectorAll("[data-u]").forEach(function(b){b.onclick=function(){curUnit=+b.dataset.u;home()}});
app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){start(b.dataset.t)}});
}

function start(type){
onHome=false;
var U=UNITS[curUnit],qs=[];
if(type==="vocab"||type==="listen"){
var listen=type==="listen";
shuffle(U.words).slice(0,listen?N_LISTEN:N_VOCAB).forEach(function(w){
var o=shuffle(U.words.filter(function(x){return x[1]!==w[1]&&x[0]!==w[0]})).slice(0,3);
var all=shuffle([w].concat(o));
qs.push({k:"mc",mode:listen?"listen":"word",w:w,say:w[0],ans:String(all.indexOf(w)),
opts:all.map(function(x){return listen?wh(x):'<span>'+esc(x[1])+'</span>'}),
log:w[0]+" "+w[3]+" = "+w[1]})});
}else if(type==="read"){
U.passages.forEach(function(p){p.qs.forEach(function(q){
var idx=shuffle([0,1,2,3]);
qs.push({k:"mc",mode:"read",p:p,q:q[0],say:p.text,ans:String(idx.indexOf(q[2])),
opts:idx.map(function(i){return '<span>'+esc(q[1][i])+'</span>'}),log:q[0]+" "+q[1][q[2]]})})});
}else{
shuffle(U.words).slice(0,N_SPELL).forEach(function(w){qs.push({k:"spell",w:w,say:w[0],ans:w[0],log:w[0]+" "+w[3]})});
shuffle(U.cloze).slice(0,N_CLOZE).forEach(function(c){qs.push({k:"cloze",t:c[0],ans:c[1],log:c[0].replace("___",c[1])})});
shuffle(U.order).slice(0,N_ORDER).forEach(function(s){qs.push({k:"order",s:s,ans:s,log:s})});
}
G={type:type,qs:qs,i:0,score:0,log:[],done:false,sel:null,built:[]};
question();
}
function head(){
return '<div class="top"><button id="quit">Thoát</button><span class="live">Điểm: '+G.score+'/'+G.qs.length+'</span></div><div class="bar"><i style="width:'+Math.round(G.i/G.qs.length*100)+'%"></i></div><p class="tt">Unit '+curUnit+' - '+TITLES[G.type]+' - Câu '+(G.i+1)+'/'+G.qs.length+'</p>';
}
function bindAudio(q,auto){
app.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){speak(q.say,+b.dataset.s)}});
if(auto)setTimeout(function(){speak(q.say,.95)},250);
}
function question(){
if(G.i>=G.qs.length)return result();
var q=G.qs[G.i],h=head();G.done=false;G.sel=null;G.built=[];
if(q.k==="mc"){
if(q.mode==="word")h+='<div class="word">'+esc(q.w[0])+'</div><div class="ipa">'+q.w[3]+'</div>'+audio()+'<p class="qtxt" style="text-align:center">Chọn nghĩa tiếng Việt đúng</p>';
else if(q.mode==="listen")h+=audio()+'<p class="qtxt" style="text-align:center">Nghe và chọn từ đúng</p>';
else h+='<div class="pass"><b>'+esc(q.p.title)+'</b>'+esc(q.p.text)+'</div>'+audio()+'<p class="qtxt">'+esc(q.q)+'</p>';
h+='<div class="opts">'+q.opts.map(function(o,i){return '<button data-v="'+i+'">'+o+'<span class="mk"></span></button>'}).join('')+'</div>';
}else if(q.k==="spell"){
h+=audio()+'<p class="qtxt" style="text-align:center">Nghe và viết từ</p><input type="text" id="ans" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Gõ từ vừa nghe">';
}else if(q.k==="cloze"){
h+='<p class="qtxt" style="text-align:center">Điền từ còn thiếu</p><div class="blank">'+esc(q.t).replace("___","_____")+'</div><input type="text" id="ans" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Gõ từ cần điền">';
}else{
q.pool=shuffle(q.s.split(" ").map(function(t,i){return {t:t,i:i}}));
for(var n=0;n<5&&q.pool.map(function(x){return x.i}).join()==="0,1,2,3,4,5".slice(0,q.pool.length*2-1);n++)q.pool=shuffle(q.pool);
h+='<p class="qtxt" style="text-align:center">Sắp xếp các từ thành câu đúng</p><div class="chips ans" id="built"></div><div class="chips" id="pool"></div>';
}
h+='<div id="fb"></div><button class="primary" id="act">'+(q.k==="mc"?"Chọn":"Kiểm tra")+'</button>';
app.innerHTML=h;
document.getElementById("quit").onclick=home;
var act=document.getElementById("act");
if(q.k==="mc"||q.k==="spell")bindAudio(q,q.mode==="listen"||q.k==="spell");
if(q.mode==="word"){}
if(q.k==="mc"){
act.disabled=true;
app.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){
if(G.done)return;G.sel=b.dataset.v;
app.querySelectorAll("[data-v]").forEach(function(x){x.classList.toggle("pick",x===b)});act.disabled=false}});
}
if(q.k==="order"){chips(q);act.disabled=true}
if(q.k==="spell"||q.k==="cloze"){var inp=document.getElementById("ans");inp.onkeydown=function(e){if(e.key==="Enter"&&!G.done)act.click()}}
act.onclick=function(){
if(G.done){G.i++;question();return}
var good=false,msg="";
if(q.k==="mc"){
good=G.sel===q.ans;
app.querySelectorAll("[data-v]").forEach(function(x){var m=x.querySelector(".mk");x.classList.remove("pick");
if(x.dataset.v===q.ans){x.classList.add("ok");m.textContent="✓";m.style.color="var(--ok)"}
else if(x.dataset.v===G.sel){x.classList.add("no");m.textContent="✗";m.style.color="var(--bad)"}});
msg=good?"Đúng! +1 điểm":"Sai. "+q.log;
}else if(q.k==="order"){
good=G.built.map(function(x){return x.t}).join(" ")===q.s;
msg=good?"Đúng! +1 điểm":"Sai. Câu đúng: "+q.s;
}else{
var inp2=document.getElementById("ans"),v=inp2.value.trim().toLowerCase();
if(!v){return}
good=v===q.ans;inp2.disabled=true;
msg=good?"Đúng! +1 điểm":"Sai. Đáp án: "+q.ans+(q.w?" "+q.w[3]:"");
}
G.done=true;if(good)G.score++;G.log.push([q.log,good]);
document.getElementById("fb").innerHTML='<div class="fb '+(good?'ok':'no')+'"><span class="mk">'+(good?'✓':'✗')+'</span><span>'+esc(msg)+'</span></div>';
act.textContent=G.i+1>=G.qs.length?"Xem kết quả":"Câu tiếp theo";act.disabled=false;
if(q.k==="order"){document.getElementById("pool").innerHTML="";document.getElementById("built").querySelectorAll("button").forEach(function(b){b.disabled=true})}
};
}
function chips(q){
var b=document.getElementById("built"),p=document.getElementById("pool");
function draw(){
b.innerHTML="";p.innerHTML="";
G.built.forEach(function(x,i){var e=document.createElement("button");e.textContent=x.t;e.onclick=function(){if(G.done)return;G.built.splice(i,1);q.pool.push(x);draw()};b.appendChild(e)});
q.pool.forEach(function(x,i){var e=document.createElement("button");e.textContent=x.t;e.onclick=function(){if(G.done)return;q.pool.splice(i,1);G.built.push(x);draw()};p.appendChild(e)});
document.getElementById("act").disabled=G.done?false:q.pool.length>0;
}
draw();
}
function result(){
var n=G.qs.length,sc=G.score;
S.best[curUnit+"_"+G.type]={s:sc,n:n};save();
var h='<h1 style="text-align:center;margin-bottom:0">Kết quả</h1><p class="sc2">Unit '+curUnit+' - '+TITLES[G.type]+'</p><div class="score">'+sc+'/'+n+'</div><p class="sc2">câu đúng</p><div class="rv">';
G.log.forEach(function(l){h+='<div class="'+(l[1]?'y':'n')+'"><span class="m">'+(l[1]?'✓':'✗')+'</span><span>'+esc(l[0])+'</span></div>'});
h+='</div><div class="stack"><button class="primary" id="again">Làm lại bài này</button><button id="hm" style="text-align:center">Về danh sách unit</button></div>';
app.innerHTML=h;
document.getElementById("again").onclick=function(){start(G.type)};
document.getElementById("hm").onclick=home;
}
home();
</script>
</body>
</html>
